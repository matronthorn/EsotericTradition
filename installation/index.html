<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;}
  canvas{position:fixed;inset:0;width:100%;height:100%;}
  #void-canvas   {z-index:1;}
  #face-canvas   {z-index:2;}
  #overlay-canvas{z-index:3;}

  /* Footer — sits above everything, lowered 15% so it's cut off at bottom */
  #footer-img{
    position:fixed;
    bottom:-15%;
    left:0;right:0;
    width:100%;height:auto;
    z-index:20;
    pointer-events:none;
  }

  /* Back button only — no title, no subtitle */
  #back-btn{
    position:fixed;top:14px;left:16px;z-index:25;
    font-family:serif;
    font-size:clamp(0.4rem,0.9vw,0.55rem);letter-spacing:0.3em;
    color:rgba(180,0,0,0.45);background:rgba(0,0,0,0.85);
    border:1px solid rgba(180,0,0,0.18);padding:0.4em 0.9em;
    cursor:pointer;transition:all 0.3s;
  }
  #back-btn:hover{color:rgba(255,60,60,0.9);border-color:rgba(200,0,0,0.5);}

  /* Voice flash text */
  #voice-text{
    position:fixed;bottom:18vh;left:50%;transform:translateX(-50%);
    z-index:16;text-align:center;
    font-family:serif;letter-spacing:0.4em;text-transform:uppercase;
    font-size:clamp(1rem,2.8vw,2.6rem);
    color:rgba(255,0,0,0);pointer-events:none;white-space:nowrap;
  }
  #revelation-text{
    position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);
    z-index:5;width:62vw;max-width:720px;text-align:center;
    font-family:serif;font-style:italic;
    font-size:clamp(0.68rem,1.25vw,1rem);
    color:rgba(200,0,0,0);line-height:2;letter-spacing:0.06em;
    pointer-events:none;transition:color 4s ease;
  }

  /* Status log — HIDDEN (display:none removes the visible debug text) */
  #status{display:none;}

  @keyframes voiceFlash{
    0%  {color:rgba(255,0,0,0);text-shadow:none;}
    5%  {color:rgba(255,50,50,1);text-shadow:0 0 40px rgba(255,0,0,1),0 0 80px rgba(200,0,0,0.6);}
    20% {color:rgba(220,0,0,0.85);}
    85% {color:rgba(180,0,0,0.7);}
    100%{color:rgba(255,0,0,0);text-shadow:none;}
  }
  .voice-active{animation:voiceFlash 5.5s ease forwards !important;}
</style>

// ═══════════════════════════════════════════════════════════════
// WEBGL VOID — RED and BLACK only, no purple, no sparkle
// Deep crimson/blood slow implosion field
// ═══════════════════════════════════════════════════════════════
var voidCanvas=document.getElementById('void-canvas');
var gl=voidCanvas.getContext('webgl')||voidCanvas.getContext('experimental-webgl');
var voidProg,uTime,uRes,glStart,glRunning=false;

var VS='attribute vec2 a;void main(){gl_Position=vec4(a,0,1);}';
var FS=[
'precision highp float;',
'uniform float u_time;uniform vec2 u_res;',
'vec2 h2(vec2 p){p=vec2(dot(p,vec2(127.1,311.7)),dot(p,vec2(269.5,183.3)));return -1.0+2.0*fract(sin(p)*43758.5453);}',
'float gn(vec2 p){vec2 i=floor(p),f=fract(p),u=f*f*(3.0-2.0*f);return mix(mix(dot(h2(i),f),dot(h2(i+vec2(1,0)),f-vec2(1,0)),u.x),mix(dot(h2(i+vec2(0,1)),f-vec2(0,1)),dot(h2(i+vec2(1,1)),f-vec2(1,1)),u.x),u.y);}',
'float fbm(vec2 p,float t){float v=0.,a=0.55;mat2 r=mat2(.8,.6,-.6,.8);for(int i=0;i<8;i++){v+=a*gn(p);p=r*p*2.1+vec2(100.)+vec2(t*.04,t*.025);a*=0.48;}return v;}',
'void main(){',
'  vec2 uv=(gl_FragCoord.xy-u_res*.5)/min(u_res.x,u_res.y);',
'  float t=u_time;',
'  float r=length(uv),ang=atan(uv.y,uv.x);',
'  float impl=0.11*sin(r*5.0-t*0.8)*(1.2-r);',
'  float twist=0.42*sin(t*0.09)*exp(-r*1.15);',
'  vec2 w=vec2((r+impl)*cos(ang+twist),(r+impl)*sin(ang+twist));',
'  float n1=fbm(w*2.6+vec2(t*.045,0.),t);',
'  float n2=fbm(w*2.6+vec2(0.,t*.038)+vec2(5.2,1.1),t*1.1);',
'  float n3=fbm(w*2.6+vec2(-t*.028,t*.02)+vec2(10.5,6.8),t*.85);',
// TV static — red tinted
'  float st=mix(gn(uv*80.+vec2(t*4.0,t*2.8)),gn(uv*170.+vec2(-t*5.5,t*4.8)),0.4)*0.09;',
// STRICTLY red → black mapping
// n values are roughly -1..1, remap to 0..1 luminance
'  float lum1=n1*0.5+0.5;',
'  float lum2=n2*0.5+0.5;',
'  float lum3=n3*0.5+0.5;',
'  float lum=lum1*0.55+lum2*0.3+lum3*0.15;',
// Red channel: luminance drives intensity; G and B stay near zero
'  float rr=pow(lum,0.7)*0.95;',  // bright → full red
'  float gg=pow(lum,3.0)*0.04;',  // almost nothing
'  float bb=pow(lum,4.0)*0.02;',  // almost nothing
'  vec3 col=vec3(rr,gg,bb);',
// Vignette — dark edges
'  float vig=1.0-smoothstep(.18,.88,r*(1.0+0.12*sin(t*.17)));',
'  col*=vig*1.2;',
// Static red tint
'  col+=st*vec3(0.7,0.0,0.0);',
// Implosion pulse — deep red
'  col+=0.06*sin(r*8.-t*1.7)*exp(-r*1.4)*vec3(1.0,0.0,0.0);',
// Scanlines
'  col*=0.88+0.12*sin(gl_FragCoord.y*2.4+t*4.5);',
'  col=pow(clamp(col,0.,1.),vec3(1.15,1.5,1.5));',
'  gl_FragColor=vec4(col,1.);',
'}'
].join('');

function cSh(type,src){var s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))log('SH:'+gl.getShaderInfoLog(s));return s;}
function initGL(){
  if(!gl){log('No WebGL');return false;}
  var p=gl.createProgram();
  gl.attachShader(p,cSh(gl.VERTEX_SHADER,VS));
  gl.attachShader(p,cSh(gl.FRAGMENT_SHADER,FS));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS)){log('GL:'+gl.getProgramInfoLog(p));return false;}
  voidProg=p;
  var b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  var loc=gl.getAttribLocation(p,'a');gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  uTime=gl.getUniformLocation(p,'u_time');uRes=gl.getUniformLocation(p,'u_res');
  gl.useProgram(p);glStart=performance.now();return true;
}
function resizeGL(){voidCanvas.width=window.innerWidth;voidCanvas.height=window.innerHeight;if(gl)gl.viewport(0,0,voidCanvas.width,voidCanvas.height);}
function renderGL(){if(!gl||!voidProg)return;gl.uniform1f(uTime,(performance.now()-glStart)/1000);gl.uniform2f(uRes,voidCanvas.width,voidCanvas.height);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);}

// ═══════════════════════════════════════════════════════════════
// IMAGE PROCESSING — Claude Vision + canvas
// bg removal, eye removal, dual mirror layers, red/black duotone
// ═══════════════════════════════════════════════════════════════
var faceCanvas=document.getElementById('face-canvas');
var fCtx=faceCanvas.getContext('2d');
var facePairs=[],pairIdx=0,faceAlpha=1,faceMorphing=false;
var faceHoldStart=0,pairA=null,pairB=null;

function resizeFace(){faceCanvas.width=window.innerWidth;faceCanvas.height=window.innerHeight;}

async function claudeAnalyze(b64,mime){
  try{
    var r=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-api-key':AKEY,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:400,
        messages:[{role:'user',content:[
          {type:'image',source:{type:'base64',media_type:mime,data:b64}},
          {type:'text',text:'Analyze this image carefully. Return ONLY valid JSON, no markdown, no explanation:\n{"hasFace":true,"faceX":0.15,"faceY":0.05,"faceW":0.7,"faceH":0.85,"eye1X":0.35,"eye1Y":0.38,"eye1R":0.06,"eye2X":0.65,"eye2Y":0.38,"eye2R":0.06,"bgR":245,"bgG":240,"bgB":238}\nRules: all x/y/w/h are 0.0-1.0 fractions. eye R is radius as fraction of image width. bgR/G/B = the dominant background color as 0-255 integers. If truly no face set hasFace:false. Be precise about eye positions.'}
        ]}]
      })
    });
    if(!r.ok){log('API '+r.status);throw new Error('HTTP '+r.status);}
    var data=await r.json();
    if(data.error){log('API err:'+data.error.message);throw new Error(data.error.message);}
    var txt=(data.content&&data.content[0]&&data.content[0].text)||'{}';
    // Strip any accidental markdown fences
    txt=txt.replace(/```json|```/g,'').trim();
    return JSON.parse(txt);
  }catch(e){
    log('Vision fallback:'+e.message);
    return{hasFace:true,faceX:0.1,faceY:0.05,faceW:0.8,faceH:0.88,
           eye1X:0.34,eye1Y:0.37,eye1R:0.065,eye2X:0.66,eye2Y:0.37,eye2R:0.065,
           bgR:248,bgG:244,bgB:240};
  }
}

function applyRedBlackDuotone(imageData){
  var d=imageData.data;
  for(var i=0;i<d.length;i+=4){
    if(d[i+3]<10)continue; // skip fully transparent
    var lum=(d[i]*0.299+d[i+1]*0.587+d[i+2]*0.114)/255;
    // bright → blood red/crimson; dark → pure black
    var t=Math.pow(lum,0.75);
    d[i]  =Math.round(t*210);   // R: 0–210
    d[i+1]=Math.round(t*8);     // G: near zero
    d[i+2]=Math.round(t*8);     // B: near zero
    // alpha unchanged
  }
}

function buildMirrorPair(src){
  var W=src.width,H=src.height;

  // Inner mirror: left half → right (mirror axis = centre)
  var cA=document.createElement('canvas');cA.width=W;cA.height=H;
  var ctxA=cA.getContext('2d');
  ctxA.drawImage(src,0,0);
  ctxA.save();ctxA.translate(W,0);ctxA.scale(-1,1);
  ctxA.drawImage(src,0,0,W/2,H, 0,0,W/2,H);
  ctxA.restore();

  // Outer mirror: right half reflected to left (mirror axis = edges)
  var cB=document.createElement('canvas');cB.width=W;cB.height=H;
  var ctxB=cB.getContext('2d');
  ctxB.drawImage(src,0,0);
  ctxB.save();
  ctxB.scale(-1,1);
  ctxB.drawImage(src,W/2,0,W/2,H, -W,0,W/2,H);
  ctxB.restore();

  return{inner:cA,outer:cB};
}

async function processImage(filename){
  return new Promise(async function(resolve){
    var img=new Image();
    img.crossOrigin='anonymous';
    img.src=REPO+'/installation/images/'+encodeURIComponent(filename);

    var loaded=await new Promise(function(r){
      img.onload=function(){r(true);};
      img.onerror=function(){log('Load fail: '+filename);r(false);};
    });
    if(!loaded||!img.naturalWidth){resolve(null);return;}

    log('Processing: '+filename);
    var W=img.naturalWidth,H=img.naturalHeight;

    // Working canvas
    var work=document.createElement('canvas');work.width=W;work.height=H;
    var wCtx=work.getContext('2d');
    wCtx.drawImage(img,0,0);

    // Downsample for Claude (max 600px on longest side)
    var sc=Math.min(1,600/Math.max(W,H));
    var sm=document.createElement('canvas');
    sm.width=Math.round(W*sc);sm.height=Math.round(H*sc);
    var smCtx=sm.getContext('2d');
    smCtx.drawImage(img,0,0,sm.width,sm.height);
    var b64=sm.toDataURL('image/jpeg',0.82).split(',')[1];

    // Claude Vision
    var coords=await claudeAnalyze(b64,'image/jpeg');
    log('Vision: face='+coords.hasFace+' eye1=('+coords.eye1X.toFixed(2)+','+coords.eye1Y.toFixed(2)+')');

    // ── BACKGROUND REMOVAL ──
    // Use Claude's bg color + corner sampling
    var raw=wCtx.getImageData(0,0,W,H);
    var d=raw.data;

    // Refine bg color from corners
    function px(x,y){var i=(y*W+x)*4;return[d[i],d[i+1],d[i+2]];}
    var cs=[px(0,0),px(W-1,0),px(0,H-1),px(W-1,H-1),
            px(Math.floor(W/2),0),px(0,Math.floor(H/2)),px(W-1,Math.floor(H/2)),px(Math.floor(W/2),H-1)];
    var sr=0,sg=0,sb=0;
    cs.forEach(function(c){sr+=c[0];sg+=c[1];sb+=c[2];});
    sr=Math.round((sr/cs.length*0.6+(coords.bgR||245)*0.4));
    sg=Math.round((sg/cs.length*0.6+(coords.bgG||240)*0.4));
    sb=Math.round((sb/cs.length*0.6+(coords.bgB||238)*0.4));

    var thresh=62;
    for(var i=0;i<d.length;i+=4){
      var dr=d[i]-sr,dg=d[i+1]-sg,db=d[i+2]-sb;
      var dist=Math.sqrt(dr*dr+dg*dg+db*db);
      if(dist<thresh){
        // Soft transparency based on distance from bg color
        var softness=1-(dist/thresh);
        d[i+3]=Math.max(0, Math.floor(d[i+3]*(1-softness*softness)));
      }
    }
    wCtx.putImageData(raw,0,0);

    // ── EYE REMOVAL ──
    wCtx.save();
    wCtx.globalCompositeOperation='destination-out';
    [[coords.eye1X,coords.eye1Y,coords.eye1R],
     [coords.eye2X,coords.eye2Y,coords.eye2R]].forEach(function(e){
      var cx=e[0]*W, cy=e[1]*H;
      var rx=Math.max(e[2]*W*1.7, 20);
      var ry=rx*0.62;
      var grad=wCtx.createRadialGradient(cx,cy,0,cx,cy,rx);
      grad.addColorStop(0.45,'rgba(0,0,0,1)');
      grad.addColorStop(1,'rgba(0,0,0,0)');
      wCtx.fillStyle=grad;
      wCtx.beginPath();
      wCtx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);
      wCtx.fill();
    });
    wCtx.restore();

    // ── FACE SCALE UP if small ──
    if(coords.hasFace && coords.faceW && coords.faceW<0.45){
      var fsc=0.8/coords.faceW;
      var fcx=(coords.faceX+coords.faceW/2)*W;
      var fcy=(coords.faceY+(coords.faceH||0.85)/2)*H;
      var sc2=document.createElement('canvas');sc2.width=W;sc2.height=H;
      var sc2Ctx=sc2.getContext('2d');
      sc2Ctx.save();
      sc2Ctx.translate(W/2,H/2);sc2Ctx.scale(fsc,fsc);sc2Ctx.translate(-fcx,-fcy);
      sc2Ctx.drawImage(work,0,0);
      sc2Ctx.restore();
      work=sc2;wCtx=sc2.getContext('2d');
    }

    // ── RED/BLACK DUOTONE ──
    var dt=wCtx.getImageData(0,0,work.width,work.height);
    applyRedBlackDuotone(dt);
    wCtx.putImageData(dt,0,0);

    // ── BUILD MIRROR PAIR ──
    var pair=buildMirrorPair(work);
    log('Done: '+filename);
    resolve(pair);
  });
}

function drawFaceLayer(canvas,alpha,blend){
  if(!canvas||alpha<=0)return;
  var cw=faceCanvas.width,ch=faceCanvas.height;
  var iw=canvas.width,ih=canvas.height;
  if(!iw||!ih)return;
  var scale=Math.max(cw/iw,ch/ih)*0.9;
  var w=iw*scale,h=ih*scale,x=(cw-w)/2,y=(ch-h)/2;
  var pulse=1+0.013*Math.sin(performance.now()*0.0008);
  fCtx.save();
  fCtx.globalAlpha=Math.max(0,Math.min(1,alpha));
  if(blend)fCtx.globalCompositeOperation=blend;
  fCtx.translate(cw/2,ch/2);fCtx.scale(pulse,pulse);fCtx.translate(-cw/2,-ch/2);
  fCtx.drawImage(canvas,x,y,w,h);
  fCtx.restore();
}

function renderFaces(now){
  fCtx.clearRect(0,0,faceCanvas.width,faceCanvas.height);
  if(!facePairs.length)return;
  if(!faceMorphing){
    if(!pairA){pairA=facePairs[0];faceHoldStart=now;}
    // Draw both mirror layers simultaneously
    drawFaceLayer(pairA.inner,1.0,'source-over');
    drawFaceLayer(pairA.outer,0.6,'screen');
    if(now-faceHoldStart>FACE_HOLD_MS){
      faceMorphing=true;
      pairIdx=(pairIdx+1)%facePairs.length;
      pairB=facePairs[pairIdx];
      faceAlpha=0;
    }
  }else{
    faceAlpha+=16/FACE_FADE_MS;
    if(faceAlpha>=1){faceAlpha=1;pairA=pairB;pairB=null;faceMorphing=false;faceHoldStart=now;}
    if(pairA){drawFaceLayer(pairA.inner,1-faceAlpha,'source-over');drawFaceLayer(pairA.outer,(1-faceAlpha)*0.6,'screen');}
    if(pairB){drawFaceLayer(pairB.inner,faceAlpha,'source-over');drawFaceLayer(pairB.outer,faceAlpha*0.6,'screen');}
  }
}

async function loadAndProcess(){
  for(var i=0;i<FACE_FILES.length;i++){
    var pair=await processImage(FACE_FILES[i]);
    if(pair){
      facePairs.push(pair);
      if(facePairs.length===1){pairA=facePairs[0];faceHoldStart=performance.now();}
    }
    if(i<FACE_FILES.length-1)await new Promise(function(r){setTimeout(r,900);});
  }
  log('All faces done: '+facePairs.length);
}

// ═══════════════════════════════════════════════════════════════
// OVERLAY — CRT/scanlines/glitch (red palette only)
// ═══════════════════════════════════════════════════════════════
var overCanvas=document.getElementById('overlay-canvas');
var oCtx=overCanvas.getContext('2d');
var glitchInt=0,glitchTick=0;
function resizeOverlay(){overCanvas.width=window.innerWidth;overCanvas.height=window.innerHeight;}

function renderOverlay(now){
  var W=overCanvas.width,H=overCanvas.height;
  oCtx.clearRect(0,0,W,H);
  // Scanlines
  for(var y=0;y<H;y+=3){
    oCtx.fillStyle='rgba(0,0,0,'+(0.07+0.04*Math.sin(y*0.07+now*0.0012))+')';
    oCtx.fillRect(0,y,W,1.8);
  }
  // Vignette
  var g=oCtx.createRadialGradient(W/2,H/2,H*0.2,W/2,H/2,H*0.8);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,0.75)');
  oCtx.fillStyle=g;oCtx.fillRect(0,0,W,H);
  // Glitch events
  if(now-glitchTick>2000+Math.random()*5000){glitchTick=now;glitchInt=0.9+Math.random()*0.8;}
  if(glitchInt>0){
    for(var i=0;i<Math.floor(glitchInt*18);i++){
      var gy=Math.random()*H,gh=1+Math.random()*12*glitchInt;
      oCtx.save();oCtx.globalAlpha=0.15*glitchInt;oCtx.globalCompositeOperation='screen';
      oCtx.fillStyle='rgba(255,0,0,1)';oCtx.fillRect((Math.random()-0.5)*50*glitchInt,gy,W,gh);
      oCtx.fillStyle='rgba(120,0,0,1)';oCtx.fillRect(-(Math.random()-0.5)*35*glitchInt,gy+0.5,W,gh);
      oCtx.restore();
      if(Math.random()<0.35){
        oCtx.fillStyle='rgba('+(160+Math.random()*95)+',0,0,'+(0.1*glitchInt)+')';
        oCtx.fillRect(Math.random()*W,gy,15+Math.random()*160,gh);
      }
    }
    glitchInt*=0.88;if(glitchInt<0.02)glitchInt=0;
  }
  if(Math.random()<0.09){
    var ny=Math.random()*H;
    oCtx.save();oCtx.globalAlpha=0.1+Math.random()*0.18;
    oCtx.strokeStyle='rgba(200,0,0,0.65)';oCtx.lineWidth=0.5;
    oCtx.beginPath();oCtx.moveTo(0,ny);oCtx.lineTo(W,ny);oCtx.stroke();oCtx.restore();
  }
}

// ═══════════════════════════════════════════════════════════════
// AUDIO ENGINE
// ═══════════════════════════════════════════════════════════════
var audioCtx=null,choirNodes=[],cacophonyAudios=[];

function mkReverb(sec,dec){
  var c=audioCtx.createConvolver();
  var len=Math.floor(audioCtx.sampleRate*sec);
  var b=audioCtx.createBuffer(2,len,audioCtx.sampleRate);
  for(var ch=0;ch<2;ch++){var d=b.getChannelData(ch);for(var i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,dec);}
  c.buffer=b;return c;
}

// ── CHOIR — prominent AHHH drone, audible above mix ──
function buildChoir(){
  var master=audioCtx.createGain();
  master.gain.setValueAtTime(0,audioCtx.currentTime);
  master.gain.linearRampToValueAtTime(0.38,audioCtx.currentTime+14);

  // Compressor keeps choir present
  var comp=audioCtx.createDynamicsCompressor();
  comp.threshold.value=-18;comp.ratio.value=4;comp.attack.value=0.05;comp.release.value=0.3;
  comp.connect(audioCtx.destination);

  var rev=mkReverb(7,1.5);
  var revG=audioCtx.createGain();revG.gain.value=0.65;
  var dryG=audioCtx.createGain();dryG.gain.value=0.35;
  master.connect(dryG);dryG.connect(comp);
  master.connect(rev);rev.connect(revG);revG.connect(comp);

  var BASE=82.4;
  // More voices, including sub-bass
  var voices=[
    {f:BASE*0.5,  v:0.22},{f:BASE*0.501, v:0.20}, // sub octave
    {f:BASE,      v:0.19},{f:BASE*1.003, v:0.17},  // fundamental
    {f:BASE*0.749,v:0.21},{f:BASE*0.751, v:0.19},  // low fifth
    {f:BASE*1.5,  v:0.13},{f:BASE*1.497, v:0.12},  // upper fifth
    {f:BASE*2.0,  v:0.10},{f:BASE*1.998, v:0.09},  // octave
    {f:BASE*2.5,  v:0.08},                          // high fifth
  ];

  voices.forEach(function(cfg,i){
    var osc=audioCtx.createOscillator();osc.type='sawtooth';osc.frequency.value=cfg.f;
    var vib=audioCtx.createOscillator();vib.frequency.value=4.3+i*0.19;
    var vibG=audioCtx.createGain();vibG.gain.value=cfg.f*0.0021;
    vib.connect(vibG);vibG.connect(osc.frequency);
    var bLFO=audioCtx.createOscillator();bLFO.frequency.value=0.05+i*0.007;
    var bAmt=audioCtx.createGain();bAmt.gain.value=0.024;bLFO.connect(bAmt);
    var filt=audioCtx.createBiquadFilter();filt.type='bandpass';
    filt.frequency.value=650+i*55;filt.Q.value=3.0;
    var vG=audioCtx.createGain();vG.gain.value=cfg.v;bAmt.connect(vG.gain);
    osc.connect(filt);filt.connect(vG);vG.connect(master);
    osc.start();vib.start();bLFO.start();
    choirNodes.push(osc,vib,bLFO);
  });
  log('Choir: '+voices.length+' voices');
}

// ── CACOPHONY — 5 simultaneous layers per "cycle", unique params each time ──
// Each cycle: pick 5 from shuffled MEDIA_FILES, assign unique speed/pitch/reverb/delay
// Layers fade in/out at different times, then cycle repeats with fresh params
function buildCacophony(){
  if(!MEDIA_FILES.length){log('No media files');return;}

  // Shared infrastructure
  var cRev=mkReverb(9,1.0);
  var cRevG=audioCtx.createGain();cRevG.gain.value=0.5;
  cRev.connect(cRevG);cRevG.connect(audioCtx.destination);

  // Three delay lines with different times
  function mkDelay(time,fb){
    var d=audioCtx.createDelay(6);d.delayTime.value=time;
    var f=audioCtx.createGain();f.gain.value=fb;
    d.connect(f);f.connect(d);
    return d;
  }
  var dA=mkDelay(0.38,0.44);
  var dB=mkDelay(0.65,0.40);
  var dC=mkDelay(1.20,0.35);
  var delOut=audioCtx.createGain();delOut.gain.value=0.22;
  dA.connect(delOut);dB.connect(delOut);dC.connect(delOut);
  delOut.connect(audioCtx.destination);
  delOut.connect(cRev);

  // Speed ranges: natural (0.85–1.0) to slow (0.3–0.84)
  // Each of the 5 slots gets a distinct speed bucket — no two alike
  var speedBuckets=[
    [0.30,0.42],  // very slow — deeply low
    [0.43,0.55],  // slow
    [0.56,0.70],  // medium-slow
    [0.71,0.85],  // medium
    [0.86,1.00],  // natural
  ];
  // Pan positions — 5 distinct zones
  var panZones=[-0.85,-0.45,0.0,0.45,0.85];
  // Reverb sends — 5 distinct amounts
  var revAmounts=[0.2,0.4,0.55,0.7,0.85];
  // Delay assignments
  var delayBuses=[dA,dB,dC,dA,dB];
  var delaySends=[0.15,0.3,0.45,0.2,0.5];
  // Cycle duration for each slot (how long before fading out and re-randomising)
  var cycleLengths=[28000,34000,40000,31000,37000]; // ms — all different

  // Slot objects — one per simultaneous layer
  var slots=[];

  function startSlot(slotIdx){
    // Pick a random file (avoid reusing recent picks if possible)
    var file=MEDIA_FILES[Math.floor(Math.random()*MEDIA_FILES.length)];
    var bucket=speedBuckets[slotIdx];
    var rate=bucket[0]+Math.random()*(bucket[1]-bucket[0]);

    try{
      var audio=new Audio();
      audio.crossOrigin='anonymous';
      audio.loop=true;
      audio.preload='auto';
      audio.src=REPO+'/installation/media/'+encodeURIComponent(file);
      audio.playbackRate=rate;

      var src=audioCtx.createMediaElementSource(audio);

      // Gain — fade in over 4s
      var gn=audioCtx.createGain();gn.gain.setValueAtTime(0,audioCtx.currentTime);
      gn.gain.linearRampToValueAtTime(0.10+Math.random()*0.14,audioCtx.currentTime+4);

      // Pan
      var pan=audioCtx.createStereoPanner();
      pan.pan.value=panZones[slotIdx]+(Math.random()*0.1-0.05);

      // Slow pan LFO
      var pLFO=audioCtx.createOscillator();
      pLFO.frequency.value=0.012+Math.random()*0.04;
      var pAmt=audioCtx.createGain();pAmt.gain.value=0.15+Math.random()*0.2;
      pLFO.connect(pAmt);pAmt.connect(pan.pan);pLFO.start();

      // NO distortion/waveshaper — clean with just reverb+delay
      var filt=audioCtx.createBiquadFilter();
      filt.type='lowpass';
      filt.frequency.value=800+Math.random()*2200; // gentle roll off
      filt.Q.value=0.4+Math.random()*1.5;

      src.connect(filt);filt.connect(gn);gn.connect(pan);
      pan.connect(audioCtx.destination);

      // Reverb send
      var rvS=audioCtx.createGain();rvS.gain.value=revAmounts[slotIdx];
      pan.connect(rvS);rvS.connect(cRev);

      // Delay send
      var dlS=audioCtx.createGain();dlS.gain.value=delaySends[slotIdx];
      pan.connect(dlS);dlS.connect(delayBuses[slotIdx]);

      audio.play().then(function(){
        log('Slot'+slotIdx+' '+file+' x'+rate.toFixed(2));
      }).catch(function(e){
        log('Slot'+slotIdx+' fail:'+e.message);
      });

      // Schedule fade-out and cycle restart
      var cycleLen=cycleLengths[slotIdx]+(Math.random()*8000-4000);
      var fadeOut=setTimeout(function(){
        gn.gain.linearRampToValueAtTime(0,audioCtx.currentTime+3);
        setTimeout(function(){
          try{audio.pause();audio.src='';}catch(e){}
          try{pLFO.stop();}catch(e){}
          // Restart slot with new random params after a gap
          var gap=2000+Math.random()*6000;
          setTimeout(function(){startSlot(slotIdx);},gap);
        },3500);
      },cycleLen);

      cacophonyAudios.push({audio:audio,lfo:pLFO,gain:gn,timeout:fadeOut});
    }catch(e){log('Slot'+slotIdx+':'+e.message);}
  }

  // Stagger the 5 slot starts so they begin at different times
  var startOffsets=[0,3500,7000,5000,9500];
  for(var s=0;s<5;s++){
    (function(idx){
      setTimeout(function(){startSlot(idx);},startOffsets[idx]);
    })(s);
  }
}

// ═══════════════════════════════════════════════════════════════
// VOICE ENGINE — Revelation verses, inhuman male, no Web Speech distortion
// Uses Web Speech API with careful voice selection
// Male, slow, pitch-floored
// ═══════════════════════════════════════════════════════════════
var BNA=[
  {t:'BE NOT AFRAID',l:'en-US'},{t:'NOLI TIMERE',l:'it-IT'},
  {t:'אַל-תִּירָא',l:'he-IL'},{t:'ΜΗ ΦΟΒΟΥ',l:'el-GR'},
  {t:'لَا تَخَفْ',l:'ar-SA'},{t:"N'AYEZ PAS PEUR",l:'fr-FR'},
  {t:'FÜRCHTE DICH NICHT',l:'de-DE'},{t:'НЕ БОЙСЯ',l:'ru-RU'},
  {t:'恐れるな',l:'ja-JP'},{t:'ÄLÄ PELKÄÄ',l:'fi-FI'},
  {t:'不要害怕',l:'zh-CN'},{t:'NU TE TEME',l:'ro-RO'},
];

var REV=[
  "I am Alpha and Omega. The first. And the last.",
  "Fear not. I am he that liveth. And was dead.",
  "Behold. I am alive for evermore. And I have the keys of hell. And of death.",
  "I know thy works. And where thou dwellest. Even where Satan's seat is.",
  "He that hath an ear. Let him hear. What the Spirit saith.",
  "I will give thee a crown of life.",
  "And I looked. And behold a pale horse. His name that sat on him was Death. And Hell followed with him.",
  "And the stars of heaven fell unto the earth.",
  "And the kings of the earth hid themselves in the dens and in the rocks of the mountains.",
  "Holy. Holy. Holy. Lord God Almighty. Which was. And is. And is to come.",
  "And I saw as it were a sea of glass. Mingled with fire.",
  "Worthy is the Lamb that was slain.",
  "And there was war in heaven. Michael and his angels fought against the dragon.",
  "And the great dragon was cast out. That old serpent. Called the Devil. And Satan.",
  "And his tail drew the third part of the stars of heaven. And cast them to the earth.",
  "And they worshipped the dragon. Who gave power unto the beast.",
  "And he causeth all. Both small and great. Rich and poor. To receive a mark.",
  "And I saw a great white throne. And him that sat on it. From whose face the earth and heaven fled away.",
  "And the books were opened. And another book was opened. Which is the book of life.",
  "And whosoever was not found written in the book of life. Was cast into the lake of fire.",
  "And I saw a new heaven. And a new earth. For the first heaven and the first earth were passed away.",
  "And God shall wipe away all tears from their eyes. And there shall be no more death.",
  "Behold. I come quickly.",
  "I am Alpha. And Omega. The beginning. And the end. The first. And the last.",
];

var bnaIdx=0,revIdx=0,speechActive=false,voiceTO=null;
var voiceEl=document.getElementById('voice-text');
var revelEl=document.getElementById('revelation-text');

// Deep male voice priority list
var MALE_PREF=[
  'Google UK English Male',
  'Microsoft David Desktop','Microsoft David',
  'Microsoft Mark Desktop','Microsoft Mark',
  'Alex','Daniel (English (United Kingdom))','Daniel',
  'Thomas','Fred','Bruce','Junior','Ralph','Albert',
  'Eddy (English (UK))','Reed (English (US))',
  'Rocko (English (US))','Trinoids','Whisper',
];

function getMaleVoice(){
  if(!('speechSynthesis' in window))return null;
  var vs=window.speechSynthesis.getVoices();
  // Priority list
  for(var p=0;p<MALE_PREF.length;p++)
    for(var v=0;v<vs.length;v++)
      if(vs[v].name.indexOf(MALE_PREF[p])>-1){log('Voice: '+vs[v].name);return vs[v];}
  // Any with 'male' in name
  for(var v=0;v<vs.length;v++)
    if(vs[v].name.toLowerCase().indexOf('male')>-1)return vs[v];
  // English fallback
  for(var v=0;v<vs.length;v++)
    if(vs[v].lang==='en-US'||vs[v].lang==='en-GB')return vs[v];
  return vs.length?vs[0]:null;
}

function speakVerse(){
  if(!speechActive)return;
  var phrase=BNA[bnaIdx%BNA.length];bnaIdx++;
  var verse=REV[revIdx%REV.length];revIdx++;

  // Text flash
  voiceEl.textContent=phrase.t;
  voiceEl.classList.remove('voice-active');
  void voiceEl.offsetWidth;
  voiceEl.classList.add('voice-active');

  revelEl.textContent=verse;
  revelEl.style.color='rgba(200,0,0,0.35)';
  setTimeout(function(){revelEl.style.color='rgba(200,0,0,0)';},11000);

  // Trigger glitch
  glitchInt=1.3+Math.random()*0.9;

  if('speechSynthesis' in window){
    window.speechSynthesis.cancel();
    var doSpeak=function(){
      var utt=new SpeechSynthesisUtterance(verse);
      utt.rate=0.38;
      utt.pitch=0;
      utt.volume=1.0;
      utt.lang='en-US';
      var v=getMaleVoice();
      if(v)utt.voice=v;
      window.speechSynthesis.speak(utt);
    };
    if(window.speechSynthesis.getVoices().length>0){
      doSpeak();
    }else{
      window.speechSynthesis.onvoiceschanged=function(){
        window.speechSynthesis.onvoiceschanged=null;doSpeak();
      };
    }
  }

  voiceTO=setTimeout(speakVerse,24000+Math.random()*18000);
}

// ═══════════════════════════════════════════════════════════════
// STOP ALL
// ═══════════════════════════════════════════════════════════════
function stopAll(){
  glRunning=false;speechActive=false;
  if(voiceTO){clearTimeout(voiceTO);voiceTO=null;}
  if('speechSynthesis' in window)window.speechSynthesis.cancel();
  choirNodes.forEach(function(n){try{if(n.stop)n.stop();}catch(e){}});
  cacophonyAudios.forEach(function(s){
    try{clearTimeout(s.timeout);}catch(e){}
    try{if(s.lfo)s.lfo.stop();}catch(e){}
    try{if(s.audio){s.audio.pause();s.audio.src='';}}catch(e){}
  });
  choirNodes=[];cacophonyAudios=[];
  if(audioCtx){try{audioCtx.close();}catch(e){}audioCtx=null;}
}
window.stopAll=stopAll;

// ═══════════════════════════════════════════════════════════════
// MAIN LOOP
// ═══════════════════════════════════════════════════════════════
function loop(now){
  if(!glRunning)return;
  renderGL();renderFaces(now);renderOverlay(now);
  requestAnimationFrame(loop);
}

function resize(){resizeGL();resizeFace();resizeOverlay();}
window.addEventListener('resize',resize,{passive:true});
resize();

// ═══════════════════════════════════════════════════════════════
// START — visuals immediately, audio on first interaction
// ═══════════════════════════════════════════════════════════════
var audioStarted=false;
function startAudio(){
  if(audioStarted)return;audioStarted=true;
  document.removeEventListener('click',startAudio,true);
  document.removeEventListener('touchend',startAudio,true);
  audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended')audioCtx.resume();
  buildChoir();
  buildCacophony();
  speechActive=true;
  setTimeout(speakVerse,5000);
  log('Audio started');
}

if(initGL()){glRunning=true;requestAnimationFrame(loop);}
loadAndProcess();
document.addEventListener('click',startAudio,true);
document.addEventListener('touchend',startAudio,true);
if(window===window.top)history.pushState({installation:true},'','#active');
</script>
