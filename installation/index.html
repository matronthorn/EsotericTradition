<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BE NOT AFRAID — Esoteric Tradition</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=IM+Fell+English:ital@0;1&display=swap');
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  :root{--gold:#c9a84c;}
  html,body{width:100%;height:100%;overflow:hidden;background:#000;cursor:none;}
  #custom-cursor{position:fixed;width:12px;height:12px;border:1px solid rgba(201,168,76,0.6);border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);mix-blend-mode:difference;will-change:left,top;}
  #void-canvas{position:fixed;inset:0;width:100%;height:100%;z-index:1;}
  #face-canvas{position:fixed;inset:0;width:100%;height:100%;z-index:2;mix-blend-mode:screen;}
  #ui{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:3vh 4vw;pointer-events:none;}
  #title-block{text-align:center;opacity:0;animation:titleReveal 4s ease-out 2s forwards;}
  #title-block h1{font-family:'Cinzel Decorative',serif;font-size:clamp(1.2rem,3vw,2.8rem);font-weight:900;color:var(--gold);letter-spacing:0.4em;text-transform:uppercase;text-shadow:0 0 40px rgba(201,168,76,0.4),0 0 80px rgba(201,168,76,0.2);}
  #title-block .subtitle{font-family:'IM Fell English',serif;font-style:italic;font-size:clamp(0.7rem,1.2vw,1rem);color:rgba(240,236,228,0.5);letter-spacing:0.25em;margin-top:0.5rem;}
  #voice-text{position:fixed;bottom:8vh;left:50%;transform:translateX(-50%);z-index:11;text-align:center;font-family:'IM Fell English',serif;font-size:clamp(1rem,2.5vw,2rem);color:rgba(240,236,228,0);letter-spacing:0.3em;text-transform:uppercase;pointer-events:none;white-space:nowrap;text-shadow:0 0 30px rgba(201,168,76,0.8);}

  #enter-screen{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;transition:opacity 2s ease;}
  #enter-screen.fade-out{opacity:0;pointer-events:none;}
  #enter-screen h2{font-family:'Cinzel Decorative',serif;font-size:clamp(1.5rem,4vw,3.5rem);color:var(--gold);letter-spacing:0.5em;text-transform:uppercase;animation:pulseGold 3s ease-in-out infinite;margin-bottom:2rem;text-align:center;}
  #enter-screen p.hint{font-family:'IM Fell English',serif;font-style:italic;color:rgba(240,236,228,0.4);font-size:clamp(0.8rem,1.5vw,1.1rem);letter-spacing:0.2em;}

  #back-btn{position:fixed;top:14px;left:16px;z-index:200;display:none;font-family:'Cinzel Decorative',serif;font-size:clamp(0.5rem,1.1vw,0.65rem);letter-spacing:0.3em;text-transform:uppercase;color:rgba(201,168,76,0.5);background:rgba(0,0,0,0.7);border:1px solid rgba(201,168,76,0.2);padding:0.4em 0.9em;cursor:pointer;transition:all 0.3s;}

  @keyframes pulseGold{0%,100%{opacity:1;text-shadow:0 0 40px rgba(201,168,76,0.6);}50%{opacity:0.7;text-shadow:0 0 80px rgba(201,168,76,0.3);}}
  @keyframes titleReveal{from{opacity:0;transform:translateY(-10px);}to{opacity:1;transform:translateY(0);}}

// BACK / CLOSE

function goBack() {
  try { if (window.parent && window.parent !== window && window.parent.closeInstallation) { window.parent.closeInstallation(); return; } } catch(e) {}
  if (history.length > 1) history.back(); else window.close();
}

// CURSOR
// ═══════════════════════════════════════════════════════
var cursor = document.getElementById('custom-cursor');
document.addEventListener('mousemove', function(e) { cursor.style.left = e.clientX+'px'; cursor.style.top = e.clientY+'px'; }, { passive: true });

// ═══════════════════════════════════════════════════════
// WEBGL VOID SHADER
// ═══════════════════════════════════════════════════════
var voidCanvas = document.getElementById('void-canvas');
var gl = voidCanvas.getContext('webgl') || voidCanvas.getContext('experimental-webgl');
var voidProgram, uTime, uRes, glStart, glRunning = false;

var VS = 'attribute vec2 a_pos;void main(){gl_Position=vec4(a_pos,0.0,1.0);}';
var FS = [
  'precision highp float;uniform float u_time;uniform vec2 u_res;',
  'vec2 hash2(vec2 p){p=vec2(dot(p,vec2(127.1,311.7)),dot(p,vec2(269.5,183.3)));return -1.0+2.0*fract(sin(p)*43758.5453123);}',
  'float gn(vec2 p){vec2 i=floor(p),f=fract(p),u=f*f*(3.0-2.0*f);return mix(mix(dot(hash2(i),f),dot(hash2(i+vec2(1,0)),f-vec2(1,0)),u.x),mix(dot(hash2(i+vec2(0,1)),f-vec2(0,1)),dot(hash2(i+vec2(1,1)),f-vec2(1,1)),u.x),u.y);}',
  'float fbm(vec2 p,float t){float v=0.0,a=0.5;mat2 r=mat2(cos(0.5),sin(0.5),-sin(0.5),cos(0.5));for(int i=0;i<7;i++){v+=a*gn(p);p=r*p*2.1+vec2(100.0)+vec2(t*0.03,t*0.017);a*=0.5;}return v;}',
  'void main(){',
  '  vec2 uv=(gl_FragCoord.xy-u_res*0.5)/min(u_res.x,u_res.y);',
  '  float t=u_time,r=length(uv),ang=atan(uv.y,uv.x);',
  '  float impl=0.08*sin(r*6.0-t*0.7)*(1.0-r);',
  '  float twist=0.3*sin(t*0.13)*exp(-r*1.5);',
  '  vec2 w=vec2((r+impl)*cos(ang+twist),(r+impl)*sin(ang+twist));',
  '  float n1=fbm(w*3.5+vec2(t*0.04,0.0),t);',
  '  float n2=fbm(w*3.5+vec2(0.0,t*0.031)+vec2(5.7,1.3),t*1.1);',
  '  float n3=fbm(w*3.5+vec2(-t*0.027,t*0.019)+vec2(11.2,7.8),t*0.9);',
  '  float st=mix(gn(uv*80.0+vec2(t*3.7,t*2.1)),gn(uv*160.0+vec2(-t*5.1,t*4.3)),0.4)*0.08;',
  '  float hS=t*0.05;',
  '  vec3 c1=0.5+0.5*cos(6.283*(fract(n1*0.5+0.5+hS)+vec3(0.0,0.45,0.7)));',
  '  vec3 c2=0.5+0.5*cos(6.283*(fract(n2*0.5+0.5+hS+0.33)+vec3(0.15,0.0,0.5)));',
  '  vec3 c3=0.5+0.5*cos(6.283*(fract(n3*0.5+0.5+hS+0.67)+vec3(0.5,0.3,0.0)));',
  '  vec3 col=mix(mix(c1,c2,smoothstep(-0.3,0.3,n1)),c3,smoothstep(-0.3,0.3,n2)*0.5);',
  '  col*=(1.0-smoothstep(0.3,1.1,r*(1.0+0.1*sin(t*0.23))))*0.85;',
  '  col+=st+0.04*sin(r*12.0-t*1.5)*exp(-r*2.0)+0.015*sin(gl_FragCoord.y*3.0+t*8.0);',
  '  gl_FragColor=vec4(pow(clamp(col,0.0,1.0),vec3(1.4)),1.0);',
  '}'
].join('');

function compileShader(type,src){var s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))log('Shader:'+gl.getShaderInfoLog(s));return s;}
function initGL(){if(!gl){log('No WebGL');return false;}var prog=gl.createProgram();gl.attachShader(prog,compileShader(gl.VERTEX_SHADER,VS));gl.attachShader(prog,compileShader(gl.FRAGMENT_SHADER,FS));gl.linkProgram(prog);if(!gl.getProgramParameter(prog,gl.LINK_STATUS)){log('GL link fail');return false;}voidProgram=prog;var buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);var loc=gl.getAttribLocation(prog,'a_pos');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);uTime=gl.getUniformLocation(prog,'u_time');uRes=gl.getUniformLocation(prog,'u_res');gl.useProgram(prog);glStart=performance.now();log('WebGL OK');return true;}
function resizeGL(){voidCanvas.width=window.innerWidth;voidCanvas.height=window.innerHeight;if(gl)gl.viewport(0,0,voidCanvas.width,voidCanvas.height);}
function renderGL(){if(!gl||!voidProgram)return;gl.uniform1f(uTime,(performance.now()-glStart)/1000);gl.uniform2f(uRes,voidCanvas.width,voidCanvas.height);gl.drawArrays(gl.TRIANGLE_STRIP,0,4);}

// ═══════════════════════════════════════════════════════
// FACE ENGINE — loads from installation/images/ folder
// (source images, pre-pipeline) OR processed/ once pipeline runs
// ═══════════════════════════════════════════════════════
var faceCanvas = document.getElementById('face-canvas');
var fCtx = faceCanvas.getContext('2d');
var faceImages=[], faceIdx=0, faceAlpha=1, faceMorphing=false, faceHoldStart=0, imgA=null, imgB=null;

function resizeFace(){faceCanvas.width=window.innerWidth;faceCanvas.height=window.innerHeight;}

function drawFace(img,alpha){
  if(!img||alpha<=0)return;
  var cw=faceCanvas.width,ch=faceCanvas.height,iw=img.naturalWidth,ih=img.naturalHeight;
  if(!iw||!ih)return;
  var scale=Math.max(cw/iw,ch/ih)*0.82;
  var w=iw*scale,h=ih*scale,x=(cw-w)/2,y=(ch-h)/2;
  var pulse=1+0.013*Math.sin(performance.now()*0.0009);
  fCtx.save();
  fCtx.globalAlpha=Math.max(0,Math.min(1,alpha));
  fCtx.translate(cw/2,ch/2);fCtx.scale(pulse,pulse);fCtx.translate(-cw/2,-ch/2);
  fCtx.drawImage(img,x,y,w,h);
  fCtx.restore();
}

function renderFaces(now){
  fCtx.clearRect(0,0,faceCanvas.width,faceCanvas.height);
  if(!faceImages.length)return;
  if(!faceMorphing){
    if(!imgA){imgA=faceImages[0];faceHoldStart=now;}
    drawFace(imgA,1);
    if(now-faceHoldStart>FACE_HOLD_MS){faceMorphing=true;faceIdx=(faceIdx+1)%faceImages.length;imgB=faceImages[faceIdx];faceAlpha=0;}
  } else {
    faceAlpha+=16/FACE_FADE_MS;
    if(faceAlpha>=1){faceAlpha=1;imgA=imgB;imgB=null;faceMorphing=false;faceHoldStart=now;}
    drawFace(imgA,1-faceAlpha);drawFace(imgB,faceAlpha);
  }
}

function loadFaces(){
  if(!FACE_FILES.length){log('Faces: list empty');return Promise.resolve();}
  // Try processed/ first (pipeline output), fall back to images/ (raw uploads)
  var loaded = 0;
  var promises = FACE_FILES.map(function(filename){
    return new Promise(function(resolve){
      var img = new Image();
      img.crossOrigin = 'anonymous';
      // Try processed/ first
      img.src = REPO_RAW + '/installation/processed/' + encodeURIComponent(filename);
      img.onload = function(){
        if(img.naturalWidth>0){ faceImages.push(img); loaded++; log('✓ '+filename); }
        resolve();
      };
      img.onerror = function(){
        // Fall back to images/ (raw source)
        var img2 = new Image();
        img2.crossOrigin = 'anonymous';
        img2.src = REPO_RAW + '/installation/images/' + encodeURIComponent(filename);
        img2.onload = function(){
          if(img2.naturalWidth>0){ faceImages.push(img2); loaded++; log('✓ src/'+filename); }
          resolve();
        };
        img2.onerror = function(){ log('✗ '+filename); resolve(); };
      };
    });
  });
  return Promise.all(promises).then(function(){
    log('Faces: '+loaded+'/'+FACE_FILES.length+' loaded');
    // Shuffle so order varies each visit
    faceImages.sort(function(){return Math.random()-0.5;});
  });
}

// ═══════════════════════════════════════════════════════
// CHOIR
// ═══════════════════════════════════════════════════════
var audioCtx=null, choirNodes=[], cacophonyAudios=[];

function buildChoir(){
  var master=audioCtx.createGain();
  master.gain.setValueAtTime(0,audioCtx.currentTime);
  master.gain.linearRampToValueAtTime(0.18,audioCtx.currentTime+10);
  master.connect(audioCtx.destination);
  var conv=audioCtx.createConvolver();
  var rLen=audioCtx.sampleRate*4;
  var rBuf=audioCtx.createBuffer(2,rLen,audioCtx.sampleRate);
  for(var ch=0;ch<2;ch++){var d=rBuf.getChannelData(ch);for(var i=0;i<rLen;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/rLen,2.2);}
  conv.buffer=rBuf;
  var dry=audioCtx.createGain();dry.gain.value=0.28;dry.connect(master);
  var wet=audioCtx.createGain();wet.gain.value=0.72;wet.connect(conv);conv.connect(master);
  [CHOIR_BASE_HZ,CHOIR_BASE_HZ*1.003,CHOIR_BASE_HZ*1.5,CHOIR_BASE_HZ*1.498,
   CHOIR_BASE_HZ*2.0,CHOIR_BASE_HZ*1.997,CHOIR_BASE_HZ*2.5,CHOIR_BASE_HZ*0.748
  ].forEach(function(freq,i){
    var osc=audioCtx.createOscillator();osc.type='sawtooth';osc.frequency.value=freq;
    var vib=audioCtx.createOscillator();vib.frequency.value=4.8+i*0.28;
    var vibG=audioCtx.createGain();vibG.gain.value=freq*0.0018;vib.connect(vibG);vibG.connect(osc.frequency);
    var bLFO=audioCtx.createOscillator();bLFO.frequency.value=0.065+i*0.009;
    var bAmt=audioCtx.createGain();bAmt.gain.value=0.018;bLFO.connect(bAmt);
    var filt=audioCtx.createBiquadFilter();filt.type='bandpass';filt.frequency.value=750+i*55;filt.Q.value=2.8;
    var vG=audioCtx.createGain();vG.gain.value=Math.max(0.02,0.13-i*0.009);bAmt.connect(vG.gain);
    osc.connect(filt);filt.connect(vG);vG.connect(dry);vG.connect(wet);
    osc.start();vib.start();bLFO.start();
    choirNodes.push(osc,vib,bLFO);
  });
  log('Choir: 8 voices');
}

// ═══════════════════════════════════════════════════════
// CACOPHONY — MP4 audio layers
// src set before createMediaElementSource (critical order)
// ═══════════════════════════════════════════════════════
function buildCacophony(){
  if(!MEDIA_FILES.length){log('Cacophony: no files');return;}
  var shuffled=MEDIA_FILES.slice().sort(function(){return Math.random()-0.5;});
  var layers=shuffled.slice(0,Math.min(shuffled.length,4));
  log('Cacophony: queuing '+layers.length+' layers');
  layers.forEach(function(filename,i){
    var delay=1500+i*2500+Math.random()*3000;
    setTimeout(function(){
      try{
        var audio=new Audio();
        audio.crossOrigin='anonymous';
        audio.loop=true;
        audio.preload='auto';
        // src set BEFORE createMediaElementSource
        audio.src=REPO_RAW+'/installation/media/'+encodeURIComponent(filename);
        var srcNode=audioCtx.createMediaElementSource(audio);
        var gainNode=audioCtx.createGain();
        gainNode.gain.value=0.07+Math.random()*0.11;
        srcNode.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        audio.playbackRate=0.6+Math.random()*0.8;
        audio.play().then(function(){log('♪ '+filename);}).catch(function(e){log('✗ '+filename+': '+e.message);});
        cacophonyAudios.push(audio);
      }catch(e){log('Cacophony err: '+e.message);}
    },delay);
  });
}

var bnaIdx=0,revIdx=0,speechActive=false,voiceTO=null;

function speakBNA(){
  if(!speechActive)return;

  voiceEl.textContent=phrase.t;
  voiceEl.classList.remove('voice-active');void voiceEl.offsetWidth;voiceEl.classList.add('voice-active');
  var verse=REV[revIdx%REV.length];revIdx++;
  revelEl.textContent=verse;revelEl.style.color='rgba(201,168,76,0.22)';
  setTimeout(function(){revelEl.style.color='rgba(201,168,76,0)';},7000);
  if('speechSynthesis' in window){
    window.speechSynthesis.cancel();
    var utt=new SpeechSynthesisUtterance(phrase.t);
    utt.rate=0.5;utt.pitch=0;utt.volume=0.65;utt.lang=phrase.l;
    window.speechSynthesis.speak(utt);
  }
  voiceTO=setTimeout(speakBNA,20000+Math.random()*24000);
}

// ═══════════════════════════════════════════════════════
// STOP ALL
// ═══════════════════════════════════════════════════════
function stopAll(){
  glRunning=false;speechActive=false;
  if(voiceTO){clearTimeout(voiceTO);voiceTO=null;}
  if('speechSynthesis' in window)window.speechSynthesis.cancel();
  choirNodes.forEach(function(n){try{n.stop();}catch(e){}});choirNodes=[];
  cacophonyAudios.forEach(function(a){try{a.pause();a.src='';}catch(e){}});cacophonyAudios=[];
  if(audioCtx){try{audioCtx.close();}catch(e){}audioCtx=null;}
}
window.stopAll=stopAll;

// ═══════════════════════════════════════════════════════
// MAIN LOOP
// ═══════════════════════════════════════════════════════
function loop(now){if(!glRunning)return;renderGL();renderFaces(now);requestAnimationFrame(loop);}
function resize(){resizeGL();resizeFace();}
window.addEventListener('resize',resize,{passive:true});
resize();

// ═══════════════════════════════════════════════════════
// ENTRY
// ═══════════════════════════════════════════════════════
var enterScreen=document.getElementById('enter-screen');
var backBtn=document.getElementById('back-btn');
var started=false;

function startInstallation(){
  if(started)return;started=true;
  enterScreen.classList.add('fade-out');
  setTimeout(function(){enterScreen.style.display='none';},2000);
  backBtn.classList.add('visible');
  audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended')audioCtx.resume();
  buildChoir();
  buildCacophony();
  speechActive=true;
  setTimeout(speakBNA,6000);
  if(initGL()){glRunning=true;loadFaces().then(function(){requestAnimationFrame(loop);});}
  if(window===window.top)history.pushState({installation:true},'','#active');
}
enterScreen.addEventListener('click',startInstallation);
enterScreen.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' ')startInstallation();});
</script>
