'precision highp float;',
'uniform float u_time;uniform vec2 u_res;',

'vec2 h2(vec2 p){p=vec2(dot(p,vec2(127.1,311.7)),dot(p,vec2(269.5,183.3)));return -1.0+2.0*fract(sin(p)*43758.5453);}',

'float fbm(vec2 p,float t){float v=0.,a=0.55;mat2 r=mat2(.8,.6,-.6,.8);for(int i=0;i<8;i++){v+=a*gn(p);p=r*p*2.1+vec2(100.)+vec2(t*.042,t*.027);a*=0.48;}return v;}',

// Sparkle function — sharp bright points
'float sparkle(vec2 uv, float t){',
'  vec2 grid=fract(uv*18.0+vec2(t*0.3,-t*0.2))-0.5;',
'  float d=length(grid);',
'  float s=exp(-d*d*120.0);', // tight bright dot
'  float flicker=0.5+0.5*sin(t*7.3+uv.x*31.0+uv.y*17.0);',
'  return s*flicker;',
'}',
'float sparkle2(vec2 uv, float t){',
'  vec2 grid=fract(uv*34.0+vec2(-t*0.17,t*0.41))-0.5;',
'  float d=length(grid);',
'  return exp(-d*d*200.0)*(0.3+0.7*sin(t*11.0+uv.x*53.0));',
'}',

'void main(){',
'  vec2 uv=(gl_FragCoord.xy-u_res*.5)/min(u_res.x,u_res.y);',
'  float t=u_time;',
'  float r=length(uv),ang=atan(uv.y,uv.x);',

// Implosion warp
'  float impl=0.12*sin(r*5.5-t*0.85)*(1.3-r);',
'  float twist=0.5*sin(t*0.1)*exp(-r*1.1);',
'  vec2 w=vec2((r+impl)*cos(ang+twist),(r+impl)*sin(ang+twist));',

// Noise fields
'  float n1=fbm(w*2.8+vec2(t*.05,0.),t);',
'  float n2=fbm(w*2.8+vec2(0.,t*.04)+vec2(5.7,1.3),t*1.12);',
'  float n3=fbm(w*2.8+vec2(-t*.032,t*.021)+vec2(11.0,7.0),t*.87);',

// TV static
'  float st=mix(gn(uv*85.+vec2(t*4.5,t*3.1)),gn(uv*190.+vec2(-t*6.2,t*5.3)),0.4)*0.11;',

// RED / PURPLE / BLACK palette — no other colors
// c1 = deep crimson/blood red
// c2 = dark violet/purple
// c3 = near black with slight red tint
'  float hS=t*0.04;',
'  float h1=fract(n1*0.5+0.5+hS);',
'  float h2v=fract(n2*0.5+0.5+hS+0.15);', // purple range
'  float h3v=fract(n3*0.5+0.5+hS);',

// Map h1 to red tones
'  vec3 c1=vec3(h1*0.9+0.1, 0.0, h1*0.08);',          // red
'  vec3 c2=vec3(h2v*0.45, 0.0, h2v*0.7+0.1);',          // purple
'  vec3 c3=vec3(h3v*0.15, 0.0, h3v*0.08);',             // near black

'  vec3 col=mix(mix(c1,c2,smoothstep(-.3,.3,n1)),c3,smoothstep(-.2,.2,n2)*0.55);',

// Stronger vignette — darker edges
'  float vig=1.0-smoothstep(.2,.9,r*(1.0+0.15*sin(t*.18)));',
'  col*=vig*1.3;',
'  col+=st*vec3(0.8,0.0,0.15);', // static tinted red

// Sparkles — bright red/white points
'  float sp1=sparkle(uv+vec2(n1*.1,n2*.1),t)*0.9;',
'  float sp2=sparkle2(uv+vec2(n2*.08,n3*.08),t)*0.6;',
'  col+=sp1*vec3(1.0,0.1,0.1);',   // red sparkles

'  col+=sp1*sp2*vec3(1.0,0.8,0.8)*0.8;', // white hotspots where they overlap

// Implosion pulse in red
'  col+=0.08*sin(r*9.-t*2.0)*exp(-r*1.3)*vec3(1.0,0.0,0.05);',

function cSh(type,src){var s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))log('Shader:'+gl.getShaderInfoLog(s));return s;}
function initGL(){

  if(!gl.getProgramParameter(p,gl.LINK_STATUS)){log('GL:'+gl.getProgramInfoLog(p));return false;}
  voidProg=p;
  var b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);

  gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  uTime=gl.getUniformLocation(p,'u_time');uRes=gl.getUniformLocation(p,'u_res');
  gl.useProgram(p);glStart=performance.now();log('GL OK');return true;
}

// IMAGE PROCESSING — Claude Vision + canvas manipulation
// Red/black duotone, dual mirror layers, eye/bg removal

var faceCanvas = document.getElementById('face-canvas');
var fCtx = faceCanvas.getContext('2d');

// Store pairs: {inner, outer} — two mirror versions

// Claude Vision analysis
async function claudeAnalyze(b64, mime){
  try{
    var r=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-api-key':AKEY,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',
        max_tokens:400,
        messages:[{role:'user',content:[
          {type:'image',source:{type:'base64',media_type:mime,data:b64}},
          {type:'text',text:'Return ONLY this JSON with no markdown or explanation:\n{"hasFace":true,"faceX":0.15,"faceY":0.05,"faceW":0.7,"faceH":0.85,"eye1X":0.35,"eye1Y":0.38,"eye1R":0.055,"eye2X":0.65,"eye2Y":0.38,"eye2R":0.055,"bgR":240,"bgG":240,"bgB":240}\nAll x/y/w/h/r values are 0.0-1.0 fractions of image size. bgR/G/B = dominant background color 0-255. If no face, hasFace:false.'}
        ]}]
      })
    });
    var data=await r.json();
    var txt=data.content&&data.content[0]&&data.content[0].text||'{}';
    return JSON.parse(txt.replace(/```json|```/g,'').trim());
  }catch(e){
    log('Vision err:'+e.message);
    return{hasFace:true,faceX:0.1,faceY:0.05,faceW:0.8,faceH:0.88,eye1X:0.35,eye1Y:0.36,eye1R:0.06,eye2X:0.65,eye2Y:0.36,eye2R:0.06,bgR:245,bgG:245,bgB:245};
  }
}

// Apply red/black duotone to canvas imageData
function applyDuotone(imageData){
  var d=imageData.data;
  for(var i=0;i<d.length;i+=4){
    // Luminance
    var lum=(d[i]*0.299+d[i+1]*0.587+d[i+2]*0.114)/255;
    // Map luminance to red (bright) → black (dark) with purple midtones
    var r,g,b;
    if(lum>0.5){
      // bright areas → red/crimson
      var t=(lum-0.5)*2;
      r=Math.floor(150+t*105); // 150→255
      g=Math.floor(t*20);       // 0→20
      b=Math.floor(t*15);       // 0→15
    } else {
      // dark areas → deep purple/black
      var t=lum*2;
      r=Math.floor(t*80);        // 0→80
      g=0;
      b=Math.floor(t*60);        // 0→60 (purple shadow)
    }
    d[i]=r; d[i+1]=g; d[i+2]=b;
    // alpha untouched
  }
  return imageData;
}

// Build both mirror variants from a processed source canvas
function buildMirrorPair(src){
  var W=src.width, H=src.height;

  // ── Mirror A: inner mirror (left half → right) ──
  var cA=document.createElement('canvas'); cA.width=W; cA.height=H;
  var ctxA=cA.getContext('2d');
  ctxA.drawImage(src,0,0); // draw base
  ctxA.save();
  ctxA.translate(W,0); ctxA.scale(-1,1);
  ctxA.drawImage(src,0,0,W/2,H,0,0,W/2,H); // mirror left→right
  ctxA.restore();

  // ── Mirror B: outer mirror (right half reflected to left, from outer edges inward) ──
  var cB=document.createElement('canvas'); cB.width=W; cB.height=H;
  var ctxB=cB.getContext('2d');
  ctxB.drawImage(src,0,0); // draw base
  ctxB.save();
  // Mirror right half to left (outer→inner)
  ctxB.translate(0,0); ctxB.scale(-1,1);
  ctxB.drawImage(src,W/2,0,W/2,H,-W,0,W/2,H);
  ctxB.restore();

  return {inner:cA, outer:cB};
}

async function processImage(filename){
  return new Promise(async function(resolve){
    var img=new Image(); img.crossOrigin='anonymous';
    img.src=REPO+'/installation/images/'+encodeURIComponent(filename);
    await new Promise(function(r){img.onload=r;img.onerror=function(){log('Img load fail:'+filename);r();};});
    if(!img.naturalWidth){resolve(null);return;}

    log('Analyzing: '+filename);
    var W=img.naturalWidth, H=img.naturalHeight;

    // Draw to working canvas
    var work=document.createElement('canvas'); work.width=W; work.height=H;
    var wCtx=work.getContext('2d');
    wCtx.drawImage(img,0,0);

    // Get base64 for Claude (resize for speed — max 512px)
    var scale=Math.min(1,512/Math.max(W,H));
    var small=document.createElement('canvas');
    small.width=Math.round(W*scale); small.height=Math.round(H*scale);
    var sCtx=small.getContext('2d');
    sCtx.drawImage(img,0,0,small.width,small.height);
    var b64=small.toDataURL('image/jpeg',0.8).split(',')[1];

    // Call Claude Vision
    var coords=await claudeAnalyze(b64,'image/jpeg');
    log('Coords OK: '+filename);

    // Get pixel data for manipulation
    var imgData=wCtx.getImageData(0,0,W,H);
    var d=imgData.data;

    // ── Background removal ──
    // Use Claude's reported bg color + flood-fill-style edge removal
    var bgR=coords.bgR||245, bgG=coords.bgG||245, bgB=coords.bgB||245;
    var thresh=55;
    // Also sample actual corners for refinement
    function cornerColor(px,py){var i=(py*W+px)*4;return[d[i],d[i+1],d[i+2]];}
    var corners=[cornerColor(0,0),cornerColor(W-1,0),cornerColor(0,H-1),cornerColor(W-1,H-1)];
    var cornerBgR=0,cornerBgG=0,cornerBgB=0;
    corners.forEach(function(c){cornerBgR+=c[0];cornerBgG+=c[1];cornerBgB+=c[2];});
    cornerBgR=Math.round((cornerBgR/4+bgR)/2);
    cornerBgG=Math.round((cornerBgG/4+bgG)/2);
    cornerBgB=Math.round((cornerBgB/4+bgB)/2);

    for(var i=0;i<d.length;i+=4){
      var dr=d[i]-cornerBgR, dg=d[i+1]-cornerBgG, db=d[i+2]-cornerBgB;
      var dist=Math.sqrt(dr*dr+dg*dg+db*db);
      if(dist<thresh){
        // Soft edge removal
        d[i+3]=Math.max(0,Math.floor(d[i+3]*(dist/thresh)));
      }
    }

    // ── Eye removal ──
    var eyes=[
      [coords.eye1X,coords.eye1Y,coords.eye1R],
      [coords.eye2X,coords.eye2Y,coords.eye2R]
    ];
    // Write back modified data first
    wCtx.putImageData(imgData,0,0);

    // Now draw eye holes
    wCtx.save();
    wCtx.globalCompositeOperation='destination-out';
    eyes.forEach(function(e){
      var cx=e[0]*W, cy=e[1]*H;
      var rx=Math.max(e[2]*W*1.6, 18);
      var ry=rx*0.65;
      var grad=wCtx.createRadialGradient(cx,cy,0,cx,cy,rx);
      grad.addColorStop(0.4,'rgba(0,0,0,1)');
      grad.addColorStop(1,'rgba(0,0,0,0)');
      wCtx.fillStyle=grad;
      wCtx.beginPath();
      wCtx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);
      wCtx.fill();
    });
    wCtx.restore();

    // ── Scale up face if small ──
    if(coords.faceW&&coords.faceW<0.45){
      var fScale=0.82/coords.faceW;
      var fcx=(coords.faceX+(coords.faceW||0.8)/2)*W;
      var fcy=(coords.faceY+(coords.faceH||0.9)/2)*H;
      var scaled=document.createElement('canvas'); scaled.width=W; scaled.height=H;
      var sCtx2=scaled.getContext('2d');
      sCtx2.save();
      sCtx2.translate(W/2,H/2);
      sCtx2.scale(fScale,fScale);
      sCtx2.translate(-fcx,-fcy);
      sCtx2.drawImage(work,0,0);
      sCtx2.restore();
      work=scaled; wCtx=scaled.getContext('2d');
    }

    // ── Apply red/black duotone ──
    var finalData=wCtx.getImageData(0,0,W,H);
    applyDuotone(finalData);
    wCtx.putImageData(finalData,0,0);

    // ── Build mirror pair ──
    var pair=buildMirrorPair(work);
    log('✓ '+filename);
    resolve(pair);
  });
}

// ── Draw a face layer ──
function drawFaceLayer(canvas, alpha, blendMode){
  if(!canvas||alpha<=0)return;
  var cw=faceCanvas.width,ch=faceCanvas.height;
  var iw=canvas.width,ih=canvas.height;
  if(!iw||!ih)return;
  var scale=Math.max(cw/iw,ch/ih)*0.9;
  var w=iw*scale,h=ih*scale,x=(cw-w)/2,y=(ch-h)/2;
  var pulse=1+0.014*Math.sin(performance.now()*0.0008);
  fCtx.save();
  fCtx.globalAlpha=Math.max(0,Math.min(1,alpha));
  if(blendMode)fCtx.globalCompositeOperation=blendMode;
  fCtx.translate(cw/2,ch/2);fCtx.scale(pulse,pulse);fCtx.translate(-cw/2,-ch/2);
  fCtx.drawImage(canvas,x,y,w,h);
  fCtx.restore();
}

function renderFaces(now){
  fCtx.clearRect(0,0,faceCanvas.width,faceCanvas.height);
  if(!facePairs.length)return;

  var curPair, nextPair, morphAlpha=1;

  if(!faceMorphing){
    if(!pairA){pairA=facePairs[0];faceHoldStart=now;}
    curPair=pairA;
    if(now-faceHoldStart>FACE_HOLD_MS){
      faceMorphing=true;
      pairIdx=(pairIdx+1)%facePairs.length;
      pairB=facePairs[pairIdx];
      faceAlpha=0;
    }
  } else {
    faceAlpha+=16/FACE_FADE_MS;
    if(faceAlpha>=1){
      faceAlpha=1;pairA=pairB;pairB=null;faceMorphing=false;faceHoldStart=now;
    }
  }

  // Draw current pair — always two layers simultaneously
  if(pairA){
    // Layer 1: inner mirror at full alpha
    drawFaceLayer(pairA.inner, faceMorphing ? 1-faceAlpha : 1.0, 'source-over');
    // Layer 2: outer mirror at 0.65 alpha, screen blend so they glow together
    drawFaceLayer(pairA.outer, (faceMorphing ? 1-faceAlpha : 1.0)*0.65, 'screen');
  }
  // Crossfade to next pair
  if(faceMorphing && pairB){
    drawFaceLayer(pairB.inner, faceAlpha, 'source-over');
    drawFaceLayer(pairB.outer, faceAlpha*0.65, 'screen');
  }
}

async function loadAndProcess(){
  for(var i=0;i<FACE_FILES.length;i++){
    var pair=await processImage(FACE_FILES[i]);
    if(pair){
      facePairs.push(pair);
      if(facePairs.length===1){pairA=facePairs[0];faceHoldStart=performance.now();}
    }
    if(i<FACE_FILES.length-1)await new Promise(function(r){setTimeout(r,900);});
  }
  log('Pairs done: '+facePairs.length);
}

// ═══════════════════════════════════════════════════════════════
// OVERLAY CANVAS — CRT/glitch/scanlines
// ═══════════════════════════════════════════════════════════════
var overCanvas=document.getElementById('overlay-canvas');
var oCtx=overCanvas.getContext('2d');
var glitchInt=0, glitchTick=0;

function resizeOverlay(){overCanvas.width=window.innerWidth;overCanvas.height=window.innerHeight;}

function renderOverlay(now){
  var W=overCanvas.width,H=overCanvas.height;
  oCtx.clearRect(0,0,W,H);

  // Scanlines
  for(var y=0;y<H;y+=3){
    oCtx.fillStyle='rgba(0,0,0,'+(0.07+0.04*Math.sin(y*0.08+now*0.0015))+')';
    oCtx.fillRect(0,y,W,1.8);
  }

  // CRT vignette
  var g=oCtx.createRadialGradient(W/2,H/2,H*0.22,W/2,H/2,H*0.82);
  g.addColorStop(0,'rgba(0,0,0,0)');
  g.addColorStop(1,'rgba(0,0,0,0.78)');
  oCtx.fillStyle=g;oCtx.fillRect(0,0,W,H);

  // Red chromatic aberration edges
  var eg=oCtx.createRadialGradient(W/2,H/2,H*0.35,W/2,H/2,H*0.85);
  eg.addColorStop(0,'rgba(180,0,0,0)');
  eg.addColorStop(1,'rgba(180,0,0,0.12)');
  oCtx.fillStyle=eg;oCtx.fillRect(0,0,W,H);

  // Glitch events
  if(now-glitchTick>1800+Math.random()*4500){glitchTick=now;glitchInt=1.2+Math.random()*0.8;}
  if(glitchInt>0){
    var count=Math.floor(glitchInt*22);
    for(var i=0;i<count;i++){
      var gy=Math.random()*H;
      var gh=1+Math.random()*14*glitchInt;
      // RGB split
      oCtx.save();
      oCtx.globalAlpha=0.18*glitchInt;
      oCtx.globalCompositeOperation='screen';
      oCtx.fillStyle='rgba(255,0,0,1)';
      oCtx.fillRect((Math.random()-0.5)*60*glitchInt,gy,W,gh);
      oCtx.fillStyle='rgba(100,0,80,1)';
      oCtx.fillRect(-(Math.random()-0.5)*40*glitchInt,gy+0.5,W,gh);
      oCtx.restore();
      // Block corruption
      if(Math.random()<0.4){
        var bx=Math.random()*W;
        oCtx.fillStyle='rgba('+(180+Math.random()*75)+',0,'+(Math.random()*60)+','+(0.12*glitchInt)+')';
        oCtx.fillRect(bx,gy,15+Math.random()*180,gh);
      }
    }
    // Occasional full-frame flicker
    if(Math.random()<0.06*glitchInt){
      oCtx.fillStyle='rgba(80,0,0,'+(0.08*glitchInt)+')';
      oCtx.fillRect(0,0,W,H);
    }
    glitchInt*=0.87;
    if(glitchInt<0.02)glitchInt=0;
  }

  // Noise lines
  if(Math.random()<0.1){
    var ny=Math.random()*H;
    oCtx.save();oCtx.globalAlpha=0.12+Math.random()*0.2;
    oCtx.strokeStyle='rgba(200,0,50,0.7)';oCtx.lineWidth=0.6;
    oCtx.beginPath();oCtx.moveTo(0,ny);oCtx.lineTo(W,ny);oCtx.stroke();
    oCtx.restore();
  }
}

// ═══════════════════════════════════════════════════════════════
// AUDIO ENGINE
// ═══════════════════════════════════════════════════════════════
var audioCtx=null,choirNodes=[],cacophonyNodes=[];

function mkReverb(sec,dec){
  var c=audioCtx.createConvolver();
  var len=audioCtx.sampleRate*sec;
  var b=audioCtx.createBuffer(2,len,audioCtx.sampleRate);
  for(var ch=0;ch<2;ch++){var d=b.getChannelData(ch);for(var i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,dec);}
  c.buffer=b;return c;
}

function buildChoir(){
  var master=audioCtx.createGain();
  master.gain.setValueAtTime(0,audioCtx.currentTime);
  master.gain.linearRampToValueAtTime(0.32,audioCtx.currentTime+14);
  var rev=mkReverb(7,1.6);
  var revG=audioCtx.createGain();revG.gain.value=0.7;
  var dryG=audioCtx.createGain();dryG.gain.value=0.3;
  master.connect(dryG);dryG.connect(audioCtx.destination);
  master.connect(rev);rev.connect(revG);revG.connect(audioCtx.destination);
  var BASE=82.4;
  var voices=[
    {f:BASE,v:0.18},{f:BASE*1.003,v:0.16},{f:BASE*0.749,v:0.20},
    {f:BASE*0.751,v:0.18},{f:BASE*1.5,v:0.13},{f:BASE*1.497,v:0.12},
    {f:BASE*2.0,v:0.10},{f:BASE*1.998,v:0.09},{f:BASE*2.5,v:0.08},
    {f:BASE*0.5,v:0.22},{f:BASE*0.501,v:0.20},
  ];
  voices.forEach(function(cfg,i){
    var osc=audioCtx.createOscillator();osc.type='sawtooth';osc.frequency.value=cfg.f;
    var vib=audioCtx.createOscillator();vib.frequency.value=4.2+i*0.21;
    var vibG=audioCtx.createGain();vibG.gain.value=cfg.f*0.0022;vib.connect(vibG);vibG.connect(osc.frequency);
    var bLFO=audioCtx.createOscillator();bLFO.frequency.value=0.05+i*0.007;
    var bAmt=audioCtx.createGain();bAmt.gain.value=0.025;bLFO.connect(bAmt);
    var filt=audioCtx.createBiquadFilter();filt.type='bandpass';
    filt.frequency.value=700+i*60;filt.Q.value=3.2;
    var vG=audioCtx.createGain();vG.gain.value=cfg.v;bAmt.connect(vG.gain);
    osc.connect(filt);filt.connect(vG);vG.connect(master);
    osc.start();vib.start();bLFO.start();
    choirNodes.push(osc,vib,bLFO);
  });
  log('Choir: '+voices.length+' voices');
}

function buildCacophony(){
  if(!MEDIA_FILES.length){log('No media');return;}

  // Shared reverb
  var cRev=mkReverb(10,1.0);
  var cRevG=audioCtx.createGain();cRevG.gain.value=0.6;
  cRev.connect(cRevG);cRevG.connect(audioCtx.destination);

  // Dual delay lines — long and short
  var dA=audioCtx.createDelay(5);dA.delayTime.value=0.43;
  var dB=audioCtx.createDelay(5);dB.delayTime.value=0.71;
  var dC=audioCtx.createDelay(5);dC.delayTime.value=1.37;
  var fbA=audioCtx.createGain();fbA.gain.value=0.48;
  var fbB=audioCtx.createGain();fbB.gain.value=0.41;
  var fbC=audioCtx.createGain();fbC.gain.value=0.35;
  dA.connect(fbA);fbA.connect(dA);
  dB.connect(fbB);fbB.connect(dB);
  dC.connect(fbC);fbC.connect(dC);
  var delOut=audioCtx.createGain();delOut.gain.value=0.28;
  dA.connect(delOut);dB.connect(delOut);dC.connect(delOut);
  delOut.connect(audioCtx.destination);
  delOut.connect(cRev);

  // Use ALL files — each gets its own slot with extreme variation
  var shuffled=MEDIA_FILES.slice().sort(function(){return Math.random()-0.5;});

  shuffled.forEach(function(filename,i){
    // Stagger all of them — some immediate, some very delayed
    var delay=500+i*1200+Math.random()*2500;
    setTimeout(function(){
      try{
        var audio=new Audio();
        audio.crossOrigin='anonymous';
        audio.loop=true;
        audio.preload='auto';
        audio.src=REPO+'/installation/media/'+encodeURIComponent(filename);

        // Extreme pitch variation — some very slow/low, some fast/high
        var rates=[0.25,0.3,0.4,0.5,0.6,0.7,0.85,1.0,1.2,1.5,1.8];
        audio.playbackRate=rates[i%rates.length]+(Math.random()*0.15-0.075);

        var src=audioCtx.createMediaElementSource(audio);

        // Per-layer volume
        var gn=audioCtx.createGain();
        gn.gain.value=0.08+Math.random()*0.16;

        // Panner — hard pan some, centre others
        var pan=audioCtx.createStereoPanner();
        var panVals=[-0.9,-0.7,-0.4,0,0,0.4,0.7,0.9,-0.6,0.6,-0.8];
        pan.pan.value=panVals[i%panVals.length];

        // Pan LFO — slow movement
        var panLFO=audioCtx.createOscillator();
        panLFO.frequency.value=0.015+Math.random()*0.06;
        var panAmt=audioCtx.createGain();
        panAmt.gain.value=0.3+Math.random()*0.5;
        panLFO.connect(panAmt);panAmt.connect(pan.pan);
        panLFO.start();

        // Filter
        var filt=audioCtx.createBiquadFilter();
        var filtTypes=['bandpass','lowpass','highpass','lowpass','bandpass'];
        filt.type=filtTypes[i%filtTypes.length];
        filt.frequency.value=80+Math.random()*2500;
        filt.Q.value=0.4+Math.random()*5;

        // Distortion on some layers
        var chain;
        if(i%3===0){
          var ws=audioCtx.createWaveShaper();
          var c=new Float32Array(256);
          for(var k=0;k<256;k++){var x=k/128-1;c[k]=(Math.PI+200)*x/(Math.PI+200*Math.abs(x));}
          ws.curve=c;ws.oversample='2x';
          src.connect(filt);filt.connect(ws);ws.connect(gn);
        } else {
          src.connect(filt);filt.connect(gn);
        }

        gn.connect(pan);
        pan.connect(audioCtx.destination);

        // Reverb send
        var rvS=audioCtx.createGain();rvS.gain.value=0.35+Math.random()*0.45;
        pan.connect(rvS);rvS.connect(cRev);

        // Delay sends — route to different delay lines
        var dlS=audioCtx.createGain();dlS.gain.value=0.15+Math.random()*0.4;
        pan.connect(dlS);
        if(i%3===0)dlS.connect(dA);
        else if(i%3===1)dlS.connect(dB);
        else dlS.connect(dC);

        audio.play()
          .then(function(){log('♪ '+filename+' x'+audio.playbackRate.toFixed(2)+' pan:'+pan.pan.value.toFixed(1));})
          .catch(function(e){log('✗ '+filename+':'+e.message);});

        cacophonyNodes.push(audio,panLFO);
      }catch(e){log('Cac:'+e.message);}
    },delay);
  });
}

// VOICE ENGINE — synthesized male voice via Web Speech + distortion
// Reads full Revelation verses, sounds inhuman
// ═══════════════════════════════════════════════════════════════
var BNA=[

  {t:'אַל-תִּירָא',l:'he-IL'},{t:'ΜΗ ΦΟΒΟΥ',l:'el-GR'},
  {t:'لَا تَخَفْ',l:'ar-SA'},{t:"N'AYEZ PAS PEUR",l:'fr-FR'},

  {t:'恐れるな',l:'ja-JP'},{t:'ÄLÄ PELKÄÄ',l:'fi-FI'},
  {t:'不要害怕',l:'zh-CN'},{t:'NU TE TEME',l:'ro-RO'},
];

var REV=[
  "I am Alpha and Omega. The first. And the last.",
  "Fear not. I am he that liveth. And was dead.",
  "Behold. I am alive for evermore. And I have the keys of hell. And of death.",

  "And he causeth all. Both small and great. Rich and poor. To receive a mark.",

  "And the books were opened. And another book was opened. Which is the book of life.",

  "And God shall wipe away all tears from their eyes. And there shall be no more death.",
  "Behold. I come quickly.",
  "I am Alpha. And Omega. The beginning. And the end. The first. And the last.",
];

var bnaIdx=0,revIdx=0,speechActive=false,voiceTO=null;
var voiceEl=document.getElementById('voice-text');
var revelEl=document.getElementById('revelation-text');

// Male voice selection — prioritized list of known deep voices
var MALE_VOICES=['Google UK English Male','Microsoft David Desktop','Microsoft Mark Desktop',
  'Alex','Daniel','Thomas','Fred','Bruce','Junior','Ralph','Albert',
  'Eddy (English (UK))','Reed (English (US))','Rocko (English (US))'];

function getBestMaleVoice(){
  var voices=window.speechSynthesis.getVoices();
  // Try priority list first
  for(var p=0;p<MALE_VOICES.length;p++){
    for(var v=0;v<voices.length;v++){
      if(voices[v].name.indexOf(MALE_VOICES[p])>-1)return voices[v];
    }
  }
  // Fallback: any voice with 'male' in name
  for(var v=0;v<voices.length;v++){
    if(voices[v].name.toLowerCase().indexOf('male')>-1)return voices[v];
  }
  // Last resort: english voice
  for(var v=0;v<voices.length;v++){
    if(voices[v].lang.indexOf('en')===0)return voices[v];
  }
  return voices[0]||null;
}

function speakVerse(){
  if(!speechActive)return;
  var phrase=BNA[bnaIdx%BNA.length];bnaIdx++;
  var verse=REV[revIdx%REV.length];revIdx++;

  // Text flash
  voiceEl.textContent=phrase.t;
  voiceEl.classList.remove('voice-active');
  void voiceEl.offsetWidth;
  voiceEl.classList.add('voice-active');

  // Revelation display
  revelEl.textContent=verse;
  revelEl.style.color='rgba(200,0,0,0.38)';
  setTimeout(function(){revelEl.style.color='rgba(200,0,0,0)';},10000);

  // Trigger heavy glitch burst
  glitchInt=1.5+Math.random()*1.0;

  // Speak the verse using deepest male voice available
  if('speechSynthesis' in window){
    window.speechSynthesis.cancel();
    var doSpeak=function(){
      var utt=new SpeechSynthesisUtterance(verse);
      utt.rate=0.38;   // very slow — inhuman pacing
      utt.pitch=0;     // absolute floor
      utt.volume=1.0;
      utt.lang='en-US';
      var voice=getBestMaleVoice();
      if(voice){utt.voice=voice;log('Voice: '+voice.name);}
      window.speechSynthesis.speak(utt);
    };
    // Voices may not be loaded yet on first call
    if(window.speechSynthesis.getVoices().length>0){
      doSpeak();
    } else {
      window.speechSynthesis.onvoiceschanged=function(){
        window.speechSynthesis.onvoiceschanged=null;
        doSpeak();
      };
    }
  }

  voiceTO=setTimeout(speakVerse,24000+Math.random()*18000);
}

// ═══════════════════════════════════════════════════════════════
// STOP ALL
// ═══════════════════════════════════════════════════════════════
function stopAll(){
  glRunning=false;speechActive=false;
  if(voiceTO){clearTimeout(voiceTO);voiceTO=null;}
  if('speechSynthesis' in window)window.speechSynthesis.cancel();
  choirNodes.forEach(function(n){try{if(n.stop)n.stop();}catch(e){}});
  cacophonyNodes.forEach(function(n){try{if(n.stop)n.stop();}catch(e){};try{if(n.pause){n.pause();n.src='';}}catch(e){}});
  choirNodes=[];cacophonyNodes=[];
  if(audioCtx){try{audioCtx.close();}catch(e){}audioCtx=null;}
}
window.stopAll=stopAll;

// ═══════════════════════════════════════════════════════════════
// MAIN LOOP
// ═══════════════════════════════════════════════════════════════
function loop(now){
  if(!glRunning)return;
  renderGL();
  renderFaces(now);
  renderOverlay(now);
  requestAnimationFrame(loop);
}

function resize(){resizeGL();resizeFace();resizeOverlay();}
window.addEventListener('resize',resize,{passive:true});
resize();

// ═══════════════════════════════════════════════════════════════
// START — visuals immediately, audio on first touch/click
// ═══════════════════════════════════════════════════════════════
var audioStarted=false;
function startAudio(){
  if(audioStarted)return;audioStarted=true;
  document.removeEventListener('click',startAudio,true);
  document.removeEventListener('touchend',startAudio,true);
  audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended')audioCtx.resume();
  buildChoir();
  buildCacophony();
  speechActive=true;
  // Wait for voices to load before first speech
  setTimeout(speakVerse,5000);
  log('Audio running');
}

if(initGL()){glRunning=true;requestAnimationFrame(loop);}
loadAndProcess();
document.addEventListener('click',startAudio,true);
document.addEventListener('touchend',startAudio,true);
if(window===window.top)history.pushState({installation:true},'','#active');
</script>
