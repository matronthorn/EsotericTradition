var _audioCtxRef=null;

function killAllAudio(){
  // Stop speech
  try{if('speechSynthesis' in window)window.speechSynthesis.cancel();}catch(e){}
  // Pause and destroy all audio elements
  var els=_allAudioElements.slice();
  for(var i=0;i<els.length;i++){
    try{els[i].pause();els[i].src='';els[i].load();}catch(e){}
  }
  _allAudioElements=[];
  // Stop all oscillators
  var oscs=_allOscillators.slice();
  for(var i=0;i<oscs.length;i++){try{oscs[i].stop(0);}catch(e){}}
  _allOscillators=[];
  // Close audio context — kills everything in graph
  if(_audioCtxRef){
    try{_audioCtxRef.close();}catch(e){}
    _audioCtxRef=null;
  }
}

'precision highp float;',
'uniform float u_time;uniform vec2 u_res;',
'vec2 h2(vec2 p){p=vec2(dot(p,vec2(127.1,311.7)),dot(p,vec2(269.5,183.3)));return -1.0+2.0*fract(sin(p)*43758.5453);}',

'float fbm(vec2 p,float t){float v=0.,a=0.55;mat2 r=mat2(.8,.6,-.6,.8);for(int i=0;i<8;i++){v+=a*gn(p);p=r*p*2.1+vec2(100.)+vec2(t*.04,t*.025);a*=0.48;}return v;}',
'void main(){',
'  vec2 uv=(gl_FragCoord.xy-u_res*.5)/min(u_res.x,u_res.y);',
'  float t=u_time,r=length(uv),ang=atan(uv.y,uv.x);',
'  float impl=0.11*sin(r*5.0-t*0.8)*(1.2-r);',

'  float st=mix(gn(uv*80.+vec2(t*4.0,t*2.8)),gn(uv*170.+vec2(-t*5.5,t*4.8)),0.4)*0.09;',
'  float lum=((n1*0.5+0.5)*0.55+(n2*0.5+0.5)*0.3+(n3*0.5+0.5)*0.15);',
'  float rr=pow(lum,0.7)*0.95;',

'}'
].join('');

function cSh(t,s){var sh=gl.createShader(t);gl.shaderSource(sh,s);gl.compileShader(sh);return sh;}
function initGL(){
  if(!gl)return false;
  var p=gl.createProgram();
  gl.attachShader(p,cSh(gl.VERTEX_SHADER,VS));
  gl.attachShader(p,cSh(gl.FRAGMENT_SHADER,FS));
  gl.linkProgram(p);
  if(!gl.getProgramParameter(p,gl.LINK_STATUS)){log('GL:'+gl.getProgramInfoLog(p));return false;}
  voidProg=p;
  var b=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,b);
  gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
  var loc=gl.getAttribLocation(p,'a');gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);
  uTime=gl.getUniformLocation(p,'u_time');uRes=gl.getUniformLocation(p,'u_res');
  gl.useProgram(p);glStart=performance.now();return true;
}

// IMAGE PROCESSING — Claude Vision, 4-layer seamless blend

var faceCanvas=document.getElementById('face-canvas');

// Each entry: array of 4 canvases [innerMirror, outerMirror, diagonal, invertedInner]

async function claudeAnalyze(b64){
  try{
    var r=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'x-api-key':AKEY,
        'anthropic-version':'2023-06-01',
        'anthropic-dangerous-direct-browser-access':'true'
      },
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',max_tokens:400,
        messages:[{role:'user',content:[
          {type:'image',source:{type:'base64',media_type:'image/jpeg',data:b64}},
          {type:'text',text:'Return ONLY valid JSON, no markdown:\n{"hasFace":true,"faceX":0.15,"faceY":0.05,"faceW":0.7,"faceH":0.85,"eye1X":0.35,"eye1Y":0.38,"eye1R":0.06,"eye2X":0.65,"eye2Y":0.38,"eye2R":0.06,"bgR":245,"bgG":240,"bgB":238}\nAll x/y/w/h/r are 0.0-1.0 fractions. bgR/G/B are 0-255 integers for dominant background. Be precise.'}
        ]}]
      })
    });
    if(!r.ok)throw new Error('HTTP'+r.status);
    var d=await r.json();
    if(d.error)throw new Error(d.error.message);
    var txt=((d.content&&d.content[0]&&d.content[0].text)||'{}').replace(/```json|```/g,'').trim();
    return JSON.parse(txt);
  }catch(e){
    log('Vision:'+e.message);
    return{hasFace:true,faceX:0.1,faceY:0.05,faceW:0.8,faceH:0.88,
           eye1X:0.34,eye1Y:0.37,eye1R:0.065,eye2X:0.66,eye2Y:0.37,eye2R:0.065,
           bgR:248,bgG:244,bgB:240};
  }
}

function duotone(imgData){
  var d=imgData.data;
  for(var i=0;i<d.length;i+=4){
    if(d[i+3]<8)continue;
    var lum=(d[i]*0.299+d[i+1]*0.587+d[i+2]*0.114)/255;
    var t=Math.pow(lum,0.78);
    d[i]=Math.round(t*215);d[i+1]=Math.round(t*7);d[i+2]=Math.round(t*7);
  }
}

// Build 4 mirror variants from processed source
function buildFourLayers(src,doInvert){
  var W=src.width,H=src.height;
  var layers=[];

  // Helper: make canvas from drawFn
  function make(drawFn){
    var c=document.createElement('canvas');c.width=W;c.height=H;
    var ctx=c.getContext('2d');drawFn(ctx);
    // Apply soft edge fade so seams disappear
    applyEdgeFade(ctx,W,H);
    return c;
  }

  // 1. Inner mirror: left→right
  layers.push(make(function(ctx){
    ctx.drawImage(src,0,0);
    ctx.save();ctx.translate(W,0);ctx.scale(-1,1);
    ctx.drawImage(src,0,0,W/2,H,0,0,W/2,H);
    ctx.restore();
  }));

  // 2. Outer mirror: right→left (from edges in)
  layers.push(make(function(ctx){
    ctx.drawImage(src,0,0);
    ctx.save();ctx.scale(-1,1);
    ctx.drawImage(src,W/2,0,W/2,H,-W,0,W/2,H);
    ctx.restore();
  }));

  // 3. Vertical top→bottom mirror
  layers.push(make(function(ctx){
    ctx.drawImage(src,0,0);
    ctx.save();ctx.translate(0,H);ctx.scale(1,-1);
    ctx.drawImage(src,0,0,W,H/2,0,0,W,H/2);
    ctx.restore();
  }));

  // 4. Random invert + diagonal (4-way kaleidoscope feel)
  layers.push(make(function(ctx){
    // Quarter tile the image 4 ways
    ctx.save();ctx.drawImage(src,0,0,W/2,H/2,0,0,W/2,H/2);ctx.restore();
    ctx.save();ctx.translate(W,0);ctx.scale(-1,1);ctx.drawImage(src,0,0,W/2,H/2,0,0,W/2,H/2);ctx.restore();
    ctx.save();ctx.translate(0,H);ctx.scale(1,-1);ctx.drawImage(src,0,0,W/2,H/2,0,0,W/2,H/2);ctx.restore();
    ctx.save();ctx.translate(W,H);ctx.scale(-1,-1);ctx.drawImage(src,0,0,W/2,H/2,0,0,W/2,H/2);ctx.restore();
    // Randomly invert this layer
    if(doInvert){
      var id=ctx.getImageData(0,0,W,H);var dd=id.data;
      for(var i=0;i<dd.length;i+=4){
        if(dd[i+3]<8)continue;
        dd[i]=255-dd[i];dd[i+1]=255-dd[i+1];dd[i+2]=255-dd[i+2];
      }
      ctx.putImageData(id,0,0);
    }
  }));

  return layers;
}

// Apply radial + edge gradient fade so layer edges dissolve completely
function applyEdgeFade(ctx,W,H){
  ctx.save();
  ctx.globalCompositeOperation='destination-in';
  // Radial fade from centre — edges go transparent
  var grad=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.1,W/2,H/2,Math.max(W,H)*0.72);
  grad.addColorStop(0,'rgba(0,0,0,1)');
  grad.addColorStop(0.7,'rgba(0,0,0,0.9)');
  grad.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=grad;
  ctx.fillRect(0,0,W,H);
  ctx.restore();
}

async function processImage(filename){
  return new Promise(async function(resolve){
    var img=new Image();img.crossOrigin='anonymous';
    img.src=REPO+'/installation/images/'+encodeURIComponent(filename);
    var ok=await new Promise(function(r){img.onload=function(){r(true);};img.onerror=function(){r(false);};});
    if(!ok||!img.naturalWidth){resolve(null);return;}

    log('Proc: '+filename);
    var W=img.naturalWidth,H=img.naturalHeight;
    var work=document.createElement('canvas');work.width=W;work.height=H;
    var wCtx=work.getContext('2d');wCtx.drawImage(img,0,0);

    // Downsample for Claude
    var sc=Math.min(1,600/Math.max(W,H));
    var sm=document.createElement('canvas');sm.width=Math.round(W*sc);sm.height=Math.round(H*sc);
    sm.getContext('2d').drawImage(img,0,0,sm.width,sm.height);
    var b64=sm.toDataURL('image/jpeg',0.82).split(',')[1];

    var coords=await claudeAnalyze(b64);

    // Background removal
    var raw=wCtx.getImageData(0,0,W,H);var d=raw.data;
    function px(x,y){var i=(Math.min(y,H-1)*W+Math.min(x,W-1))*4;return[d[i],d[i+1],d[i+2]];}
    var cs=[px(0,0),px(W-1,0),px(0,H-1),px(W-1,H-1),px(W>>1,0),px(0,H>>1),px(W-1,H>>1),px(W>>1,H-1)];
    var sr=0,sg=0,sb=0;cs.forEach(function(c){sr+=c[0];sg+=c[1];sb+=c[2];});
    sr=Math.round(sr/cs.length*0.55+(coords.bgR||245)*0.45);
    sg=Math.round(sg/cs.length*0.55+(coords.bgG||240)*0.45);
    sb=Math.round(sb/cs.length*0.55+(coords.bgB||238)*0.45);
    var thresh=65;
    for(var i=0;i<d.length;i+=4){
      var dr=d[i]-sr,dg=d[i+1]-sg,db=d[i+2]-sb;
      var dist=Math.sqrt(dr*dr+dg*dg+db*db);
      if(dist<thresh){var soft=1-(dist/thresh);d[i+3]=Math.max(0,Math.floor(d[i+3]*(1-soft*soft)));}
    }
    wCtx.putImageData(raw,0,0);

    // Eye removal
    wCtx.save();wCtx.globalCompositeOperation='destination-out';
    [[coords.eye1X,coords.eye1Y,coords.eye1R],[coords.eye2X,coords.eye2Y,coords.eye2R]].forEach(function(e){
      var cx=e[0]*W,cy=e[1]*H,rx=Math.max(e[2]*W*1.8,22),ry=rx*0.6;
      var g=wCtx.createRadialGradient(cx,cy,0,cx,cy,rx);
      g.addColorStop(0.4,'rgba(0,0,0,1)');g.addColorStop(1,'rgba(0,0,0,0)');
      wCtx.fillStyle=g;wCtx.beginPath();wCtx.ellipse(cx,cy,rx,ry,0,0,Math.PI*2);wCtx.fill();
    });
    wCtx.restore();

    // Scale if small
    if(coords.hasFace&&coords.faceW&&coords.faceW<0.45){
      var fsc=0.8/coords.faceW,fcx=(coords.faceX+coords.faceW/2)*W,fcy=(coords.faceY+(coords.faceH||0.85)/2)*H;
      var sc2=document.createElement('canvas');sc2.width=W;sc2.height=H;
      var sc2c=sc2.getContext('2d');sc2c.save();sc2c.translate(W/2,H/2);sc2c.scale(fsc,fsc);sc2c.translate(-fcx,-fcy);sc2c.drawImage(work,0,0);sc2c.restore();
      work=sc2;wCtx=sc2.getContext('2d');
    }

    // Duotone
    var dt=wCtx.getImageData(0,0,work.width,work.height);
    duotone(dt);wCtx.putImageData(dt,0,0);

    // Build 4 layers — randomly invert the 4th layer ~40% of the time
    var doInvert=Math.random()<0.4;
    var layers=buildFourLayers(work,doInvert);
    log('Done: '+filename+(doInvert?' [inv]':''));
    resolve(layers);
  });
}

// Draw one face layer with seamless blending
function drawLayer(canvas,alpha,blend,scaleOffset){
  if(!canvas||alpha<=0)return;
  var cw=faceCanvas.width,ch=faceCanvas.height;
  var iw=canvas.width,ih=canvas.height;if(!iw||!ih)return;
  var base=Math.max(cw/iw,ch/ih);
  var scale=base*(scaleOffset||1.0);
  var w=iw*scale,h=ih*scale,x=(cw-w)/2,y=(ch-h)/2;
  var pulse=1+0.013*Math.sin(performance.now()*0.0008);
  fCtx.save();
  fCtx.globalAlpha=Math.max(0,Math.min(1,alpha));
  fCtx.globalCompositeOperation=blend||'source-over';
  fCtx.translate(cw/2,ch/2);fCtx.scale(pulse,pulse);fCtx.translate(-cw/2,-ch/2);
  fCtx.drawImage(canvas,x,y,w,h);
  fCtx.restore();
}

// Draw all 4 layers of a set with different blend modes and opacities
function drawSet(layers,alpha){
  if(!layers||!layers.length)return;
  // Layer 1: inner mirror — source-over, full alpha basis
  drawLayer(layers[0], alpha*0.75, 'source-over', 1.0);
  // Layer 2: outer mirror — screen, slightly larger so edges overlap
  drawLayer(layers[1], alpha*0.55, 'screen', 1.08);
  // Layer 3: vertical mirror — multiply to merge colours
  drawLayer(layers[2], alpha*0.45, 'screen', 0.95);
  // Layer 4: quad kaleidoscope — overlay, slight rotation effect via scale
  drawLayer(layers[3], alpha*0.35, 'overlay', 1.12);
}

function renderFaces(now){
  fCtx.clearRect(0,0,faceCanvas.width,faceCanvas.height);
  if(!faceSets.length)return;
  if(!faceMorphing){
    if(!setA){setA=faceSets[0];faceHoldStart=now;}
    drawSet(setA,1.0);
    if(now-faceHoldStart>FACE_HOLD_MS){
      faceMorphing=true;setIdx=(setIdx+1)%faceSets.length;setB=faceSets[setIdx];faceAlpha=0;
    }
  }else{
    faceAlpha+=16/FACE_FADE_MS;
    if(faceAlpha>=1){faceAlpha=1;setA=setB;setB=null;faceMorphing=false;faceHoldStart=now;}
    drawSet(setA,1-faceAlpha);
    if(setB)drawSet(setB,faceAlpha);
  }
}

async function loadAndProcess(){
  for(var i=0;i<FACE_FILES.length;i++){
    var set=await processImage(FACE_FILES[i]);
    if(set){
      faceSets.push(set);
      if(faceSets.length===1){setA=faceSets[0];faceHoldStart=performance.now();}
    }
    if(i<FACE_FILES.length-1)await new Promise(function(r){setTimeout(r,900);});
  }
  log('All processed: '+faceSets.length);
}

// OVERLAY — CRT/scanlines/glitch

var overCanvas=document.getElementById('overlay-canvas');
var oCtx=overCanvas.getContext('2d');
var glitchInt=0,glitchTick=0;
function resizeOverlay(){overCanvas.width=window.innerWidth;overCanvas.height=window.innerHeight;}
function renderOverlay(now){
  var W=overCanvas.width,H=overCanvas.height;
  oCtx.clearRect(0,0,W,H);
  for(var y=0;y<H;y+=3){oCtx.fillStyle='rgba(0,0,0,'+(0.07+0.04*Math.sin(y*0.07+now*0.0012))+')';oCtx.fillRect(0,y,W,1.8);}
  var g=oCtx.createRadialGradient(W/2,H/2,H*0.2,W/2,H/2,H*0.8);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,0.75)');
  oCtx.fillStyle=g;oCtx.fillRect(0,0,W,H);
  if(now-glitchTick>2000+Math.random()*5000){glitchTick=now;glitchInt=0.9+Math.random()*0.8;}
  if(glitchInt>0){
    for(var i=0;i<Math.floor(glitchInt*18);i++){
      var gy=Math.random()*H,gh=1+Math.random()*12*glitchInt;
      oCtx.save();oCtx.globalAlpha=0.15*glitchInt;oCtx.globalCompositeOperation='screen';
      oCtx.fillStyle='rgba(255,0,0,1)';oCtx.fillRect((Math.random()-0.5)*50*glitchInt,gy,W,gh);
      oCtx.fillStyle='rgba(120,0,0,1)';oCtx.fillRect(-(Math.random()-0.5)*35*glitchInt,gy+0.5,W,gh);
      oCtx.restore();
      if(Math.random()<0.35){oCtx.fillStyle='rgba('+(160+Math.random()*95)+',0,0,'+(0.1*glitchInt)+')';oCtx.fillRect(Math.random()*W,gy,15+Math.random()*160,gh);}
    }
    glitchInt*=0.88;if(glitchInt<0.02)glitchInt=0;
  }
  if(Math.random()<0.09){
    var ny=Math.random()*H;oCtx.save();oCtx.globalAlpha=0.1+Math.random()*0.18;
    oCtx.strokeStyle='rgba(200,0,0,0.65)';oCtx.lineWidth=0.5;
    oCtx.beginPath();oCtx.moveTo(0,ny);oCtx.lineTo(W,ny);oCtx.stroke();oCtx.restore();
  }
}

// ═══════════════════════════════════════════════════════════════
// AUDIO — Choir + Cacophony (25+ simultaneous voices)
// ═══════════════════════════════════════════════════════════════
var audioCtx=null,choirNodes=[],cacophonySlots=[];

function mkReverb(sec,dec){
  var c=audioCtx.createConvolver();
  var len=Math.floor(audioCtx.sampleRate*sec);
  var b=audioCtx.createBuffer(2,len,audioCtx.sampleRate);
  for(var ch=0;ch<2;ch++){var dd=b.getChannelData(ch);for(var i=0;i<len;i++)dd[i]=(Math.random()*2-1)*Math.pow(1-i/len,dec);}
  c.buffer=b;return c;
}

function buildChoir(){
  var master=audioCtx.createGain();
  master.gain.setValueAtTime(0,audioCtx.currentTime);
  master.gain.linearRampToValueAtTime(0.38,audioCtx.currentTime+14);
  var comp=audioCtx.createDynamicsCompressor();
  comp.threshold.value=-18;comp.ratio.value=4;comp.attack.value=0.05;comp.release.value=0.3;
  comp.connect(audioCtx.destination);
  var rev=mkReverb(7,1.5),revG=audioCtx.createGain(),dryG=audioCtx.createGain();
  revG.gain.value=0.65;dryG.gain.value=0.35;
  master.connect(dryG);dryG.connect(comp);master.connect(rev);rev.connect(revG);revG.connect(comp);
  var BASE=82.4;
  var voices=[
    {f:BASE*.5,v:.22},{f:BASE*.501,v:.20},{f:BASE,v:.19},{f:BASE*1.003,v:.17},
    {f:BASE*.749,v:.21},{f:BASE*.751,v:.19},{f:BASE*1.5,v:.13},{f:BASE*1.497,v:.12},
    {f:BASE*2,v:.10},{f:BASE*1.998,v:.09},{f:BASE*2.5,v:.08},
  ];
  voices.forEach(function(cfg,i){
    var osc=audioCtx.createOscillator();osc.type='sawtooth';osc.frequency.value=cfg.f;
    var vib=audioCtx.createOscillator();vib.frequency.value=4.3+i*.19;
    var vibG=audioCtx.createGain();vibG.gain.value=cfg.f*.0021;vib.connect(vibG);vibG.connect(osc.frequency);
    var bLFO=audioCtx.createOscillator();bLFO.frequency.value=0.05+i*.007;
    var bAmt=audioCtx.createGain();bAmt.gain.value=0.024;bLFO.connect(bAmt);
    var filt=audioCtx.createBiquadFilter();filt.type='bandpass';filt.frequency.value=650+i*55;filt.Q.value=3;
    var vG=audioCtx.createGain();vG.gain.value=cfg.v;bAmt.connect(vG.gain);
    osc.connect(filt);filt.connect(vG);vG.connect(master);
    osc.start();vib.start();bLFO.start();
    _allOscillators.push(osc,vib,bLFO);
    choirNodes.push(osc,vib,bLFO);
  });
}

// ── CACOPHONY: each MP4 runs in 5 simultaneous slots = up to 55 voices ──
// Each slot: unique speed bucket, pan zone, reverb, delay, cycle time
// NO distortion — pitch/speed/space variation only
function buildCacophony(){
  if(!MEDIA_FILES.length)return;

  // Shared infrastructure
  var cRev=mkReverb(9,1.0);
  var cRevG=audioCtx.createGain();cRevG.gain.value=0.5;
  cRev.connect(cRevG);cRevG.connect(audioCtx.destination);

  function mkDelay(t,fb){
    var d=audioCtx.createDelay(8);d.delayTime.value=t;
    var f=audioCtx.createGain();f.gain.value=fb;d.connect(f);f.connect(d);
    return d;
  }
  var delays=[mkDelay(0.31,0.42),mkDelay(0.58,0.39),mkDelay(1.05,0.34),mkDelay(1.82,0.28),mkDelay(0.19,0.46)];
  var delOut=audioCtx.createGain();delOut.gain.value=0.2;
  delays.forEach(function(d){d.connect(delOut);});
  delOut.connect(audioCtx.destination);delOut.connect(cRev);

  // 5 slot configurations — distinct speed/pan/reverb/delay per slot
  // Speeds range from very slow (0.28) to natural (1.0)
  var slotCfg=[
    {speedMin:0.28,speedMax:0.38,pan:-0.88,revSend:0.75,delaySend:0.55,delayBus:0,cycleBase:32000},
    {speedMin:0.40,speedMax:0.52,pan:-0.45,revSend:0.60,delaySend:0.40,delayBus:1,cycleBase:38000},
    {speedMin:0.54,speedMax:0.68,pan: 0.00,revSend:0.45,delaySend:0.30,delayBus:2,cycleBase:29000},
    {speedMin:0.70,speedMax:0.84,pan: 0.45,revSend:0.35,delaySend:0.20,delayBus:3,cycleBase:35000},
    {speedMin:0.86,speedMax:1.00,pan: 0.88,revSend:0.25,delaySend:0.15,delayBus:4,cycleBase:42000},
  ];

  // For each of the 11 MP4 files, run all 5 slots
  // That gives up to 55 simultaneous voice threads
  MEDIA_FILES.forEach(function(filename,fi){
    slotCfg.forEach(function(cfg,si){
      // Stagger start: file index * 600ms + slot index * 1800ms + jitter
      var startDelay=fi*600+si*1800+Math.random()*1200;

      function runSlot(){
        if(!audioCtx)return;
        var rate=cfg.speedMin+Math.random()*(cfg.speedMax-cfg.speedMin);
        // Small per-run variation on pan so same-slot voices drift slightly
        var panOffset=(Math.random()-0.5)*0.12;

        try{
          var audio=new Audio();
          audio.crossOrigin='anonymous';
          audio.loop=true;
          audio.preload='auto';
          audio.src=REPO+'/installation/media/'+encodeURIComponent(filename);
          audio.playbackRate=rate;
          _allAudioElements.push(audio);

          var src=audioCtx.createMediaElementSource(audio);
          var gn=audioCtx.createGain();
          gn.gain.setValueAtTime(0,audioCtx.currentTime);
          gn.gain.linearRampToValueAtTime(0.09+Math.random()*0.11,audioCtx.currentTime+3.5);

          var pan=audioCtx.createStereoPanner();
          pan.pan.value=Math.max(-1,Math.min(1,cfg.pan+panOffset));

          // Slow pan drift LFO
          var pLFO=audioCtx.createOscillator();
          pLFO.frequency.value=0.008+Math.random()*0.03;
          var pAmt=audioCtx.createGain();pAmt.gain.value=0.12+Math.random()*0.18;
          pLFO.connect(pAmt);pAmt.connect(pan.pan);pLFO.start();
          _allOscillators.push(pLFO);

          // Gentle low-pass — no harshness, just warmth/distance variation
          var filt=audioCtx.createBiquadFilter();
          filt.type='lowpass';
          filt.frequency.value=600+Math.random()*2800;
          filt.Q.value=0.3+Math.random()*1.2;

          src.connect(filt);filt.connect(gn);gn.connect(pan);
          pan.connect(audioCtx.destination);

          // Reverb send
          var rvS=audioCtx.createGain();rvS.gain.value=cfg.revSend*(0.85+Math.random()*0.3);
          pan.connect(rvS);rvS.connect(cRev);

          // Delay send
          var dlS=audioCtx.createGain();dlS.gain.value=cfg.delaySend*(0.8+Math.random()*0.4);
          pan.connect(dlS);dlS.connect(delays[cfg.delayBus]);

          audio.play().then(function(){
            log('♪ '+filename.slice(-12)+' s'+si+' x'+rate.toFixed(2));
          }).catch(function(e){log('✗ '+filename.slice(-12)+':'+e.message);});

          // Cycle: fade out → pause → restart with new params
          var cycleLen=cfg.cycleBase+(Math.random()*10000-5000);
          var fadeTO=setTimeout(function(){
            if(!audioCtx)return;
            gn.gain.linearRampToValueAtTime(0,audioCtx.currentTime+3.5);
            var restartTO=setTimeout(function(){
              try{audio.pause();audio.src='';
                var idx=_allAudioElements.indexOf(audio);
                if(idx>-1)_allAudioElements.splice(idx,1);
              }catch(e){}
              try{pLFO.stop();}catch(e){}
              // Restart same slot with new random params
              var gap=1500+Math.random()*4500;
              setTimeout(runSlot,gap);
            },4000);
            cacophonySlots.push(restartTO);
          },cycleLen);
          cacophonySlots.push(fadeTO);

        }catch(e){log('Slot err:'+e.message);}
      }

      var initTO=setTimeout(runSlot,startDelay);
      cacophonySlots.push(initTO);
    });
  });
}

var bnaIdx=0,revIdx=0,speechActive=false,voiceTO=null;
var voiceEl=document.getElementById('voice-text');
var revelEl=document.getElementById('revelation-text');

// Hard-coded male voice name fragments — reject anything matching female patterns
var FEMALE_FRAGMENTS=['female','samantha','victoria','karen','moira','fiona','veena',
  'tessa','ioana','joana','marie','amelie','carmit','anna','lekha','mei','sin-ji',
  'kyoko','yuna','satu','sara','alva','nora','ellen','zuzana','laura','kate',
  'milena','lucia','monica','paulina','ewa','zosia','mariska','damayanti',
  'kanya','ting-ting','sin','mei','li-mu','yu-shu','kate','serena','woman',
  'girl','she','her','female','femi'];

var MALE_PRIORITY=['Google UK English Male','Microsoft David','Microsoft Mark',
  'Alex','Daniel','Thomas','Fred','Bruce','Junior','Ralph','Albert',
  'Eddy','Reed','Rocko','Grandpa','Bahh','Bells','Boing','Bubbles',
  'Cellos','Deranged','Good News','Hysterical','Pipe Organ','Trinoids',
  'Whisper','Wobble','Zarvox'];

function isFemale(name){
  var n=name.toLowerCase();
  for(var i=0;i<FEMALE_FRAGMENTS.length;i++)if(n.indexOf(FEMALE_FRAGMENTS[i])>-1)return true;
  return false;
}

function getMaleVoice(){
  if(!('speechSynthesis' in window))return null;
  var vs=window.speechSynthesis.getVoices();
  if(!vs.length)return null;
  // Try priority list
  for(var p=0;p<MALE_PRIORITY.length;p++)
    for(var v=0;v<vs.length;v++)
      if(vs[v].name.indexOf(MALE_PRIORITY[p])>-1&&!isFemale(vs[v].name)){log('Voice: '+vs[v].name);return vs[v];}
  // Any non-female en-GB/en-US voice
  for(var v=0;v<vs.length;v++)
    if(!isFemale(vs[v].name)&&(vs[v].lang==='en-GB'||vs[v].lang==='en-US'))return vs[v];
  // Any non-female voice
  for(var v=0;v<vs.length;v++)
    if(!isFemale(vs[v].name))return vs[v];
  return vs[0];
}

function speakVerse(){
  if(!speechActive)return;
  var phrase=BNA[bnaIdx%BNA.length];bnaIdx++;
  var verse=REV[revIdx%REV.length];revIdx++;
  voiceEl.textContent=phrase.t;
  voiceEl.classList.remove('voice-active');void voiceEl.offsetWidth;voiceEl.classList.add('voice-active');
  revelEl.textContent=verse;revelEl.style.color='rgba(200,0,0,0.35)';
  setTimeout(function(){revelEl.style.color='rgba(200,0,0,0)';},11000);
  glitchInt=1.3+Math.random()*0.9;
  if('speechSynthesis' in window){
    window.speechSynthesis.cancel();
    var doSpeak=function(){
      var v=getMaleVoice();
      if(!v){log('No voices found yet');return;}
      var utt=new SpeechSynthesisUtterance(verse);
      utt.voice=v;utt.rate=0.38;utt.pitch=0;utt.volume=1.0;utt.lang='en-US';
      log('Speaking: '+v.name);
      window.speechSynthesis.speak(utt);
    };
    if(window.speechSynthesis.getVoices().length>0)doSpeak();
    else window.speechSynthesis.addEventListener('voiceschanged',function onVC(){
      window.speechSynthesis.removeEventListener('voiceschanged',onVC);doSpeak();
    });
  }
  voiceTO=setTimeout(speakVerse,24000+Math.random()*18000);
}

// STOP ALL — used internally; killAllAudio is the nuclear option
// ═══════════════════════════════════════════════════════════════
function stopAll(){
  glRunning=false;speechActive=false;
  if(voiceTO){clearTimeout(voiceTO);voiceTO=null;}
  cacophonySlots.forEach(function(t){try{clearTimeout(t);}catch(e){}});
  cacophonySlots=[];
  killAllAudio();
}

function loop(now){
  if(!glRunning)return;
  renderGL();renderFaces(now);renderOverlay(now);
  requestAnimationFrame(loop);
}

// START
// ═══════════════════════════════════════════════════════════════
var audioStarted=false;
function startAudio(){
  if(audioStarted)return;audioStarted=true;
  document.removeEventListener('click',startAudio,true);
  document.removeEventListener('touchend',startAudio,true);
  audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  _audioCtxRef=audioCtx;
  if(audioCtx.state==='suspended')audioCtx.resume();
  buildChoir();
  buildCacophony();
  speechActive=true;
  setTimeout(speakVerse,5000);
}
