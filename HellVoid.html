<title>&#x2725;</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;overflow:hidden;background:#000;cursor:none;}

/* ── RED FILTER — everything runs through this ── */
#hell{
  position:fixed;inset:0;
  filter:sepia(1) hue-rotate(308deg) saturate(5) brightness(0.65);
  overflow:hidden;
}

/* ── VIDEO GRID — 3×3 ── */
#videoLayer{
  position:absolute;inset:0;
  display:grid;
  grid-template-columns:1fr 1fr 1fr;
  grid-template-rows:1fr 1fr 1fr;
}
.vframe{
  position:relative;overflow:hidden;
}
.vframe iframe{
  position:absolute;width:200%;height:200%;top:-50%;left:-50%;
  border:none;pointer-events:none;
}

/* ── LAYERS ── */
#imageLayer{position:absolute;inset:0;overflow:hidden;pointer-events:none;}
#noiseCanvas{position:absolute;inset:0;opacity:0.08;mix-blend-mode:overlay;pointer-events:none;}
#voidCanvas{position:absolute;inset:0;pointer-events:none;}

/* ── TEXT ── */
#textLayer{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  pointer-events:none;z-index:20;
}
#voidText{
  max-width:36%;
  text-align:center;
  font-family:'Palatino Linotype','Book Antiqua',Palatino,Georgia,serif;
  font-size:clamp(0.5rem,1.3vw,1rem);
  letter-spacing:0.2em;line-height:2.2;
  color:rgba(255,18,0,0.5);
  text-transform:uppercase;
  text-shadow:0 0 20px rgba(255,0,0,0.4),0 0 60px rgba(180,0,0,0.2);
  word-break:break-word;overflow-wrap:break-word;
}
#voidText span{opacity:0;transition:opacity 0.6s ease;}

/* ── CURSOR TEXT ── */
#cursorText {
  position: fixed;
  pointer-events: none;
  z-index: 9999;
  font-family: 'Courier New', monospace;
  font-size: 9px;
  letter-spacing: 0.15em;
  color: rgba(255, 0, 0, 0.55);
  text-transform: uppercase;
  white-space: nowrap;
  transform: translate(14px, -4px);
  text-shadow: 0 0 8px rgba(255,0,0,0.8);
  transition: opacity 0.15s;
}

/* ── SUBLIMINAL FLASH LAYER ── */
#subliminalFlash {
  position: fixed;
  inset: 0;
  z-index: 9998;
  pointer-events: none;
  opacity: 0;
  background: #fff;
  mix-blend-mode: overlay;
}

/* ── RED VIGNETTE ── */
#redVignette {
  position: absolute;
  inset: 0;
  z-index: 25;
  pointer-events: none;
  background: radial-gradient(ellipse at 50% 50%,
    transparent 30%,
    rgba(180,0,0,0.25) 65%,
    rgba(255,0,0,0.6) 100%);
  animation: vigPulse 2.8s ease-in-out infinite;
}
@keyframes vigPulse {
  0%, 100% { opacity: 0.7; }
  50% { opacity: 1.0; }
}

/* ── DISTORTION CANVAS ── */
#distortCanvas {
  position: absolute;
  inset: 0;
  z-index: 22;
  pointer-events: none;
  opacity: 0.7;
}

/* ── BODY FILTER FLICKER — slowed to 8Hz max (below seizure threshold) ── */
/* Original was 33Hz inside a 0.18s animation. Each keyframe step below
   is spaced >=120ms apart, keeping total perceived flicker rate under
   the 15Hz threshold recognised by photosensitive epilepsy guidelines. */
@keyframes filterFlicker {
  0%   { filter: sepia(1) hue-rotate(308deg) saturate(5) brightness(0.65) contrast(1.0); }
  45%  { filter: sepia(1) hue-rotate(315deg) saturate(5.5) brightness(0.75) contrast(1.15); }
  100% { filter: sepia(1) hue-rotate(308deg) saturate(5) brightness(0.65) contrast(1.0); }
}
#hell.flicker {
  animation: filterFlicker 0.42s ease-in-out 1;
}
#gate{
  position:fixed;inset:0;background:#000;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  z-index:999;cursor:pointer;
}
#gateTitle{
  font-family:'Palatino Linotype',Georgia,serif;
  font-size:clamp(0.7rem,2.5vw,1.4rem);
  letter-spacing:0.55em;color:rgba(160,0,0,0.65);
  text-transform:uppercase;margin-bottom:1.5rem;
}
#gateWarn{

  font-size:clamp(0.38rem,1vw,0.6rem);
  letter-spacing:0.12em;color:rgba(100,0,0,0.5);
  text-align:center;max-width:380px;line-height:2.0;
}

  if(!amt||amt<=0) return text;
  var r='';
  for(var i=0;i<text.length;i++){
    r+=text[i];

function initAudio(){
  try{
    AC=new(window.AudioContext||window.webkitAudioContext)();
    _masterGain=AC.createGain(); _masterGain.gain.value=0.72;
    _masterDistort=AC.createWaveShaper();
    _masterDistort.curve=makeDistCurve(220); _masterDistort.oversample='4x';
    _masterReverb=AC.createConvolver(); _masterReverb.buffer=makeIR(AC,4.5,0.35);
    _masterDistort.connect(_masterReverb);
    _masterReverb.connect(_masterGain);
    _masterGain.connect(AC.destination);
    _voiceDestGain=AC.createGain(); _voiceDestGain.gain.value=1.4;
    _voiceDestGain.connect(_masterGain);

    addSynthLayers();
    addBinauralBeats();
    loadAudio();
  }catch(e){console.warn('audio:',e);}
}

function addSynthLayers(){
  if(!AC) return;
  var sr=AC.sampleRate;

  // ── SUB-BASS RUMBLE ──────────────────────────────────────────
  var noiseLen=sr*12;
  var nBuf=AC.createBuffer(2,noiseLen,sr);
  for(var ch=0;ch<2;ch++){
    var nd=nBuf.getChannelData(ch);
    var b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
    for(var i=0;i<noiseLen;i++){
      var wh=Math.random()*2-1;
      b0=0.99886*b0+wh*0.0555179; b1=0.99332*b1+wh*0.0750759;
      b2=0.96900*b2+wh*0.1538520; b3=0.86650*b3+wh*0.3104856;
      b4=0.55000*b4+wh*0.5329522; b5=-0.7616*b5-wh*0.0168980;
      nd[i]=(b0+b1+b2+b3+b4+b5+b6+wh*0.5362)*0.11; b6=wh*0.115926;
    }
  }
  var noiseNode=AC.createBufferSource(); noiseNode.buffer=nBuf; noiseNode.loop=true;
  var noiseLP=AC.createBiquadFilter(); noiseLP.type='lowpass'; noiseLP.frequency.value=120; noiseLP.Q.value=3.0;
  var noiseGain=AC.createGain(); noiseGain.gain.value=0;
  noiseNode.connect(noiseLP); noiseLP.connect(noiseGain); noiseGain.connect(_masterDistort);
  noiseNode.start();
  noiseGain.gain.linearRampToValueAtTime(0.38,AC.currentTime+4);

  // ── DETUNED DRONE CLUSTER ────────────────────────────────────
  var droneFreqs=[18.0,18.4,36.1,35.7,54.5,54.9]; // sub + overtones
  var droneMix=AC.createGain(); droneMix.gain.value=0;
  droneMix.connect(_masterDistort);
  droneFreqs.forEach(function(freq,di){
    var osc=AC.createOscillator();
    osc.type=di%3===0?'sawtooth':di%3===1?'triangle':'square';
    osc.frequency.value=freq;
    var og=AC.createGain(); og.gain.value=0.18+(di%2)*0.06;
    osc.connect(og); og.connect(droneMix);
    osc.start();
    (function drift(o,f){
      var t=f+(Math.random()-0.5)*f*0.06;
      var d=4+Math.random()*10;
      o.frequency.linearRampToValueAtTime(t,AC.currentTime+d);
      setTimeout(function(){drift(o,f);},d*1000);
    })(osc,freq);
  });
  droneMix.gain.linearRampToValueAtTime(0.3,AC.currentTime+6);

  // ── HIGH OVERTONE TEXTURE (distant screaming) ────────────────
  var hBuf=AC.createBuffer(1,sr*4,sr);
  var hd=hBuf.getChannelData(0);
  for(var i2=0;i2<hBuf.length;i2++) hd[i2]=Math.random()*2-1;
  var hNode=AC.createBufferSource(); hNode.buffer=hBuf; hNode.loop=true;
  hNode.playbackRate.value=0.12;
  var hHP=AC.createBiquadFilter(); hHP.type='highpass'; hHP.frequency.value=2800;
  var hGain=AC.createGain(); hGain.gain.value=0;
  hNode.connect(hHP); hHP.connect(hGain); hGain.connect(_masterReverb);
  hNode.start();
  hGain.gain.linearRampToValueAtTime(0.09,AC.currentTime+8);

  // ── HEARTBEAT LFO ────────────────────────────────────────────
  var lfo=AC.createOscillator(); lfo.type='sine'; lfo.frequency.value=0.055;
  var lfoMod=AC.createGain(); lfoMod.gain.value=0.09;
  lfo.connect(lfoMod); lfoMod.connect(_masterGain.gain);
  lfo.start();

  // ── SWEEP FILTER MODULATION ──────────────────────────────────
  var sBuf=AC.createBuffer(1,sr*7,sr);
  var sd=sBuf.getChannelData(0);
  for(var i3=0;i3<sBuf.length;i3++) sd[i3]=Math.random()*2-1;
  var sSrc=AC.createBufferSource(); sSrc.buffer=sBuf; sSrc.loop=true;
  var sF=AC.createBiquadFilter(); sF.type='bandpass'; sF.Q.value=5;
  var sG=AC.createGain(); sG.gain.value=0;
  sSrc.connect(sF); sF.connect(sG); sG.connect(_masterDistort);
  sSrc.start(); sG.gain.linearRampToValueAtTime(0.22,AC.currentTime+7);
  (function sweep(){
    var t=60+Math.random()*2800;
    var d=1.5+Math.random()*8;
    sF.frequency.linearRampToValueAtTime(t,AC.currentTime+d);
    setTimeout(sweep,d*1000);
  })();
}

function addBinauralBeats(){
  // Binaural beats: two slightly detuned oscillators, one per channel
  // Delta range (1–4 Hz difference) = deep fear/unease
  // Theta range (4–8 Hz difference) = trance/dread
  if(!AC) return;
  try{
    var merger=AC.createChannelMerger(2);
    merger.connect(_masterGain);

    // Left ear: 80 Hz base
    var oscL=AC.createOscillator(); oscL.type='sine'; oscL.frequency.value=80;
    var gainL=AC.createGain(); gainL.gain.value=0.12;
    oscL.connect(gainL); gainL.connect(merger,0,0);
    oscL.start();

    // Right ear: 80 + 3.5 Hz = 3.5 Hz binaural beat (delta/theta boundary)
    var oscR=AC.createOscillator(); oscR.type='sine'; oscR.frequency.value=83.5;
    var gainR=AC.createGain(); gainR.gain.value=0.12;
    oscR.connect(gainR); gainR.connect(merger,0,1);
    oscR.start();

    // Slowly drift the beat frequency between 2–7 Hz for maximum unease
    (function driftBeat(){
      var newFreq=80+(Math.random()*20-10);
      var beatHz=2+Math.random()*5;
      var d=8+Math.random()*20;
      oscL.frequency.linearRampToValueAtTime(newFreq,AC.currentTime+d);
      oscR.frequency.linearRampToValueAtTime(newFreq+beatHz,AC.currentTime+d);
      setTimeout(driftBeat,d*1000);
    })();

    // Second pair: higher frequency binaural (200 Hz + 6 Hz) — theta dread
    var oscL2=AC.createOscillator(); oscL2.type='sine'; oscL2.frequency.value=200;
    var gainL2=AC.createGain(); gainL2.gain.value=0.055;
    oscL2.connect(gainL2); gainL2.connect(merger,0,0);
    oscL2.start();
    var oscR2=AC.createOscillator(); oscR2.type='sine'; oscR2.frequency.value=206;
    var gainR2=AC.createGain(); gainR2.gain.value=0.055;
    oscR2.connect(gainR2); gainR2.connect(merger,0,1);
    oscR2.start();

  }catch(e){ console.warn('binaural failed:',e); }
}

function makeDistCurve(a){
  var n=512,c=new Float32Array(n);
  for(var i=0;i<n;i++){var x=i*2/n-1;c[i]=(Math.PI+a)*x/(Math.PI+a*Math.abs(x));}
  return c;
}
function makeIR(ac,dur,dec){
  var sr=ac.sampleRate,len=Math.ceil(sr*dur),buf=ac.createBuffer(2,len,sr);
  for(var c=0;c<2;c++){var d=buf.getChannelData(c);for(var i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,dec);}
  return buf;
}
function makeHallIR(ac){
  var sr=ac.sampleRate,dur=6.5,len=Math.ceil(sr*dur),buf=ac.createBuffer(2,len,sr);
  for(var c=0;c<2;c++){var d=buf.getChannelData(c);for(var i=0;i<len;i++){var t=i/sr;d[i]=(Math.random()*2-1)*Math.pow(1-t/dur,0.22)*(t<0.04?t/0.04:1);}}
  return buf;
}

async function searchIA(q,type){

  var r=await fetch(url); var d=await r.json();

async function getAudioURL(id){
  try{
    // Try /files endpoint first (returns {result:[...]})
    var r=await fetch('https://archive.org/metadata/'+id+'/files');
    var d=await r.json();
    var files=d.result||d.files||[];
    // Find audio file - prefer shorter files to load faster
    var audioFiles=files.filter(function(x){return x.name&&/\.(mp3|ogg|flac)$/i.test(x.name);});
    if(!audioFiles.length){
      // Fall back to full metadata
      var r2=await fetch('https://archive.org/metadata/'+id);
      var d2=await r2.json(); audioFiles=(d2.files||[]).filter(function(x){return x.name&&/\.(mp3|ogg)$/i.test(x.name);});
    }
    if(!audioFiles.length) return null;
    // Pick a random audio file from the item
    var f=audioFiles[0|Math.random()*audioFiles.length];
    return 'https://archive.org/download/'+id+'/'+f.name.replace(/ /g,'%20');
  }catch(e){return null;}
}
function launchStream(url,idx){

    el.loop=true; el.volume=1;
    el.playbackRate=0.3+Math.random()*1.2;
    el.play().catch(function(){});
    var src=AC.createMediaElementSource(el);
    var gain=AC.createGain(); gain.gain.value=0.03+Math.random()*0.06;
    src.connect(gain); gain.connect(_masterDistort);
    audioNodes.push({el:el,gain:gain,idx:idx});
    // Pitch wobble
    var ws=0.006+Math.random()*0.02, wd=0.04+Math.random()*0.12, wp=Math.random()*Math.PI*2;
    (function w(){
      el.playbackRate=(0.3+idx*0.07)+Math.sin(Date.now()*0.001*ws+wp)*wd;

  }catch(e){console.warn('stream failed:',url);}
}
function scheduleVolume(){
  if(!audioNodes.length) return;

    _dominantIdx=0|Math.random()*audioNodes.length;
    audioNodes.forEach(function(n,i){
      var t=i===_dominantIdx?(0.28+Math.random()*0.42):(Math.random()>0.6?0.05+Math.random()*0.1:0.003+Math.random()*0.02);

    });

}

// VOICE — hall reverb + backmasking (reverse playback of same phrase)
// ════════════════════════════════════════════════════════════════
function startVoice(){
  if(!window.speechSynthesis) return;
  // Prime voices
  var prime=new SpeechSynthesisUtterance(''); prime.volume=0;
  window.speechSynthesis.speak(prime);
  setTimeout(speak,5000);
}
function speak(){
  // Mouse entropy increases phrase intensity
  var entropyAmt=0.4+Math.min(_mouseEntropy*0.006,0.9);
  var phrase=ENTROPY.gen();
  if(!_voiceActive) doSpeak(phrase,entropyAmt);
  var delay=(12+Math.random()*16)*1000; // faster — every 12–28s
  setTimeout(speak,delay);
}

var _recordChunks=[];
var _mediaRecorder=null;

function doSpeak(phrase,zalgoAmt){
  if(!window.speechSynthesis||_voiceActive) return;
  _voiceActive=true;

  var vs=window.speechSynthesis.getVoices();
  var NON_US=/en[_\-](GB|AU|IN|ZA|NZ|IE|CA)/i;
  var dv=vs.find(function(v){
    return /male|david|alex|jorge|carlos|mark|fred|ralph/i.test(v.name)
      && /en[_\-]US/i.test(v.lang) && !NON_US.test(v.lang);
  })||vs.find(function(v){
    return /male|david|alex|jorge|carlos|mark|fred|ralph/i.test(v.name)
      && !NON_US.test(v.lang||'');
  })||vs.find(function(v){
    return /en[_\-]US/i.test(v.lang);
  })||vs[0];

  var u=new SpeechSynthesisUtterance(phrase);
  u.rate=0.16+Math.random()*0.10;
  u.pitch=0.05+Math.random()*0.08;
  u.volume=1.0;
  if(dv) u.voice=dv;

  // Display with zalgo scaled by mouse entropy
  displayText(phrase, Math.min(zalgoAmt,1.2));

  // Route through hall reverb
  try{
    var dest=AC.createMediaStreamDestination();
    var vsrc=AC.createMediaStreamSource(dest.stream);
    var vrev=AC.createConvolver(); vrev.buffer=makeHallIR(AC);
    var vgain=AC.createGain(); vgain.gain.value=1.0;
    var vdist=AC.createWaveShaper(); vdist.curve=makeDistCurve(45);
    vsrc.connect(vdist); vdist.connect(vrev); vrev.connect(vgain); vgain.connect(_voiceDestGain);
    u.output=dest;

    // Record for backmasking/reverse playback
    try{
      _recordChunks=[];
      _mediaRecorder=new MediaRecorder(dest.stream,{mimeType:'audio/webm'});
      _mediaRecorder.ondataavailable=function(e){ if(e.data.size>0) _recordChunks.push(e.data); };
      _mediaRecorder.onstop=function(){
        var blob=new Blob(_recordChunks,{type:'audio/webm'});
        var burl=URL.createObjectURL(blob);
        // Play pitch-down copy at -4 octaves
        playPitchDownCopy(burl);
        // Also schedule a reversed playback after a delay
        scheduleReversePlayback(blob);
      };
      _mediaRecorder.start();
    }catch(e){}
  }catch(e){}

  u.onend=function(){
    _voiceActive=false;
    try{ if(_mediaRecorder&&_mediaRecorder.state==='recording') _mediaRecorder.stop(); }catch(e){}
  };
  u.onerror=function(){
    _voiceActive=false;
    try{ if(_mediaRecorder&&_mediaRecorder.state==='recording') _mediaRecorder.stop(); }catch(e){}
  };
  window.speechSynthesis.speak(u);
}

function playPitchDownCopy(blobUrl){
  if(!AC) return;
  try{
    var el=new Audio(blobUrl);
    el.crossOrigin='anonymous';
    el.playbackRate=0.0625; // 1/16 = -4 octaves
    el.volume=0.85;
    var src=AC.createMediaElementSource(el);
    var deepRev=AC.createConvolver(); deepRev.buffer=makeHallIR(AC);
    var deepGain=AC.createGain(); deepGain.gain.value=0.7;
    var deepDist=AC.createWaveShaper(); deepDist.curve=makeDistCurve(120);
    src.connect(deepDist); deepDist.connect(deepRev); deepRev.connect(deepGain); deepGain.connect(_masterGain);
    el.onended=function(){ try{URL.revokeObjectURL(blobUrl);}catch(e){}};
    setTimeout(function(){ el.play().catch(function(){}); },600);
  }catch(e){}
}

function scheduleReversePlayback(blob){
  // Decode the blob audio, reverse the buffer, play it back — true backmasking
  if(!AC) return;
  var reader=new FileReader();
  reader.onload=function(e){
    AC.decodeAudioData(e.target.result.slice(0),function(buf){
      // Reverse each channel in place
      for(var ch=0;ch<buf.numberOfChannels;ch++){
        var data=buf.getChannelData(ch);
        Array.prototype.reverse.call(data);
      }
      // Play after the forward voice has finished, with pitch-down + heavy reverb
      var src=AC.createBufferSource();
      src.buffer=buf;
      src.playbackRate.value=0.35+Math.random()*0.25; // slow and wrong
      var rev=AC.createConvolver(); rev.buffer=makeHallIR(AC);
      var dist=AC.createWaveShaper(); dist.curve=makeDistCurve(180);
      var gain=AC.createGain(); gain.gain.value=0.55;
      src.connect(dist); dist.connect(rev); rev.connect(gain); gain.connect(_masterGain);
      // Start 2–5s after the forward voice ends
      var startDelay=(2+Math.random()*3)*1000;
      setTimeout(function(){ src.start(); },startDelay);
    },function(e){ console.warn('decode failed',e); });
  };
  reader.readAsArrayBuffer(blob);
}

    frame++;

    // Chromatic aberration lines — rare tears
    if(Math.random()<0.04){

      _distortCtx.fillRect(Math.random()*8-4,ty,W,th);
    }

    // Mouse-reactive warp lines near cursor
    if(_mouseEntropy>10){
      var intensity=Math.min(_mouseEntropy/80,1);
      for(var i=0;i<3;i++){
        var lx=_mouseX+(Math.random()-0.5)*200*intensity;
        var ly=_mouseY+(Math.random()-0.5)*200*intensity;
        var lw=(Math.random()-0.5)*300*intensity;

        _distortCtx.fillRect(lx,ly,lw,1+Math.random()*2);
      }
    }

    // Occasional full-width horizontal tear
    if(frame%240<2){
      var fy=Math.floor(Math.random()*H);
      _distortCtx.fillStyle='rgba(200,0,0,0.18)';
      _distortCtx.fillRect(0,fy,W,2);
      _distortCtx.fillStyle='rgba(0,0,0,0.35)';
      _distortCtx.fillRect(0,fy+2,W,6);

    // Scanline flicker
    if(frame%4===0){
      var sy=Math.floor(Math.random()*H);
      _distortCtx.fillStyle='rgba(255,255,255,'+(Math.random()*0.04)+')';
      _distortCtx.fillRect(0,sy,W,1);
    }

    requestAnimationFrame(loop);
  })();
}

function initMouseEntropy(){
  var _lastMX=0,_lastMY=0,_lastMT=0;
  document.addEventListener('mousemove',function(e){
    _mouseX=e.clientX; _mouseY=e.clientY;
    var now=Date.now();
    var dt=now-_lastMT; if(dt<16) return;
    var dx=e.clientX-_lastMX,dy=e.clientY-_lastMY;
    var speed=Math.sqrt(dx*dx+dy*dy)/(dt||1)*16;
    _mouseEntropy=Math.min(100,_mouseEntropy+speed*0.6);
    _lastMX=e.clientX; _lastMY=e.clientY; _lastMT=now;
  });
  // Entropy decays toward zero
  setInterval(function(){ _mouseEntropy=Math.max(0,_mouseEntropy-1.5); },80);
}

// GITHUB ASSET LOADER — auto-discovers files from repo on each load
// ════════════════════════════════════════════════════════════════
var GH_REPO = 'matronthorn/Horror-assets';
var GH_BRANCH = 'main';
var GH_API = 'https://api.github.com/repos/' + GH_REPO + '/contents/';
var GH_RAW = 'https://raw.githubusercontent.com/' + GH_REPO + '/' + GH_BRANCH + '/';

var _ghVideos = [];    // video URLs discovered from repo
var _ghImages = [];    // image URLs discovered from repo
var _ghLoaded = false;

async function loadGithubAssets(path) {
  // Recursively fetch file list from GitHub Contents API
  // Works for flat repos and subdirectories
  path = path || '';
  var videos = [], images = [];
  try {
    var resp = await fetch(GH_API + path + '?ref=' + GH_BRANCH, {
      headers: { 'Accept': 'application/vnd.github.v3+json' }
    });
    if (!resp.ok) throw new Error('GitHub API: ' + resp.status);
    var items = await resp.json();
    if (!Array.isArray(items)) return { videos:[], images:[] };

    for (var i = 0; i < items.length; i++) {
      var item = items[i];
      if (item.type === 'dir') {
        // Recurse into subdirectories
        var sub = await loadGithubAssets(item.path + '/');
        videos = videos.concat(sub.videos);
        images = images.concat(sub.images);
      } else if (item.type === 'file') {
        var name = item.name.toLowerCase();
        var rawUrl = GH_RAW + item.path;
        if (/\.(mp4|webm|mov|avi|mkv)$/.test(name)) {
          videos.push(rawUrl);
        } else if (/\.(jpg|jpeg|png|gif|webp)$/.test(name)) {
          images.push(rawUrl);
        }
      }
    }
  } catch(e) {
    console.warn('GitHub asset load failed:', e.message);
  }
  return { videos: videos, images: images };
}

async function initGithubAssets() {
  var assets = await loadGithubAssets();
  _ghVideos = assets.videos;
  _ghImages = assets.images;

    var i=0|Math.random()*_videoSlots.length;loadVideo(_videoSlots[i]);
  },31000);
  // Dedicated GitHub slot refresh — always shows latest repo content
  setInterval(function(){
    if(_ghVideos.length>0){
      var i=0|Math.random()*_videoSlots.length;
      loadGithubVideoInSlot(_videoSlots[i]);
    }
  },25000);;
}
async function loadVideo(slot){
  // 35% chance: use GitHub video if available
  if(_ghLoaded && _ghVideos.length > 0 && Math.random() < 0.35){
    loadGithubVideoInSlot(slot);
    return;
  }
  var id;
  if(Math.random()>0.35){
    id=IA_VIDEO_IDS[0|Math.random()*IA_VIDEO_IDS.length];
  }else{
    var qs=['subject:(psychiatric+hospital)+mediatype:movies',
            'subject:(evangelical+revival)+mediatype:movies',
            'subject:(surgery+medical+educational)+mediatype:movies',
            'subject:(atomic+nuclear+war)+mediatype:movies',
            'subject:(horror)+mediatype:movies+year:[1920+TO+1975]',
            'collection:(prelinger)+mediatype:movies',
            'subject:(exploitation+film)+mediatype:movies',
            'subject:(propaganda)+mediatype:movies'];
    try{id=await searchIA(qs[(_vsearchIdx++)%qs.length],'movies');}catch(e){}
    if(!id) id=IA_VIDEO_IDS[0|Math.random()*IA_VIDEO_IDS.length];
  }
  slot.innerHTML='';
  var f=document.createElement('iframe');
  f.src='https://archive.org/embed/'+id+'?autoplay=1&start='+Math.floor(Math.random()*500);
  f.setAttribute('allow','autoplay; fullscreen');
  f.setAttribute('frameborder','0');
  f.setAttribute('scrolling','no');
  f.style.cssText='position:absolute;width:210%;height:210%;top:-55%;left:-55%;border:none;pointer-events:none;opacity:0;transition:opacity 5s ease;';
  // Start invisible
  f.style.opacity='0';
  f.style.transition='opacity 6s ease';
  // Force visible after 8s regardless of onload (IA embeds are unreliable)
  var forceTimer = setTimeout(function(){ f.style.opacity='1'; }, 8000);
  f.onload=function(){
    clearTimeout(forceTimer);
    setTimeout(function(){ f.style.opacity='1'; }, 500);
  };
  slot.appendChild(f);
}

// ════════════════════════════════════════════════════════════════
// IMAGES — anatomical / figure / medical
// ════════════════════════════════════════════════════════════════
function initImages(){
  _imageLayer=document.getElementById('imageLayer');
  loadImages();
  setInterval(loadImages,10000);
  requestAnimationFrame(animImages);
}
async function loadImages(){
  var cat=WIKI_CATS[0|Math.random()*WIKI_CATS.length];
  try{
    var url='https://commons.wikimedia.org/w/api.php?action=query&list=categorymembers&cmtitle=Category:'+encodeURIComponent(cat)+'&cmlimit=20&cmtype=file&format=json&origin=*';
    var r=await fetch(url); var d=await r.json();
    var ms=(d.query&&d.query.categorymembers)||[];
    if(!ms.length) return;
    var titles=ms.slice(0,8).map(function(m){return m.title;}).join('|');
    var ir=await fetch('https://commons.wikimedia.org/w/api.php?action=query&titles='+encodeURIComponent(titles)+'&prop=imageinfo&iiprop=url&iiurlwidth=700&format=json&origin=*');
    var id=await ir.json();
    Object.values((id.query&&id.query.pages)||{}).forEach(function(p){
      var info=p.imageinfo&&p.imageinfo[0];
      if(info&&info.thumburl) addImg(info.thumburl);
    });
  }catch(e){}
}
function addImg(src){
  var img=new Image(); img.crossOrigin='anonymous';
  img.onload=function(){
    var el=document.createElement('img');
    el.src=src;
    var sz=150+Math.random()*400;
    var blends=['screen','overlay','hard-light','color-dodge','lighten','difference'];
    el.style.cssText=[
      'position:absolute','width:'+sz+'px',
      'left:'+(Math.random()*90+5)+'%',
      'top:'+(Math.random()*90+5)+'%',
      'transform:translate(-50%,-50%) rotate('+(Math.random()*40-20)+'deg)',
      'mix-blend-mode:'+blends[0|Math.random()*blends.length],
      'opacity:0','transition:opacity 3s ease','pointer-events:none',
      'filter:contrast('+(1.4+Math.random()*0.9)+') brightness('+(0.45+Math.random()*0.65)+') saturate('+(0.2+Math.random()*1.2)+')',
    ].join(';');
    _imageLayer.appendChild(el);
    var base=0.20+Math.random()*0.38;
    _driftImages.push({
      el:el,vx:(Math.random()-0.5)*0.02,vy:(Math.random()-0.5)*0.02,
      x:parseFloat(el.style.left),y:parseFloat(el.style.top),
      base:base,life:18000+Math.random()*35000,born:Date.now()
    });
    setTimeout(function(){el.style.opacity=base.toString();},300);
    if(_driftImages.length>35){
      var old=_driftImages.shift();
      old.el.style.opacity='0';
      setTimeout(function(){try{old.el.parentNode.removeChild(old.el);}catch(e){}},4000);
    }
  };
  img.src=src;
}
function animImages(){
  var now=Date.now();
  var pulse=(Math.sin(_organicPulse*0.75)+1)/2;
  _driftImages.forEach(function(d){
    d.x+=d.vx; d.y+=d.vy;
    if(d.x<3){d.x=3;d.vx=Math.abs(d.vx);}
    if(d.x>97){d.x=97;d.vx=-Math.abs(d.vx);}
    if(d.y<3){d.y=3;d.vy=Math.abs(d.vy);}
    if(d.y>97){d.y=97;d.vy=-Math.abs(d.vy);}
    d.el.style.left=d.x+'%'; d.el.style.top=d.y+'%';
    var age=now-d.born;
    var lf=age>d.life-6000?Math.max(0,(d.life-age)/6000):1;
    // Pulsating throb — tied to organic pulse
    var throb=d.base*(0.55+pulse*0.45)*lf;
    d.el.style.opacity=throb.toString();
    // Scale throb
    var sc=1.0+Math.sin(_organicPulse*1.1+d.born*0.00008)*0.10;
    d.el.style.transform=d.el.style.transform.replace(/\s*scale\([^)]+\)/,'')
      +' scale('+sc+')';
  });
  requestAnimationFrame(animImages);
}

// ════════════════════════════════════════════════════════════════
// ORGANIC PULSE — drives pulsating throb throughout
// ════════════════════════════════════════════════════════════════
function startOrganicPulse(){
  function tick(){
    _organicPulse+=0.016+Math.sin(_organicPulse*0.07)*0.006;
    // Video layer filter pulse
    var vl=document.getElementById('videoLayer');
    if(vl){
      var vp=(Math.sin(_organicPulse*0.55)+1)/2;
      vl.style.filter='brightness('+(0.5+vp*0.5)+') saturate('+(1+vp*1.2)+') contrast('+(1+vp*0.4)+')';
    }
    requestAnimationFrame(tick);
  }
  tick();
}

// ════════════════════════════════════════════════════════════════
// VOID CANVAS
// ════════════════════════════════════════════════════════════════
function initVoidCanvas(){
  var c=document.getElementById('voidCanvas');
  _voidCtx=c.getContext('2d');
  c.width=window.innerWidth; c.height=window.innerHeight;
  window.addEventListener('resize',function(){c.width=window.innerWidth;c.height=window.innerHeight;});
  (function av(){drawVoid();requestAnimationFrame(av);})();
}
function drawVoid(){
  if(!_voidCtx) return;
  var W=window.innerWidth,H=window.innerHeight,cx=W/2,cy=H/2;
  var maxR=Math.max(W,H)*0.76;
  _voidCtx.clearRect(0,0,W,H);
  // Primary void
  var g=_voidCtx.createRadialGradient(cx,cy,0,cx,cy,maxR);
  g.addColorStop(0,'rgba(0,0,0,1)');
  g.addColorStop(0.22,'rgba(0,0,0,0.99)');
  g.addColorStop(0.28,'rgba(0,0,0,0.97)');
  g.addColorStop(0.34,'rgba(0,0,0,0.88)');
  g.addColorStop(0.42,'rgba(0,0,0,0.62)');
  g.addColorStop(0.52,'rgba(0,0,0,0.35)');
  g.addColorStop(0.65,'rgba(0,0,0,0.14)');
  g.addColorStop(0.82,'rgba(0,0,0,0.04)');
  g.addColorStop(1.0,'rgba(0,0,0,0)');
  _voidCtx.fillStyle=g; _voidCtx.fillRect(0,0,W,H);
  // Pulsing dark ring at void boundary
  var rr=Math.min(W,H)*(0.30+Math.sin(_organicPulse*0.65)*0.035);
  var rg=_voidCtx.createRadialGradient(cx,cy,rr*0.65,cx,cy,rr*1.2);
  var ra=0.25+Math.sin(_organicPulse*1.4)*0.18;
  rg.addColorStop(0,'rgba(50,0,0,0)');
  rg.addColorStop(0.5,'rgba(30,0,0,'+ra+')');
  rg.addColorStop(1,'rgba(0,0,0,0)');
  _voidCtx.fillStyle=rg; _voidCtx.fillRect(0,0,W,H);
  // Edge vignette
  var eg=_voidCtx.createRadialGradient(cx,cy,maxR*0.5,cx,cy,maxR);
  eg.addColorStop(0,'rgba(0,0,0,0)');
  eg.addColorStop(1,'rgba(0,0,0,0.80)');
  _voidCtx.fillStyle=eg; _voidCtx.fillRect(0,0,W,H);
}

function initNoiseCanvas(){
  var c=document.getElementById('noiseCanvas');
  _noiseCtx=c.getContext('2d');
  c.width=window.innerWidth; c.height=window.innerHeight;
  window.addEventListener('resize',function(){c.width=window.innerWidth;c.height=window.innerHeight;});
  (function n(){
    var W=c.width,H=c.height,d=_noiseCtx.createImageData(W,H),p=d.data;
    for(var i=0;i<p.length;i+=4){var v=Math.random()*255|0;p[i]=p[i+1]=p[i+2]=v;p[i+3]=255;}
    _noiseCtx.putImageData(d,0,0);
    setTimeout(n,55);
  })();
}

// ════════════════════════════════════════════════════════════════
// TEXT — Zalgo + type-on
// ════════════════════════════════════════════════════════════════
var ZU_='̍̎̄̅̿̑̆̐͒͗͑̇̈̊͂̓̈͊͋͌̃̂̌͐̀́̋̏̒'.split('');
var ZM_='̴̵̶̸̷̡̢̧̨̛̀́̕͘͜͟͢͝͞͠͡'.split('');
var ZD_='̖̗̘̙̜̝̞̟̠̤̥̦̩̪̫̬̭̮̯̰̱̲̳̹̺̻̼͇͈͉͍͎͓͔͕͖͙͚ͅ'.split('');
function zg(txt,a){
  if(!a||a<=0) return txt;
  var r='';
  for(var i=0;i<txt.length;i++){
    r+=txt[i];
    for(var u=0|Math.random()*a*8;u--;) r+=ZU_[0|Math.random()*ZU_.length];
    if(Math.random()<a*0.5) r+=ZM_[0|Math.random()*ZM_.length];
    for(var d=0|Math.random()*a*6;d--;) r+=ZD_[0|Math.random()*ZD_.length];
  }
  return r;
}
function initText(){_textEl=document.getElementById('voidText');}
function displayText(phrase,zi){
  if(!_textEl) return;
  clearTimeout(_typeTimer);
  _textEl.innerHTML='';
  // Heavy zalgo always — scale with entropy
  var zBase=Math.max(0.55,zi)+(Math.random()*0.3)+(_mouseEntropy*0.007);
  var words=phrase.split(' ');
  var disp=words.map(function(w){
    return zg(w, zBase+(Math.random()>0.5?Math.random()*0.9:0));
  }).join(' ');
  var chars=disp.split('');
  var delay_=0;
  chars.forEach(function(ch){
    var s=document.createElement('span');
    s.textContent=ch; _textEl.appendChild(s);
    delay_+=25+Math.random()*55;
    (function(sp,d){setTimeout(function(){sp.style.opacity='1';},d);})(s,delay_);
  });
  // Mid-display glitch re-corruption
  setTimeout(function(){
    _textEl.querySelectorAll('span').forEach(function(s){
      if(Math.random()<0.28) s.textContent=zg(s.textContent, zBase+Math.random()*1.2);
    });
  }, delay_*0.5);
  _typeTimer=setTimeout(function(){
    _textEl.querySelectorAll('span').forEach(function(s){s.style.opacity='0';});
    setTimeout(function(){if(_textEl)_textEl.innerHTML='';},1200);
  },delay_+6000);
}

// ════════════════════════════════════════════════════════════════
// STOPALL — parent-frame teardown
// Called by index.html's closeInstallation() / popstate / pagehide.
// ════════════════════════════════════════════════════════════════
function stopAllHellVoid(){
  if(_STOPPED) return;
  _STOPPED = true;
  STARTED = false;

  // Speech synthesis
  try { if(window.speechSynthesis) window.speechSynthesis.cancel(); } catch(e) {}

  // Clear flicker chain
  try { if(_flickerTimer) clearTimeout(_flickerTimer); } catch(e) {}

  // Clear all tracked intervals and timeouts
  _intervalsHV.forEach(function(id){ try{ clearInterval(id); }catch(e){} });
  _timeoutsHV.forEach(function(id){ try{ clearTimeout(id); }catch(e){} });
  _intervalsHV = []; _timeoutsHV = [];

  // Zero all audio-node gains, then close the AudioContext
  try {
    audioNodes.forEach(function(n){
      try { if(n.el){ n.el.pause(); n.el.src=''; try{n.el.load();}catch(e){} } } catch(e) {}
      try { if(n.gain && AC) n.gain.gain.linearRampToValueAtTime(0, AC.currentTime + 0.05); } catch(e) {}
    });
  } catch(e) {}
  try {
    if(_masterGain && AC) _masterGain.gain.linearRampToValueAtTime(0, AC.currentTime + 0.1);
  } catch(e) {}
  setTimeout(function(){
    try { if(AC && AC.state !== 'closed') AC.close(); } catch(e) {}
  }, 200);

  // Pause and detach the 9 iframe videos
  try {
    _videoSlots.forEach(function(slot){
      if(slot){
        var fr = slot.querySelector('iframe');
        if(fr){ try{ fr.src = 'about:blank'; }catch(e){} try{ fr.remove(); }catch(e){} }
      }
    });
  } catch(e) {}

  // Stop any playing drift images
  try {
    _driftImages.forEach(function(d){ if(d && d.el){ try{d.el.style.opacity='0';}catch(e){} } });
  } catch(e) {}
}
window.stopAll = stopAllHellVoid;
window.stopVoice = stopAllHellVoid; // legacy alias
window.addEventListener('pagehide', stopAllHellVoid);
window.addEventListener('beforeunload', stopAllHellVoid);
document.addEventListener('visibilitychange', function(){
  if(document.hidden && AC && AC.state === 'running'){ try{ AC.suspend(); }catch(e){} }
  else if(!document.hidden && AC && AC.state === 'suspended' && !_STOPPED){ try{ AC.resume(); }catch(e){} }
});
