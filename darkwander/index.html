<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Darkwander</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none;}
body{background:#000;overflow:hidden;width:100vw;height:100vh;cursor:none;}
canvas{display:block;touch-action:none;}
#ui{position:fixed;inset:0;pointer-events:none;z-index:10;}
#vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 40%,rgba(0,0,0,0.06) 68%,rgba(0,0,0,0.50) 100%);}
#gn{position:absolute;inset:0;opacity:.016;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:200px 200px;animation:gs .1s steps(1) infinite;}
@keyframes gs{0%{background-position:0 0}25%{background-position:-50px -25px}50%{background-position:25px -50px}75%{background-position:-25px 50px}100%{background-position:50px 25px}}
#fade{position:absolute;inset:0;background:#000;opacity:1;pointer-events:none;transition:opacity 2s ease;z-index:5;}
#fade.clear{opacity:0;}
#msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:rgba(200,185,155,0);font-family:'Palatino Linotype',Palatino,serif;font-size:clamp(11px,1.8vw,15px);letter-spacing:.45em;text-transform:uppercase;text-align:center;pointer-events:none;transition:color 2.5s ease-in-out;max-width:55vw;line-height:2.2;z-index:6;}
#msg.show{color:rgba(200,175,130,.36);}
#zone{position:absolute;bottom:55px;left:50%;transform:translateX(-50%);color:rgba(160,140,100,0);font-family:'Palatino Linotype',serif;font-size:9px;letter-spacing:.55em;text-transform:uppercase;transition:color 3s ease-in-out;pointer-events:none;}
#zone.show{color:rgba(160,140,100,.24);}
#ctrl{display:none;position:fixed;inset:0;z-index:20;pointer-events:none;}
#move{position:absolute;bottom:0;left:0;width:50%;height:220px;pointer-events:all;touch-action:none;}
#look{position:absolute;bottom:0;right:0;width:50%;height:100%;pointer-events:all;touch-action:none;}
.btn{position:absolute;border-radius:50%;border:1px solid rgba(180,150,80,.12);background:rgba(0,0,0,.24);display:flex;align-items:center;justify-content:center;pointer-events:all;touch-action:none;color:rgba(180,150,80,.20);font-size:17px;font-family:serif;}
#bf{width:70px;height:70px;bottom:80px;left:50%;transform:translateX(-50%);}
#bl{width:52px;height:52px;bottom:90px;left:calc(50% - 88px);}
#br{width:52px;height:52px;bottom:90px;left:calc(50% + 36px);}
#lh{position:absolute;top:14px;right:14px;color:rgba(140,120,80,.12);font-family:'Palatino Linotype',serif;font-size:8px;letter-spacing:.3em;text-transform:uppercase;pointer-events:none;}
@media(max-width:900px){#ctrl{display:block;}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="vig"></div>
  <div id="gn"></div>
  <div id="fade"></div>
  <div id="msg"></div>
  <div id="zone"></div>
</div>
<div id="ctrl">
  <div id="move">
    <div class="btn" id="bf">↑</div>
    <div class="btn" id="bl">←</div>
    <div class="btn" id="br">→</div>
  </div>
  <div id="look"></div>
  <div id="lh">drag to look</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';

// ═══════════════════════════════════════════════════════
// SONG TIMING
// ═══════════════════════════════════════════════════════
const T_TOTAL=2300,T_TRANS=1820,T_DIRECT=2230,T_WIN=2210,T_RESET=2300;

// ═══════════════════════════════════════════════════════
// AUDIO
// ═══════════════════════════════════════════════════════
let AC=null, bufs={}, mainSrc=null, mainStart=0, lastStep=0, ambiGoing=false, audioReady=false;
function getAC(){if(!AC){AC=new(window.AudioContext||window.webkitAudioContext)();}if(AC.state==='suspended')AC.resume();return AC;}
async function loadBuf(k,p){try{const r=await fetch(p);if(!r.ok)return;bufs[k]=await AC.decodeAudioData(await r.arrayBuffer());console.log('[✓]',k);}catch(e){}}
function playBuf(k,vol,rate){if(!AC||!bufs[k])return;const s=AC.createBufferSource();s.buffer=bufs[k];s.playbackRate.value=rate||1;const g=AC.createGain();g.gain.value=vol||1;s.connect(g);g.connect(AC.destination);s.start();}
function synthStep(){
  const ac=AC,now=ac.currentTime;
  const b=ac.createBuffer(1,ac.sampleRate*.06,ac.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2.2);
  const s=ac.createBufferSource();s.buffer=b;
  const f=ac.createBiquadFilter();f.type='bandpass';f.frequency.value=200;f.Q.value=0.6;
  const g=ac.createGain();g.gain.setValueAtTime(.8,now);g.gain.exponentialRampToValueAtTime(.001,now+.4);
  s.connect(f);f.connect(g);g.connect(ac.destination);s.start(now);
  const rb=ac.createBuffer(1,ac.sampleRate*.9,ac.sampleRate),rd=rb.getChannelData(0);
  for(let i=0;i<rd.length;i++)rd[i]=(Math.random()*2-1)*Math.pow(1-i/rd.length,1.1)*.07;
  const rs=ac.createBufferSource();rs.buffer=rb;
  const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=450;
  const rg=ac.createGain();rg.gain.value=.40;
  rs.connect(lp);lp.connect(rg);rg.connect(ac.destination);rs.start(now+.03);
}
function synthDrip(){
  const ac=AC,now=ac.currentTime;
  const o=ac.createOscillator();o.type='sine';
  o.frequency.setValueAtTime(1200+Math.random()*800,now);
  o.frequency.exponentialRampToValueAtTime(160,now+.18);
  const g=ac.createGain();g.gain.setValueAtTime(.20+Math.random()*.15,now);g.gain.exponentialRampToValueAtTime(.001,now+.24);
  const lp=ac.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2200;
  o.connect(lp);lp.connect(g);g.connect(ac.destination);o.start(now);o.stop(now+.28);
}
function startAmbi(){
  if(!AC||ambiGoing)return;ambiGoing=true;
  if(bufs.ambi){const n=AC.createBufferSource();n.buffer=bufs.ambi;n.loop=true;const g=AC.createGain();g.gain.value=.28;n.connect(g);g.connect(AC.destination);n.start();return;}
  const m=AC.createGain();m.gain.value=.14;m.connect(AC.destination);
  const o1=AC.createOscillator();o1.type='sawtooth';o1.frequency.value=36;
  const f1=AC.createBiquadFilter();f1.type='lowpass';f1.frequency.value=85;o1.connect(f1);f1.connect(m);o1.start();
  const o2=AC.createOscillator();o2.type='sine';o2.frequency.value=72.5;
  const g2=AC.createGain();g2.gain.value=.25;o2.connect(g2);g2.connect(m);o2.start();
  const nb=AC.createBuffer(1,AC.sampleRate*2,AC.sampleRate),nd=nb.getChannelData(0);
  for(let i=0;i<nd.length;i++)nd[i]=(Math.random()*2-1)*.025;
  const ns=AC.createBufferSource();ns.buffer=nb;ns.loop=true;
  const nf=AC.createBiquadFilter();nf.type='bandpass';nf.frequency.value=750;nf.Q.value=.22;
  const ng=AC.createGain();ng.gain.value=.08;ns.connect(nf);nf.connect(ng);ng.connect(m);ns.start();
}
function startMain(){if(!AC||!bufs.main)return;try{if(mainSrc)mainSrc.stop();}catch(e){}mainSrc=AC.createBufferSource();mainSrc.buffer=bufs.main;const g=AC.createGain();g.gain.value=.78;mainSrc.connect(g);g.connect(AC.destination);mainSrc.start();mainStart=AC.currentTime;}
function songTime(){return AC?Math.min(AC.currentTime-mainStart,T_TOTAL):0;}
function doStep(){const ac=AC;if(!ac)return;const now=ac.currentTime;if(now-lastStep<.46)return;lastStep=now;if(bufs.step)playBuf('step',.58+Math.random()*.22,.90+Math.random()*.18);else synthStep();}
function doDrip(){const k=['drip','drip2','drip3'][0|Math.random()*3];if(bufs[k])playBuf(k,.25+Math.random()*.28,.86+Math.random()*.26);else synthDrip();}
async function initAudio(){
  getAC();
  await Promise.all(['step','drip','drip2','drip3','ambi','main'].map(k=>loadBuf(k,k==='main'?'audio/nightmareflesh.mp3':k==='step'?'audio/footstep.wav':k==='ambi'?'audio/ambience.wav':`audio/${k}.wav`)));
  startAmbi();startMain();
}
function triggerAudio(){if(audioReady)return;audioReady=true;initAudio();}

// ═══════════════════════════════════════════════════════
// RENDERER
// ═══════════════════════════════════════════════════════
const canvas=document.getElementById('c');
const R=new THREE.WebGLRenderer({canvas,antialias:false});
R.setPixelRatio(Math.min(window.devicePixelRatio,1.5));
R.setSize(window.innerWidth,window.innerHeight);
R.shadowMap.enabled=false;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x03060c);
// Fog: near=30, far=90 — you can see 3-4 full segments before fade
scene.fog=new THREE.Fog(0x03060c,30,90);

const cam=new THREE.PerspectiveCamera(70,window.innerWidth/window.innerHeight,.1,100);
cam.position.set(0,1.7,0);

// ═══════════════════════════════════════════════════════
// CONSTANTS
// ═══════════════════════════════════════════════════════
const CW=4.2,   // corridor width
      CH=10.0,  // ceiling height
      SEG=12,   // segment length
      LOOK_AHEAD=20; // segments pre-built AHEAD of camera — guaranteed no black wall

// ═══════════════════════════════════════════════════════
// ZONES
// ═══════════════════════════════════════════════════════
const ZONES=[
  {name:'THE INTAKE',  base:[80,83,88], fog:0x03060c, lr:205,lg:225,lb:255},
  {name:'THE DRAIN',   base:[76,70,64], fog:0x090806, lr:240,lg:208,lb:158},
  {name:'THE DEEPS',   base:[64,70,80], fog:0x030510, lr:175,lg:205,lb:255},
  {name:'PROCESSING',  base:[70,74,66], fog:0x050803, lr:195,lg:232,lb:185},
  {name:'THE ASCENT',  base:[78,74,66], fog:0x0a0907, lr:255,lg:225,lb:165},
];
let zoneIdx=0;
const zoneEl=document.getElementById('zone');
function getZone(){return ZONES[zoneIdx%ZONES.length];}
function advanceZone(){
  zoneIdx++;const z=getZone();zoneEl.textContent=z.name;zoneEl.classList.add('show');
  setTimeout(()=>zoneEl.classList.remove('show'),5000);
  targFog.setHex(z.fog);
}

// ═══════════════════════════════════════════════════════
// SCONCE LIGHT TEXTURE
// A rectangular wall sconce — proper fixture shape
// ═══════════════════════════════════════════════════════
function mkSconceGlowTex(lr,lg,lb){
  // Oval/rectangular warm glow — wider than tall
  const W=128,H=64,c=document.createElement('canvas');c.width=W;c.height=H;
  const ctx=c.getContext('2d');
  const gr=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,W/2);
  gr.addColorStop(0,  `rgba(${lr},${lg},${lb},1)`);
  gr.addColorStop(.20,`rgba(${lr},${lg},${lb},.65)`);
  gr.addColorStop(.50,`rgba(${lr},${lg},${lb},.18)`);
  gr.addColorStop(.80,`rgba(${lr},${lg},${lb},.04)`);
  gr.addColorStop(1,  `rgba(${lr},${lg},${lb},0)`);
  ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
  return new THREE.CanvasTexture(c);
}

// Pre-generate glow textures per zone
const ZONE_GLOWS=ZONES.map(z=>({
  close:mkSconceGlowTex(z.lr,z.lg,z.lb),
  halo: mkSconceGlowTex(Math.round(z.lr*.35),Math.round(z.lg*.4),Math.round(z.lb*.6))
}));

// ═══════════════════════════════════════════════════════
// WALL LIGHTMAP TEXTURE
// ═══════════════════════════════════════════════════════
const rng=(seed,n)=>Math.sin(seed*127.1+n*311.7)*.5+.5;

function mkWallTex(seed,lightNY,hasLight,intensity,zone){
  const z=zone||ZONES[0];
  const [br,bg,bb]=z.base;
  const W=512,H=512,c=document.createElement('canvas');c.width=W;c.height=H;
  const ctx=c.getContext('2d');

  // Base concrete
  ctx.fillStyle=`rgb(${br},${bg},${bb})`;ctx.fillRect(0,0,W,H);
  // Surface variation
  for(let y=0;y<H;y+=2){const v=rng(seed,y)*7-3.5|0;ctx.fillStyle=`rgba(${br+v},${bg+v},${bb+v},.16)`;ctx.fillRect(0,y,W,2);}
  // Pour lines
  for(let y=0;y<H;y+=4+rng(seed,y+100)*7){const a=.07+rng(seed,y+200)*.10;ctx.fillStyle=rng(seed,y+300)>.5?`rgba(0,0,0,${a})`:`rgba(255,255,255,${a*.35})`;ctx.fillRect(0,y,W,1+rng(seed,y+400)*.5);}
  // Tie holes
  for(let i=0;i<14;i++){
    const hx=rng(seed,i+600)*W,hy=rng(seed,i+700)*H,hr=1.0+rng(seed,i+800)*2.5;
    ctx.beginPath();ctx.arc(hx,hy,hr,0,Math.PI*2);ctx.fillStyle=`rgba(8,8,11,${.52+rng(seed,i+900)*.28})`;ctx.fill();
    if(rng(seed,i+1000)>.38){const sg=ctx.createLinearGradient(hx,hy+hr,hx+rng(seed,i+1100)*3,hy+hr+18+rng(seed,i+1200)*25);sg.addColorStop(0,`rgba(55,18,8,${.22+rng(seed,i+1300)*.18})`);sg.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=sg;ctx.fillRect(hx-3,hy,7,44);}
    const hgr=ctx.createRadialGradient(hx,hy,hr,hx,hy,hr*3.5);hgr.addColorStop(0,'rgba(0,0,0,.16)');hgr.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=hgr;ctx.fillRect(hx-hr*4,hy-hr*4,hr*8,hr*8);
  }
  // Cracks
  for(let i=0;i<4;i++){
    if(rng(seed,i+2000)<.3)continue;
    ctx.beginPath();let cx2=rng(seed,i+2100)*W,cy2=rng(seed,i+2200)*H*.18;ctx.moveTo(cx2,cy2);
    for(let s=0;s<12;s++){cx2+=(rng(seed,i+s+2300)-.5)*3.8;cy2+=rng(seed,i+s+2400)*H*.1;ctx.lineTo(cx2,cy2);}
    ctx.strokeStyle=`rgba(8,8,11,${.26+rng(seed,i+2500)*.22})`;ctx.lineWidth=.5+rng(seed,i+2600)*.5;ctx.stroke();
  }
  // Efflorescence
  for(let i=0;i<3;i++){
    if(rng(seed,i+3000)<.48)continue;
    const ex=rng(seed,i+3100)*W,ey=rng(seed,i+3200)*H*.28,eh=15+rng(seed,i+3300)*50;
    const eg=ctx.createLinearGradient(ex,ey,ex+rng(seed,i+3400)*3,ey+eh);
    eg.addColorStop(0,`rgba(195,190,182,${.07+rng(seed,i+3500)*.05})`);eg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=eg;ctx.fillRect(ex-2,ey,5,eh);
  }
  // Dark stains
  for(let i=0;i<7;i++){const sx=rng(seed,i+4000)*W,sy=rng(seed,i+4100)*H;const sgr=ctx.createRadialGradient(sx,sy,0,sx,sy,10+rng(seed,i+4200)*28);sgr.addColorStop(0,`rgba(4,4,7,${.16+rng(seed,i+4300)*.14})`);sgr.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=sgr;ctx.fillRect(0,0,W,H);}

  // Global AO — reduced so walls are more legible
  ctx.fillStyle='rgba(0,0,0,.38)';ctx.fillRect(0,0,W,H);
  // Top darkness (ceiling region)
  const tG=ctx.createLinearGradient(0,0,0,H*.48);tG.addColorStop(0,'rgba(0,0,0,.90)');tG.addColorStop(.28,'rgba(0,0,0,.62)');tG.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=tG;ctx.fillRect(0,0,W,H);
  // Bottom shadow
  const bG=ctx.createLinearGradient(0,H,0,H*.72);bG.addColorStop(0,'rgba(0,0,0,.45)');bG.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=bG;ctx.fillRect(0,0,W,H);
  // Edge shadows
  const eL=ctx.createLinearGradient(0,0,W*.30,0);eL.addColorStop(0,'rgba(0,0,0,.70)');eL.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=eL;ctx.fillRect(0,0,W,H);
  const eR=ctx.createLinearGradient(W,0,W*.70,0);eR.addColorStop(0,'rgba(0,0,0,.70)');eR.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=eR;ctx.fillRect(0,0,W,H);

  // Sconce light pool — key visual
  if(hasLight&&intensity>0){
    const lx=W*.5,ly=lightNY*H;
    const {lr,lg:llg,lb}=z;
    ctx.globalCompositeOperation='screen';
    // Wide pool
    const gr1=ctx.createRadialGradient(lx,ly,0,lx,ly,W*.52);
    gr1.addColorStop(0,  `rgba(${lr},${llg},${lb},${intensity*.92})`);
    gr1.addColorStop(.12,`rgba(${lr},${llg},${lb},${intensity*.72})`);
    gr1.addColorStop(.30,`rgba(${Math.round(lr*.7)},${Math.round(llg*.7)},${lb},${intensity*.38})`);
    gr1.addColorStop(.55,`rgba(${Math.round(lr*.3)},${Math.round(llg*.35)},${Math.round(lb*.6)},${intensity*.12})`);
    gr1.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=gr1;ctx.fillRect(0,0,W,H);
    // Hot spot
    const gr2=ctx.createRadialGradient(lx,ly,0,lx,ly,W*.10);
    gr2.addColorStop(0,'rgba(255,252,244,.95)');gr2.addColorStop(.38,'rgba(228,238,255,.52)');gr2.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=gr2;ctx.fillRect(0,0,W,H);
    // Downward spill
    const gr3=ctx.createLinearGradient(lx,ly+W*.04,lx,H);
    gr3.addColorStop(0,`rgba(${lr},${llg},${lb},${intensity*.11})`);gr3.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=gr3;ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation='source-over';
  }
  return new THREE.CanvasTexture(c);
}

function mkFloorTex(seed,hasLight,lxn,zone){
  const z=zone||ZONES[0];
  const [br,bg,bb]=z.base;
  const W=512,H=512,c=document.createElement('canvas');c.width=W;c.height=H;
  const ctx=c.getContext('2d');
  const fb=Math.round((br+bg+bb)/3*.55);
  ctx.fillStyle=`rgb(${fb},${fb},${fb})`;ctx.fillRect(0,0,W,H);
  // Flagstone
  ctx.strokeStyle='rgba(0,0,0,.52)';ctx.lineWidth=1.8;
  for(let x=0;x<W;x+=96)for(let y=0;y<H;y+=48){const o=(0|y/48%2)*48;ctx.strokeRect(x+o-96,y,96,48);}
  // Drain
  ctx.fillStyle='rgba(0,0,0,.76)';ctx.fillRect(W/2-2,0,4,H);
  for(let y=H/2-22;y<H/2+22;y+=5){ctx.fillStyle='rgba(0,0,0,.38)';ctx.fillRect(W/2-2,y,4,3);}
  // Cracks
  for(let i=0;i<5;i++){if(rng(seed,i+100)<.38)continue;ctx.beginPath();let fx=rng(seed,i+200)*W,fy=rng(seed,i+300)*H;ctx.moveTo(fx,fy);for(let s=0;s<5;s++){fx+=(rng(seed,i+s+400)-.5)*10;fy+=(rng(seed,i+s+500)-.5)*7;ctx.lineTo(fx,fy);}ctx.strokeStyle=`rgba(0,0,0,${.20+rng(seed,i+600)*.15})`;ctx.lineWidth=.5+rng(seed,i+700)*.35;ctx.stroke();}
  // Stains
  for(let i=0;i<9;i++){const px=rng(seed,i+800)*W,py=rng(seed,i+900)*H;const pgr=ctx.createRadialGradient(px,py,0,px,py,7+rng(seed,i+1000)*18);pgr.addColorStop(0,'rgba(0,0,0,.28)');pgr.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=pgr;ctx.fillRect(0,0,W,H);}
  ctx.fillStyle='rgba(0,0,0,.54)';ctx.fillRect(0,0,W,H);
  const eL=ctx.createLinearGradient(0,0,W*.26,0);eL.addColorStop(0,'rgba(0,0,0,.62)');eL.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=eL;ctx.fillRect(0,0,W,H);
  const eR=ctx.createLinearGradient(W,0,W*.74,0);eR.addColorStop(0,'rgba(0,0,0,.62)');eR.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=eR;ctx.fillRect(0,0,W,H);
  if(hasLight){
    const lx=(lxn||.5)*W,{lr,lg:llg,lb}=z;
    ctx.globalCompositeOperation='screen';
    const fgr=ctx.createRadialGradient(lx,H*.16,0,lx,H*.16,W*.40);
    fgr.addColorStop(0,`rgba(${Math.round(lr*.48)},${Math.round(llg*.52)},${Math.round(lb*.68)},.36)`);
    fgr.addColorStop(.40,`rgba(${Math.round(lr*.18)},${Math.round(llg*.22)},${Math.round(lb*.32)},.11)`);
    fgr.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=fgr;ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='source-over';
  }
  return new THREE.CanvasTexture(c);
}

function mkCeilTex(seed,zone){
  const z=zone||ZONES[0];const [br,bg,bb]=z.base;
  const W=256,H=256,c=document.createElement('canvas');c.width=W;c.height=H;
  const ctx=c.getContext('2d');
  const fb=Math.round((br+bg+bb)/3*.14);
  ctx.fillStyle=`rgb(${fb},${fb+1},${fb+1})`;ctx.fillRect(0,0,W,H);
  for(let x=0;x<W;x+=64){ctx.strokeStyle='rgba(0,0,0,.35)';ctx.lineWidth=.8;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let i=0;i<5;i++){const gx=rng(seed+500,i)*W,gy=rng(seed+500,i+10)*H;const gg=ctx.createRadialGradient(gx,gy,0,gx,gy,14+rng(seed+500,i+20)*18);gg.addColorStop(0,'rgba(0,0,0,.30)');gg.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=gg;ctx.fillRect(0,0,W,H);}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(2,2);return t;
}

// ═══════════════════════════════════════════════════════
// MATERIALS
// ═══════════════════════════════════════════════════════
const M_DARK =new THREE.MeshBasicMaterial({color:0x010203});
const M_RUBB =new THREE.MeshBasicMaterial({color:0x181e24});
const M_IRON =new THREE.MeshBasicMaterial({color:0x0e1418,metalness:.8});
const M_MOSS =new THREE.MeshBasicMaterial({color:0x0a1006});

const FLICKERS=[];

// ═══════════════════════════════════════════════════════
// REALISTIC SCONCE FIXTURE
// A proper wall-mounted light fixture with:
//   - Metal backplate bolted to wall
//   - Rectangular housing / shade
//   - Frosted glass panel (emissive)
//   - Realistic light pool projected on wall
// ═══════════════════════════════════════════════════════
function addSconce(g, wallX, y, z2, side, type, zoneI){
  const zi=zoneI||0;
  const zo=ZONES[zi%ZONES.length];

  // Backplate — flat metal rectangle on wall
  const plateMat=new THREE.MeshBasicMaterial({color:0x282e36});
  const plate=new THREE.Mesh(new THREE.BoxGeometry(.04,.18,.28),plateMat);
  plate.position.set(wallX+side*.02, y, z2);
  g.add(plate);

  // Bracket arm extending from wall
  const armMat=new THREE.MeshBasicMaterial({color:0x1e2430});
  const arm=new THREE.Mesh(new THREE.BoxGeometry(.04,.04,.18),armMat);
  arm.position.set(wallX+side*.10, y+.04, z2);
  g.add(arm);

  // Housing — rectangular shade
  const houseMat=new THREE.MeshBasicMaterial({color:0x242c38});
  // Top face
  const hTop=new THREE.Mesh(new THREE.BoxGeometry(.06,.02,.16),houseMat);
  hTop.position.set(wallX+side*.12, y+.10, z2); g.add(hTop);
  // Bottom face (angled slightly toward viewer)
  const hBot=new THREE.Mesh(new THREE.BoxGeometry(.06,.015,.16),houseMat);
  hBot.position.set(wallX+side*.12, y-.08, z2); g.add(hBot);
  // Side faces
  const hSideA=new THREE.Mesh(new THREE.BoxGeometry(.06,.18,.018),houseMat);
  hSideA.position.set(wallX+side*.12, y, z2+.08); g.add(hSideA);
  const hSideB=new THREE.Mesh(new THREE.BoxGeometry(.06,.18,.018),houseMat);
  hSideB.position.set(wallX+side*.12, y, z2-.08); g.add(hSideB);

  if(type==='off'){
    // Dead glass — dark and flat
    const deadGlass=new THREE.Mesh(new THREE.PlaneGeometry(.14,.16),
      new THREE.MeshBasicMaterial({color:0x101418,transparent:true,opacity:.55}));
    deadGlass.rotation.y=side>0?-Math.PI/2:Math.PI/2;
    deadGlass.position.set(wallX+side*.155, y, z2);
    g.add(deadGlass);
    return;
  }

  // Frosted glass front panel — the emissive surface
  const glassMat=new THREE.MeshBasicMaterial({
    color: type==='flicker'?0x90b8e8:0xa8cce8,
    transparent:true, opacity:.82, side:THREE.FrontSide
  });
  const glass=new THREE.Mesh(new THREE.PlaneGeometry(.14,.16),glassMat);
  glass.rotation.y=side>0?-Math.PI/2:Math.PI/2;
  glass.position.set(wallX+side*.155, y, z2);
  g.add(glass);

  // Inner bright element — visible through glass
  const elemMat=new THREE.MeshBasicMaterial({color:0xeef4ff});
  const elem=new THREE.Mesh(new THREE.PlaneGeometry(.08,.04),elemMat);
  elem.rotation.y=side>0?-Math.PI/2:Math.PI/2;
  elem.position.set(wallX+side*.148, y+.02, z2);
  g.add(elem);

  // Glow sprite — oval, matching fixture shape
  const glowTex=ZONE_GLOWS[zi%ZONE_GLOWS.length].close;
  const gmat=new THREE.SpriteMaterial({
    map:glowTex, transparent:true, opacity:.65,
    blending:THREE.AdditiveBlending, depthWrite:false
  });
  const gsp=new THREE.Sprite(gmat);
  gsp.scale.set(.55,.28,1); // wider than tall — matches rectangular fixture
  gsp.position.set(wallX+side*.16, y, z2);
  g.add(gsp);

  // Wide atmospheric halo — floor/ceiling spread
  const haloTex=ZONE_GLOWS[zi%ZONE_GLOWS.length].halo;
  const hmat=new THREE.SpriteMaterial({
    map:haloTex, transparent:true, opacity:.14,
    blending:THREE.AdditiveBlending, depthWrite:false
  });
  const halo=new THREE.Sprite(hmat);
  halo.scale.set(2.4,3.2,1); // tall halo — light spreading up and down wall
  halo.position.set(wallX+side*.16, y, z2);
  g.add(halo);

  if(type==='flicker'){
    FLICKERS.push({
      glassMat, elemMat, gmat, hmat,
      baseGlass:.82, baseGlow:.65, baseHalo:.14,
      phase:Math.random()*Math.PI*2,
      speed:3+Math.random()*9,
      mode:Math.random()<.5?'slow':'erratic'
    });
  }
}

// ═══════════════════════════════════════════════════════
// DERELICT DETAIL
// ═══════════════════════════════════════════════════════
function derelict(g,seed){
  // Floor grime
  for(let i=0;i<4;i++){
    if(rng(seed,i)<.44)continue;
    const gm=new THREE.Mesh(new THREE.PlaneGeometry(.16+rng(seed,i+1)*.52,.11+rng(seed,i+2)*.30),
      new THREE.MeshBasicMaterial({color:0x030406,transparent:true,opacity:.35+rng(seed,i+3)*.22}));
    gm.rotation.x=-Math.PI/2;gm.position.set((rng(seed,i+4)-.5)*(CW-.28),.002,-(rng(seed,i+5)*SEG));g.add(gm);
  }
  // Rust streaks
  for(const s of[-1,1]){
    if(rng(seed,s*3+100)<.42)continue;
    const sh=.45+rng(seed,s*3+101)*.95;
    const sm=new THREE.Mesh(new THREE.PlaneGeometry(.032+rng(seed,s+200)*.060,sh),
      new THREE.MeshBasicMaterial({color:0x1e0904,transparent:true,opacity:.28+rng(seed,s+201)*.20}));
    sm.rotation.y=s>0?-Math.PI/2:Math.PI/2;sm.position.set(s*CW/2+s*.003,sh/2,-(1.5+rng(seed,s+202)*(SEG-2)));g.add(sm);
  }
  // Hanging chain
  if(rng(seed,300)>.70){
    const s=rng(seed,301)>.5?1:-1;
    const ch=new THREE.Mesh(new THREE.CylinderGeometry(.006,.006,.28+rng(seed,302)*.50,5),M_IRON);
    ch.position.set(s*(CW/2-.14),2.2+rng(seed,303)*.85,-(2+rng(seed,304)*(SEG-4)));g.add(ch);
    const fx=new THREE.Mesh(new THREE.BoxGeometry(.050,.038,.050),new THREE.MeshBasicMaterial({color:0x260e04}));
    fx.position.set(ch.position.x,ch.position.y-.16,ch.position.z);g.add(fx);
  }
  // Moss base
  for(const s of[-1,1]){
    if(rng(seed,s*7+400)<.36)continue;
    const mh=.09+rng(seed,s*7+401)*.22;
    const mm=new THREE.Mesh(new THREE.PlaneGeometry(SEG,mh),M_MOSS);
    mm.rotation.y=s>0?-Math.PI/2:Math.PI/2;mm.position.set(s*CW/2+s*.003,mh/2,-SEG/2);g.add(mm);
  }
  // Rubble
  for(let i=0;i<(0|rng(seed,500)*3);i++){
    const sz=.028+rng(seed,i+501)*.065;
    const rb=new THREE.Mesh(new THREE.BoxGeometry(sz,sz*.5,sz*.95),M_RUBB||new THREE.MeshBasicMaterial({color:0x181e24}));
    rb.position.set((rng(seed,i+502)-.5)*(CW-.28),sz*.24,-(1+rng(seed,i+503)*(SEG-2)));
    rb.rotation.y=rng(seed,i+504)*Math.PI;g.add(rb);
  }
}

// PATH CURSOR
// Tracks world-space position and heading for segment chain

const cursor={pos:new THREE.Vector3(0,0,0),angle:0};
function cursorStep(len){
  cursor.pos.x-=Math.sin(cursor.angle)*(len||SEG);
  cursor.pos.z-=Math.cos(cursor.angle)*(len||SEG);
}

let SEED=1;const ns=()=>SEED+=17.3;
function sconf(y,i,t){return{y,i:i||.80,t:t||'on'};}

function buildShell(g,seed,scL,scR,zone,len){
  const L=len||SEG,z=zone||ZONES[0];
  const lLy=scL?(1-(scL.y/CH)):.35, lRy=scR?(1-(scR.y/CH)):.35;
  const lt=mkWallTex(seed,    lLy, scL&&scL.t!=='off', scL?scL.i:0, z);
  const rt=mkWallTex(seed+50, lRy, scR&&scR.t!=='off', scR?scR.i:0, z);
  const ft=mkFloorTex(seed+100, !!(scL||scR), .5, z);
  const ct=mkCeilTex(seed+150, z);
  const fl=new THREE.Mesh(new THREE.PlaneGeometry(CW,L),new THREE.MeshBasicMaterial({map:ft}));
  fl.rotation.x=-Math.PI/2;fl.position.set(0,0,-L/2);g.add(fl);
  const ce=new THREE.Mesh(new THREE.PlaneGeometry(CW,L),new THREE.MeshBasicMaterial({map:ct}));
  ce.rotation.x=Math.PI/2;ce.position.set(0,CH,-L/2);g.add(ce);
  const wL=new THREE.Mesh(new THREE.PlaneGeometry(L,CH),new THREE.MeshBasicMaterial({map:lt}));
  wL.rotation.y=Math.PI/2;wL.position.set(-CW/2,CH/2,-L/2);g.add(wL);
  const wR=new THREE.Mesh(new THREE.PlaneGeometry(L,CH),new THREE.MeshBasicMaterial({map:rt}));
  wR.rotation.y=-Math.PI/2;wR.position.set(CW/2,CH/2,-L/2);g.add(wR);
  // No back cap needed — LOOK_AHEAD=20 ensures next segment already exists there.
  // Fog at far=90 covers any theoretical gap.
}

// ═══════════════════════════════════════════════════════
// TURN SEGMENT
// ═══════════════════════════════════════════════════════
function buildTurn(g,seed,dir,zone){
  const z=zone||ZONES[0],S=CW;
  const ft=mkFloorTex(seed+100,false,.5,z),ct=mkCeilTex(seed+150,z);
  const wt=()=>mkWallTex(seed+Math.round(rng(seed,Math.random()*99)*80),.38,false,0,z);
  const fl=new THREE.Mesh(new THREE.PlaneGeometry(S*2,S*2),new THREE.MeshBasicMaterial({map:ft}));
  fl.rotation.x=-Math.PI/2;fl.position.set(-S*dir*.5,0,-S*.5);g.add(fl);
  const ce=new THREE.Mesh(new THREE.PlaneGeometry(S*2,S*2),new THREE.MeshBasicMaterial({map:ct}));
  ce.rotation.x=Math.PI/2;ce.position.set(-S*dir*.5,CH,-S*.5);g.add(ce);
  // Entry back
  const wb=new THREE.Mesh(new THREE.PlaneGeometry(CW,CH),M_DARK);wb.position.set(0,CH/2,.02);g.add(wb);
  if(dir===1){
    const wr=new THREE.Mesh(new THREE.PlaneGeometry(S,CH),new THREE.MeshBasicMaterial({map:wt()}));wr.rotation.y=-Math.PI/2;wr.position.set(CW/2,CH/2,-S*.5);g.add(wr);
    const wf=new THREE.Mesh(new THREE.PlaneGeometry(S,CH),new THREE.MeshBasicMaterial({map:wt()}));wf.position.set(-S*.5,CH/2,-S);g.add(wf);
  }else{
    const wl=new THREE.Mesh(new THREE.PlaneGeometry(S,CH),new THREE.MeshBasicMaterial({map:wt()}));wl.rotation.y=Math.PI/2;wl.position.set(-CW/2,CH/2,-S*.5);g.add(wl);
    const wf=new THREE.Mesh(new THREE.PlaneGeometry(S,CH),new THREE.MeshBasicMaterial({map:wt()}));wf.position.set(S*.5,CH/2,-S);g.add(wf);
  }
  const zi=ZONES.indexOf(zone)||0;
  addSconce(g,dir===1?CW/2:-CW/2,1.5,-S*.5,-dir,'flicker',zi);
}

function buildDeadEnd(g,seed,zone){
  const len=SEG*.5;buildShell(g,seed,null,null,zone,len);
  const tw=new THREE.Mesh(new THREE.PlaneGeometry(CW,CH),new THREE.MeshBasicMaterial({map:mkWallTex(seed+999,.5,false,0,zone)}));
  tw.rotation.y=Math.PI;tw.position.set(0,CH/2,-len+.02);g.add(tw);
  const zi=ZONES.indexOf(zone)||0;
  addSconce(g,0,1.5,-len+.20,1,'flicker',zi);
}

// ═══════════════════════════════════════════════════════
// SEGMENT VARIANTS
// ═══════════════════════════════════════════════════════
function vStd(z,zi){const g=new THREE.Group(),sd=ns();const L=sconf(1.5,.82),Rf=sconf(1.5,.76,'flicker');buildShell(g,sd,L,Rf,z);derelict(g,sd);addSconce(g,-CW/2,L.y,-SEG*.28,1,L.t,zi);addSconce(g,CW/2,Rf.y,-SEG*.72,-1,Rf.t,zi);return g;}
function vFlood(z,zi){const g=new THREE.Group(),sd=ns();const L=sconf(1.5,.74);buildShell(g,sd,L,null,z);derelict(g,sd);addSconce(g,-CW/2,L.y,-SEG*.5,1,L.t,zi);const w=new THREE.Mesh(new THREE.PlaneGeometry(CW-.04,SEG),M_WAT);w.rotation.x=-Math.PI/2;w.position.set(0,.08,-SEG/2);g.add(w);return g;}
function vCollapse(z,zi){const g=new THREE.Group(),sd=ns();buildShell(g,sd,null,null,z);derelict(g,sd);[[.34,.11,-SEG*.45],[-.22,.09,-SEG*.5],[.1,.14,-SEG*.55],[-.40,.07,-SEG*.42],[.48,.10,-SEG*.48]].forEach(([x,y,zp],i)=>{const sz=.08+(i%3)*.07;const rb=new THREE.Mesh(new THREE.BoxGeometry(sz,sz*.55,sz),new THREE.MeshBasicMaterial({color:0x181e24}));rb.position.set(x,y,zp);rb.rotation.y=i*.7;g.add(rb);});return g;}
function vSealL(z,zi){const g=new THREE.Group(),sd=ns();const Rf=sconf(1.5,.74);buildShell(g,sd,null,Rf,z);derelict(g,sd);addSconce(g,CW/2,Rf.y,-SEG*.5,-1,Rf.t,zi);const af=new THREE.Mesh(new THREE.BoxGeometry(.062,2.4,1.0),new THREE.MeshBasicMaterial({color:0x181e24}));af.position.set(-CW/2+.031,1.2,-SEG*.5);g.add(af);return g;}
function vSealR(z,zi){const g=new THREE.Group(),sd=ns();const Lf=sconf(1.5,.78,'flicker');buildShell(g,sd,Lf,null,z);derelict(g,sd);addSconce(g,-CW/2,Lf.y,-SEG*.5,1,Lf.t,zi);const af=new THREE.Mesh(new THREE.BoxGeometry(.062,2.4,1.0),new THREE.MeshBasicMaterial({color:0x181e24}));af.position.set(CW/2-.031,1.2,-SEG*.5);g.add(af);return g;}
function vPipes(z,zi){const g=new THREE.Group(),sd=ns();const Rf=sconf(1.5,.74);buildShell(g,sd,null,Rf,z);derelict(g,sd);addSconce(g,CW/2,Rf.y,-SEG*.4,-1,Rf.t,zi);[-.65,0,.72].forEach((px,i)=>{const p=new THREE.Mesh(new THREE.CylinderGeometry(.050,.050,SEG,8),M_PIPE);p.rotation.x=Math.PI/2;p.position.set(px,CH-.16-i*.10,-SEG/2);g.add(p);for(let bz=-2;bz>=-SEG+2;bz-=2.8){const br=new THREE.Mesh(new THREE.BoxGeometry(.030,.20,.030),M_IRON);br.position.set(px,CH-.34-i*.10,bz);g.add(br);}});return g;}
function vDark(z,zi){const g=new THREE.Group(),sd=ns();buildShell(g,sd,null,null,z);derelict(g,sd);addSconce(g,-CW/2,1.5,-SEG*.5,1,'off',zi);const sm=new THREE.Mesh(new THREE.SphereGeometry(.052,5,5),new THREE.MeshBasicMaterial({color:0x0e1418}));sm.position.set(-CW/2+.36,.048,-SEG*.53);g.add(sm);return g;}
function vWide(z,zi){
  const g=new THREE.Group(),sd=ns(),ex=1.4;
  const L2=sconf(1.5,.84),R2=sconf(1.5,.80);
  const lLy=1-(L2.y/CH),lRy=1-(R2.y/CH);
  const lt=mkWallTex(sd,lLy,true,.84,z),rt=mkWallTex(sd+50,lRy,true,.80,z);
  const ft=mkFloorTex(sd+100,true,.5,z),ct=mkCeilTex(sd+150,z);
  const fl=new THREE.Mesh(new THREE.PlaneGeometry(CW+ex*2,SEG),new THREE.MeshBasicMaterial({map:ft}));fl.rotation.x=-Math.PI/2;fl.position.set(0,0,-SEG/2);g.add(fl);
  const ce=new THREE.Mesh(new THREE.PlaneGeometry(CW+ex*2,SEG),new THREE.MeshBasicMaterial({map:ct}));ce.rotation.x=Math.PI/2;ce.position.set(0,CH,-SEG/2);g.add(ce);
  const wL=new THREE.Mesh(new THREE.PlaneGeometry(SEG,CH),new THREE.MeshBasicMaterial({map:lt}));wL.rotation.y=Math.PI/2;wL.position.set(-(CW/2+ex),CH/2,-SEG/2);g.add(wL);
  const wR=new THREE.Mesh(new THREE.PlaneGeometry(SEG,CH),new THREE.MeshBasicMaterial({map:rt}));wR.rotation.y=-Math.PI/2;wR.position.set(CW/2+ex,CH/2,-SEG/2);g.add(wR);
  derelict(g,sd);
  addSconce(g,-(CW/2+ex),L2.y,-SEG*.3,1,L2.t,zi);addSconce(g,(CW/2+ex),R2.y,-SEG*.3,-1,R2.t,zi);
  addSconce(g,-(CW/2+ex),L2.y,-SEG*.7,1,L2.t,zi);addSconce(g,(CW/2+ex),R2.y,-SEG*.7,-1,R2.t,zi);
  return g;
}

const STRAIGHTS=[vStd,vFlood,vCollapse,vSealL,vSealR,vPipes,vDark,vWide];
const SW=[5,2,1,1,1,1,1,2],SWOT=SW.reduce((a,b)=>a+b,0);
function pickStraight(z,zi){let r=Math.random()*SWOT;for(let i=0;i<STRAIGHTS.length;i++){r-=SW[i];if(r<=0)return STRAIGHTS[i](z,zi);}return vStd(z,zi);}

// ═══════════════════════════════════════════════════════
// CHAIN — the active corridor
// Key insight: chain stores segments in WORLD SPACE order.
// We always maintain LOOK_AHEAD segments AHEAD of the camera.
// Segments are removed from the BACK only when the camera
// has fully passed them. New segments always spawn at frontZ.
// ═══════════════════════════════════════════════════════
const chain=[];
let pathDistFront=0;  // total path distance built ahead
let pathDistCam=0;    // camera's progress along the path
let straightRun=0, nextTurnIn=3+Math.floor(Math.random()*4), segsSinceZone=0;

// ═══════════════════════════════════════════════════════
// SPAWN NEXT SEGMENT — always at frontier
// ═══════════════════════════════════════════════════════
function spawnSeg(){
  const zi=zoneIdx%ZONES.length, z=ZONES[zi];
  let g, isTurn=false, turnDir=0, segLen=SEG;

  segsSinceZone++;
  if(segsSinceZone>=8+Math.floor(Math.random()*5)) advanceZone();

  if(straightRun>=nextTurnIn){
    straightRun=0; nextTurnIn=3+Math.floor(Math.random()*4);
    if(Math.random()<.10){
      g=new THREE.Group(); buildDeadEnd(g,ns(),z); segLen=SEG*.5;
    } else {
      turnDir=Math.random()<.5?1:-1;
      g=new THREE.Group(); buildTurn(g,ns(),turnDir,z); isTurn=true;
    }
  } else {
    g=pickStraight(z,zi); straightRun++;
  }

  g.position.copy(cursor.pos);
  g.rotation.y=cursor.angle;
  scene.add(g);

  const entryPos=cursor.pos.clone();
  const entryAngle=cursor.angle;

  if(isTurn){
    cursor.pos.x-=Math.sin(cursor.angle)*CW;
    cursor.pos.z-=Math.cos(cursor.angle)*CW;
    cursor.angle+=turnDir*Math.PI/2;
  } else {
    cursorStep(segLen);
  }

  chain.push({g, entryPos, entryAngle, isTurn, turnDir, segLen, turned:false,
    pathStart: pathDistFront});
  pathDistFront += isTurn ? CW : segLen;
}

// ═══════════════════════════════════════════════════════
// DRIPS
// ═══════════════════════════════════════════════════════
const DRIPS=[];
for(let i=0;i<28;i++){
  const dm=new THREE.Mesh(new THREE.SphereGeometry(.010,4,4),
    new THREE.MeshBasicMaterial({color:0x14304a,transparent:true,opacity:.50}));
  dm.visible=false; scene.add(dm);
  // Elongate drip slightly
  dm.scale.y=1.6;
  const sp2=new THREE.Mesh(new THREE.RingGeometry(.006,.038,8),
    new THREE.MeshBasicMaterial({color:0x0e2638,transparent:true,opacity:0,side:THREE.DoubleSide}));
  sp2.rotation.x=-Math.PI/2; sp2.visible=false; scene.add(sp2);
  DRIPS.push({dm,sp:sp2,vy:0,x:0,z:0,sY:0,on:false,splash:false,st:0,timer:i*.28+Math.random()*2.2});
}
function resetDrip(d){
  d.x=(Math.random()-.5)*(CW-.5);
  d.z=cam.position.z-Math.random()*18;
  d.sY=CH*.25+Math.random()*CH*.40;
  d.dm.position.set(d.x,d.sY,d.z);
  d.vy=0; d.on=true; d.splash=false;
  d.dm.visible=true; d.sp.visible=false;
  d.timer=4+Math.random()*9;
}

// ═══════════════════════════════════════════════════════
// SKY WINDOW
// ═══════════════════════════════════════════════════════
let skyGrp=null, skyActive=false, skyT=0;
function buildSkyWin(){
  const g=new THREE.Group();
  const sc2=document.createElement('canvas');sc2.width=512;sc2.height=256;
  const sctx=sc2.getContext('2d'),stex=new THREE.CanvasTexture(sc2);
  function draw(t){
    const gr=sctx.createLinearGradient(0,0,0,256);gr.addColorStop(0,'#4890c8');gr.addColorStop(.44,'#78b6de');gr.addColorStop(1,'#b6d6ee');sctx.fillStyle=gr;sctx.fillRect(0,0,512,256);
    [{x:.12,y:.26,w:95,h:28,sp:.007},{x:.44,y:.17,w:148,h:40,sp:.005},{x:.76,y:.30,w:84,h:23,sp:.01}].forEach(cl=>{const cx=((cl.x+t*cl.sp)%1.14-.08)*512,cy=cl.y*256;sctx.fillStyle='rgba(255,255,255,.88)';sctx.beginPath();sctx.ellipse(cx,cy,cl.w,cl.h,0,0,Math.PI*2);sctx.fill();});
    const sg=sctx.createRadialGradient(400,34,0,400,34,82);sg.addColorStop(0,'rgba(255,250,195,.55)');sg.addColorStop(1,'rgba(255,250,195,0)');sctx.fillStyle=sg;sctx.fillRect(0,0,512,256);stex.needsUpdate=true;
  }
  const sp=new THREE.Mesh(new THREE.PlaneGeometry(CW-.56,3.5),new THREE.MeshBasicMaterial({map:stex}));sp.position.set(0,CH*.36+1.4,.01);g.userData.draw=draw;g.add(sp);
  const shm=new THREE.MeshBasicMaterial({color:0xffe8a0,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false});
  const sh=new THREE.Mesh(new THREE.PlaneGeometry(CW-.56,4.5),shm);sh.rotation.x=-Math.PI/2;sh.position.set(0,.006,-1.8);g.userData.shaft=shm;g.add(sh);
  g.visible=false;scene.add(g);return g;
}

// ═══════════════════════════════════════════════════════
// FOG & ZONE STATE
// ═══════════════════════════════════════════════════════
let targFog=new THREE.Color(ZONES[0].fog), curFog=new THREE.Color(ZONES[0].fog);

// ═══════════════════════════════════════════════════════
// AUTO-TURN
// ═══════════════════════════════════════════════════════
let autoTurnTo=0, autoTurnProg=0, autoTurning=false;

// ═══════════════════════════════════════════════════════
// INPUT
// ═══════════════════════════════════════════════════════
const K={};
document.addEventListener('keydown',e=>{K[e.key]=true;triggerAudio();});
document.addEventListener('keyup',e=>K[e.key]=false);
let yaw=0, pitch=0, camAngle=0, locked=false;
canvas.addEventListener('click',()=>{triggerAudio();canvas.requestPointerLock();});
document.addEventListener('pointerlockchange',()=>locked=document.pointerLockElement===canvas);
document.addEventListener('mousemove',e=>{if(!locked)return;yaw-=e.movementX*.0018;pitch-=e.movementY*.0018;pitch=Math.max(-.75,Math.min(.75,pitch));yaw=Math.max(-.55,Math.min(.55,yaw));});
let mf=false,ml=false,mr=false,ltid=null,lsy=0,lsp=0,lsx=0,lsyw=0;
document.getElementById('bf').addEventListener('touchstart',e=>{e.preventDefault();triggerAudio();mf=true;},{passive:false});
document.getElementById('bf').addEventListener('touchend',()=>mf=false);
document.getElementById('bl').addEventListener('touchstart',e=>{e.preventDefault();triggerAudio();ml=true;},{passive:false});
document.getElementById('bl').addEventListener('touchend',()=>ml=false);
document.getElementById('br').addEventListener('touchstart',e=>{e.preventDefault();triggerAudio();mr=true;},{passive:false});
document.getElementById('br').addEventListener('touchend',()=>mr=false);
const lz=document.getElementById('look');
lz.addEventListener('touchstart',e=>{e.preventDefault();triggerAudio();const t=e.changedTouches[0];ltid=t.identifier;lsy=t.clientY;lsp=pitch;lsx=t.clientX;lsyw=yaw;},{passive:false});
lz.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches){if(t.identifier!==ltid)continue;pitch=lsp-(t.clientY-lsy)*.0038;yaw=lsyw-(t.clientX-lsx)*.0038;pitch=Math.max(-.75,Math.min(.75,pitch));yaw=Math.max(-.55,Math.min(.55,yaw));}},{passive:false});
lz.addEventListener('touchend',()=>ltid=null);

// ═══════════════════════════════════════════════════════
// MESSAGES
// ═══════════════════════════════════════════════════════
const MSGS=["there is no end to this","you have always been here","the dark is not empty","all passages lead inward","you are the only warmth","before the first light — this","walk until you remember","the walls know your name","silence is the oldest language","depth is not a direction","something walks beside you","you began walking long ago","the dark precedes everything","to descend is to return","you have not been forgotten","the ceiling has no end","you are expected","keep walking","this has no exit","you were here before you arrived","the air remembers your name","nothing above has light","something drips, far below","the dark is not afraid of you","it goes deeper than you know"];
const msgEl=document.getElementById('msg');
let totalDist=0,lastMsgAt=0,mIdx=0|Math.random()*MSGS.length,mTimer=null;
function showMsg(){msgEl.textContent=MSGS[mIdx++%MSGS.length];msgEl.classList.add('show');if(mTimer)clearTimeout(mTimer);mTimer=setTimeout(()=>msgEl.classList.remove('show'),5500);}

// ═══════════════════════════════════════════════════════
// INIT — build pool then start
// ═══════════════════════════════════════════════════════
// Build LOOK_AHEAD segments before camera starts moving
for(let i=0;i<LOOK_AHEAD;i++) spawnSeg();
skyGrp=buildSkyWin();

// Fade in
const fadeEl=document.getElementById('fade');
setTimeout(()=>fadeEl.classList.add('clear'),120);

// ═══════════════════════════════════════════════════════
// MAIN LOOP
// ═══════════════════════════════════════════════════════
const WALK=2.4,CRAWL=.18,TURN_SPD=.65;
let bobT=0,totT=0,resetting=false;
const CLK=new THREE.Clock();
const lerp=(a,b,t)=>a+(b-a)*t;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const sss=(a,b,t)=>{t=clamp((t-a)/(b-a),0,1);return t*t*(3-2*t);};

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(CLK.getDelta(),.05);totT+=dt;

  const st=songTime();
  let brt=0;
  if(st>=T_TRANS&&st<T_DIRECT)brt=sss(T_TRANS,T_DIRECT,st);
  else if(st>=T_DIRECT&&st<T_RESET)brt=1;

  scene.fog.near=lerp(30,46,brt);scene.fog.far=lerp(90,120,brt);
  curFog.lerp(targFog,dt*.32);
  scene.fog.color.lerpColors(curFog,new THREE.Color(0xb8ccd8),brt*.68);
  scene.background.copy(scene.fog.color);

  if(st>=T_WIN&&!resetting){
    if(!skyActive){skyActive=true;skyGrp.visible=true;const dx=Math.sin(camAngle),dz=Math.cos(camAngle);skyGrp.position.set(cam.position.x-dx*28,cam.position.y,cam.position.z-dz*28);skyGrp.rotation.y=camAngle;}
    skyT+=dt;if(skyGrp.userData.draw)skyGrp.userData.draw(skyT);
    if(skyGrp.userData.shaft)skyGrp.userData.shaft.opacity=sss(T_WIN,T_DIRECT,st)*.13;
  }

  if(st>=T_RESET&&!resetting){
    resetting=true;fadeEl.classList.remove('clear');
    setTimeout(()=>{skyActive=false;skyGrp.visible=false;zoneIdx=0;segsSinceZone=0;targFog.setHex(ZONES[0].fog);curFog.copy(targFog);startMain();setTimeout(()=>{fadeEl.classList.add('clear');resetting=false;},2600);},2500);
  }

  const mv=K.w||K.W||K.ArrowUp||mf;
  if(!resetting){
    if(K.a||K.A||K.ArrowLeft||ml)  yaw+=TURN_SPD*dt;
    if(K.d||K.D||K.ArrowRight||mr) yaw-=TURN_SPD*dt;
    yaw*=.967;yaw=clamp(yaw,-.55,.55);

    if(autoTurning){autoTurnProg+=dt*1.6;if(autoTurnProg>=1){autoTurnProg=1;autoTurning=false;}camAngle=lerp(camAngle,autoTurnTo,sss(0,1,autoTurnProg));}

    const spd=mv?WALK:CRAWL;
    totalDist+=spd*dt;
    cam.position.x-=Math.sin(camAngle)*spd*dt;
    cam.position.z-=Math.cos(camAngle)*spd*dt;
    bobT+=dt*(mv?2.9:.76);
    cam.position.y=1.7+Math.sin(bobT)*(mv?.040:.008);
    if(mv)doStep();
  }

  cam.rotation.order='YXZ';
  cam.rotation.y=camAngle+yaw;
  cam.rotation.x=pitch+Math.sin(bobT*.62)*.004;

  // Auto-turn detection
  if(!autoTurning){
    for(const seg of chain){
      if(!seg.isTurn||seg.turned)continue;
      const dx=cam.position.x-seg.entryPos.x,dz=cam.position.z-seg.entryPos.z;
      if(Math.sqrt(dx*dx+dz*dz)<CW*.62){seg.turned=true;autoTurnTo=seg.entryAngle+seg.turnDir*Math.PI/2;autoTurning=true;autoTurnProg=0;yaw*=.22;}
    }
  }

  // ─── CHAIN MANAGEMENT ─────────────────────────────────
  // Advance camera path distance based on actual movement
  pathDistCam += (mv ? WALK : CRAWL) * dt;

  // Remove segments whose exit is more than 2 segments behind camera
  while(chain.length > 2) {
    const old = chain[0];
    const oldExit = old.pathStart + (old.isTurn ? CW : old.segLen);
    if(pathDistCam > oldExit + SEG * 2) {
      scene.remove(old.g);
      chain.shift();
      spawnSeg();
    } else break;
  }

  // Maintain lookahead — always build LOOK_AHEAD segments beyond camera
  const targetFront = pathDistCam + LOOK_AHEAD * SEG;
  while(pathDistFront < targetFront) spawnSeg();

  // Flicker
  FLICKERS.forEach(f=>{
    let v;
    if(f.mode==='slow'){v=.72+Math.sin(totT*f.speed+f.phase)*.28+Math.sin(totT*f.speed*.38+f.phase)*.14;v=Math.max(.06,v);}
    else{const s2=Math.random()<.07?Math.random()<.5?0:.08:1;v=(.62+Math.sin(totT*f.speed+f.phase)*.38)*s2;v=Math.max(0,v);}
    if(f.glassMat){f.glassMat.opacity=f.baseGlass*v;}
    if(f.elemMat){f.elemMat.color.setScalar(.12+v*.88);}
    if(f.gmat){f.gmat.opacity=f.baseGlow*v;}
    if(f.hmat){f.hmat.opacity=f.baseHalo*v;}
  });

  // Drips
  DRIPS.forEach(d=>{
    if(!d.on){d.timer-=dt;if(d.timer<=0)resetDrip(d);return;}
    if(d.splash){
      d.st+=dt;d.sp.material.opacity=Math.max(0,.32*(1-d.st/.40));d.sp.scale.setScalar(1+d.st*9);
      if(d.st>.40){d.dm.visible=false;d.sp.visible=false;d.on=false;d.timer=3+Math.random()*9;}return;
    }
    d.vy-=9.6*dt;d.dm.position.y+=d.vy*dt;
    if(d.dm.position.y<=.014){
      d.splash=true;d.st=0;d.dm.visible=false;
      d.sp.position.set(d.x,.004,d.z);d.sp.visible=true;d.sp.material.opacity=.32;d.sp.scale.setScalar(1);doDrip();
    }
  });

  if(totalDist>lastMsgAt+22+Math.random()*14){lastMsgAt=totalDist;showMsg();}
  R.render(scene,cam);
}

window.addEventListener('resize',()=>{cam.aspect=window.innerWidth/window.innerHeight;cam.updateProjectionMatrix();R.setSize(window.innerWidth,window.innerHeight);});
animate();
</script>
</body>
