<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Darkwander</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none;}
body{background:#000;overflow:hidden;width:100vw;height:100vh;cursor:none;}
canvas{display:block;touch-action:none;}
#ui{position:fixed;inset:0;pointer-events:none;z-index:10;}
#vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 30%,rgba(0,0,0,0.22) 62%,rgba(0,0,0,0.78) 100%);}
#grain{position:absolute;inset:0;opacity:0.028;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:256px 256px;animation:gs 0.12s steps(1) infinite;}
@keyframes gs{0%{background-position:0 0}25%{background-position:-64px -32px}50%{background-position:32px -64px}75%{background-position:-32px 64px}100%{background-position:64px 32px}}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity 2.5s ease;z-index:5;}
#fade.on{opacity:1;}
#msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:rgba(160,175,190,0);font-family:'Palatino Linotype',Palatino,serif;font-size:clamp(11px,1.8vw,16px);letter-spacing:0.45em;text-transform:uppercase;text-align:center;pointer-events:none;transition:color 2.5s ease-in-out;max-width:55vw;line-height:2;z-index:6;}
#msg.show{color:rgba(160,175,185,0.5);}
#start{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;transition:opacity 2.5s ease;cursor:pointer;}
#start h1{font-family:'Palatino Linotype',Palatino,serif;font-size:clamp(22px,5vw,50px);font-weight:400;color:rgba(160,180,200,0.85);letter-spacing:0.55em;text-transform:uppercase;text-align:center;margin-bottom:22px;text-shadow:0 0 60px rgba(100,140,180,0.35);animation:breathe 5s ease-in-out infinite;}
#start p{font-family:'Palatino Linotype',serif;font-size:clamp(9px,1.4vw,12px);color:rgba(100,120,140,0.45);letter-spacing:0.4em;text-transform:uppercase;animation:breathe 5s ease-in-out infinite reverse;}
@keyframes breathe{0%,100%{opacity:0.5}50%{opacity:1}}
#start.out{opacity:0;pointer-events:none;}
#ctrl{display:none;position:fixed;inset:0;z-index:20;pointer-events:none;}
#move{position:absolute;bottom:0;left:0;width:50%;height:220px;pointer-events:all;touch-action:none;}
#look{position:absolute;bottom:0;right:0;width:50%;height:100%;pointer-events:all;touch-action:none;}
.btn{position:absolute;border-radius:50%;border:1px solid rgba(140,165,190,0.15);background:rgba(0,0,0,0.32);display:flex;align-items:center;justify-content:center;pointer-events:all;touch-action:none;color:rgba(140,165,190,0.32);font-size:18px;font-family:serif;}
#bf{width:72px;height:72px;bottom:80px;left:50%;transform:translateX(-50%);}
#bl{width:54px;height:54px;bottom:90px;left:calc(50% - 90px);}
#br{width:54px;height:54px;bottom:90px;left:calc(50% + 36px);}
#lh{position:absolute;top:16px;right:16px;color:rgba(100,120,140,0.22);font-family:'Palatino Linotype',serif;font-size:9px;letter-spacing:0.3em;text-transform:uppercase;pointer-events:none;}
@media(max-width:900px){#ctrl{display:block;}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="vignette"></div>
  <div id="grain"></div>
  <div id="fade"></div>
  <div id="msg"></div>
</div>
<div id="start"><h1>The Darkwander</h1><p>touch to enter</p></div>
<div id="ctrl">
  <div id="move">
    <div class="btn" id="bf">↑</div>
    <div class="btn" id="bl">←</div>
    <div class="btn" id="br">→</div>
  </div>
  <div id="look"></div>
  <div id="lh">drag to look</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';

// ── Song timing (seconds) ──────────────────────────────────
const T_TOTAL  = 2300; // 38:20
const T_TRANS  = 1820; // 30:20 transition begins
const T_SUN    = 2120; // 35:20 near-max brightness
const T_WIN    = 2210; // 36:50 window appears
const T_DIRECT = 2230; // 37:10 max brightness
const T_RESET  = 2300; // 38:20 restart

// ── Audio ──────────────────────────────────────────────────
let AC=null, bufs={}, mainStart=0, mainSrc=null, ambiSrc=null, lastStep=0;
async function loadBuf(k,p){try{const r=await fetch(p);if(!r.ok)return;bufs[k]=await AC.decodeAudioData(await r.arrayBuffer());}catch(e){}}
function shot(k,vol=1,pv=0.05){if(!AC||!bufs[k])return;const s=AC.createBufferSource();s.buffer=bufs[k];s.playbackRate.value=1+(Math.random()-.5)*pv;const g=AC.createGain();g.gain.value=vol;s.connect(g);g.connect(AC.destination);s.start();}
function drip(){const k=['drip','drip2','drip3'][Math.floor(Math.random()*3)];shot(k,0.28+Math.random()*0.35,0.12);}
async function initAudio(){
  if(AC)return; AC=new(window.AudioContext||window.webkitAudioContext)();
  await Promise.all(['footstep','drip','drip2','drip3','ambience','main'].map(k=>loadBuf(k,k==='main'?'audio/nightmareflesh.mp3':`audio/${k==='footstep'?'footstep':k}.wav`)));
  if(bufs.ambience){ambiSrc=AC.createBufferSource();ambiSrc.buffer=bufs.ambience;ambiSrc.loop=true;const g=AC.createGain();g.gain.value=0.38;ambiSrc.connect(g);g.connect(AC.destination);ambiSrc.start();}
  startMain();
}
function startMain(){if(!AC||!bufs.main)return;if(mainSrc){try{mainSrc.stop();}catch(e){}}mainSrc=AC.createBufferSource();mainSrc.buffer=bufs.main;const g=AC.createGain();g.gain.value=0.82;mainSrc.connect(g);g.connect(AC.destination);mainSrc.start();mainStart=AC.currentTime;}
function songTime(){return AC?Math.min(AC.currentTime-mainStart,T_TOTAL):0;}

// ── Renderer ───────────────────────────────────────────────
const canvas=document.getElementById('c');
const R=new THREE.WebGLRenderer({canvas,antialias:false}); // antialias off = faster mobile
R.setPixelRatio(Math.min(window.devicePixelRatio,1.5));
R.setSize(window.innerWidth,window.innerHeight);
R.shadowMap.enabled=false;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x04080f);
scene.fog=new THREE.Fog(0x04080f,16,52);

const cam=new THREE.PerspectiveCamera(70,window.innerWidth/window.innerHeight,0.1,70);
// Camera at eye level. Corridor floor at Y=0, ceiling at Y=CH.
// Camera Y = eye height above floor.
cam.position.set(0,1.7,0);

// ── Dimensions ────────────────────────────────────────────
// Simple, clean values. Floor at Y=0, ceiling at Y=CH.
// Camera walks at Y=1.7 (eye height).
const CW=4.0,  // corridor width
      CH=18.0, // ceiling height
      SEG=12,  // segment depth
      POOL=10;

// ── Textures ──────────────────────────────────────────────
const TL=new THREE.TextureLoader();
const TX={};

function loadTex(k,url,fb){
  TX[k]=fb(); // immediate fallback
  TL.load(url,t=>{t.wrapS=t.wrapT=THREE.RepeatWrapping;TX[k]=t;refreshMats();},null,()=>{});
}

function mkConc(seed){
  const S=256,c=document.createElement('canvas');c.width=c.height=S;
  const ctx=c.getContext('2d');
  ctx.fillStyle='#1a1e22';ctx.fillRect(0,0,S,S);
  const rng=n=>Math.sin(seed*127+n*311)*0.5+0.5;
  for(let y=0;y<S;y+=40+rng(y)*20){const l=18+rng(y+100)*8|0;ctx.fillStyle=`rgb(${l},${l},${l+1})`;ctx.fillRect(0,y,S,1);}
  for(let i=0;i<5;i++){ctx.beginPath();let cx=rng(i+10)*S,cy=0;ctx.moveTo(cx,0);for(let s=0;s<12;s++){cx+=(rng(i+s+20)-.5)*4;cy+=rng(i+s+21)*22;ctx.lineTo(cx,cy);}ctx.strokeStyle=`rgba(5,5,7,${0.3+rng(i+50)*0.4})`;ctx.lineWidth=0.6;ctx.stroke();}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;
}
function mkFloor(){
  const S=256,c=document.createElement('canvas');c.width=c.height=S;
  const ctx=c.getContext('2d');ctx.fillStyle='#141618';ctx.fillRect(0,0,S,S);
  ctx.strokeStyle='rgba(5,5,7,0.9)';ctx.lineWidth=1.5;
  for(let x=0;x<S;x+=64)for(let y=0;y<S;y+=32){const o=(Math.floor(y/32)%2)*32;ctx.strokeRect(x+o-64,y,64,32);}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;
}
function mkEarth(){
  const S=256,c=document.createElement('canvas');c.width=c.height=S;
  const ctx=c.getContext('2d');ctx.fillStyle='#2e2416';ctx.fillRect(0,0,S,S);
  for(let i=0;i<150;i++){const x=Math.random()*S,y=Math.random()*S,l=40+Math.random()*30|0;ctx.beginPath();ctx.arc(x,y,1+Math.random()*5,0,Math.PI*2);ctx.fillStyle=`rgba(${l+8},${l},${l-8},0.4)`;ctx.fill();}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;
}
function mkMoss(){
  const S=256,c=document.createElement('canvas');c.width=c.height=S;
  const ctx=c.getContext('2d');ctx.fillStyle='#1e2816';ctx.fillRect(0,0,S,S);
  for(let i=0;i<200;i++){const x=Math.random()*S,y=Math.random()*S,g=25+Math.random()*35|0;ctx.beginPath();ctx.arc(x,y,1+Math.random()*3,0,Math.PI*2);ctx.fillStyle=`rgba(${g-8},${g+10},${g-12},0.45)`;ctx.fill();}
  const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;return t;
}

loadTex('dw','textures/dark/wall.jpg',   ()=>mkConc(1.0));
loadTex('df','textures/dark/floor.jpg',  ()=>mkFloor());
loadTex('dc','textures/dark/ceiling.jpg',()=>mkConc(4.7));
loadTex('lw','textures/light/wall.jpg',  ()=>mkMoss());
loadTex('lf','textures/light/floor.jpg', ()=>mkEarth());
loadTex('lc','textures/light/ceiling.jpg',()=>mkMoss());

// ── Materials (all BasicMaterial — no lighting needed) ────
// Colors are set directly; texture tints on top.
// This renders correctly on ALL devices including low-end mobile WebGL.
let blend=0;

const M={
  wall: new THREE.MeshBasicMaterial({color:0x607080}),
  fl:   new THREE.MeshBasicMaterial({color:0x40505e}),
  ceil: new THREE.MeshBasicMaterial({color:0x080c10}),
  dark: new THREE.MeshBasicMaterial({color:0x010204}),
  rubb: new THREE.MeshBasicMaterial({color:0x2a3035}),
  iron: new THREE.MeshBasicMaterial({color:0x1c2228}),
  scon: new THREE.MeshBasicMaterial({color:0x222c34}),
  rust: new THREE.MeshBasicMaterial({color:0x341c0c}),
  moss: new THREE.MeshBasicMaterial({color:0x101810}),
  pipe: new THREE.MeshBasicMaterial({color:0x384048}),
  wat:  new THREE.MeshBasicMaterial({color:0x10181e,transparent:true,opacity:0.72}),
  gdead:new THREE.MeshBasicMaterial({color:0x1c2430,transparent:true,opacity:0.5}),
  glass:new THREE.MeshBasicMaterial({color:0x88b8d8,transparent:true,opacity:0.3}),
};

function refreshMats(){
  const t=blend;
  const wm=t<0.5?TX.dw:TX.lw, fm=t<0.5?TX.df:TX.lf, cm=t<0.5?TX.dc:TX.lc;
  // Wall repeat: fits concrete texture at reasonable scale
  if(wm){wm.repeat.set(1,CH/CW*0.6);}
  if(fm){fm.repeat.set(2,SEG/3);}
  M.wall.map=wm||null; M.wall.needsUpdate=true;
  M.fl.map=fm||null;   M.fl.needsUpdate=true;
  M.ceil.map=cm||null; M.ceil.needsUpdate=true;
  // Color lerp dark→light
  const brt=1+blend*1.4;
  M.wall.color.setRGB(Math.min(1,0.38*brt),Math.min(1,0.44*brt),Math.min(1,0.50*brt));
  M.fl.color.setRGB(  Math.min(1,0.25*brt),Math.min(1,0.31*brt),Math.min(1,0.37*brt));
  M.ceil.color.setRGB(Math.min(1,0.04*brt),Math.min(1,0.05*brt),Math.min(1,0.07*brt));
}
refreshMats();

// ── Hue palettes ──────────────────────────────────────────
const PALS=[
  {fog:new THREE.Color(0x04080f),bg:new THREE.Color(0x04080f)},
  {fog:new THREE.Color(0x08060e),bg:new THREE.Color(0x08060e)},
  {fog:new THREE.Color(0x050c07),bg:new THREE.Color(0x050c07)},
  {fog:new THREE.Color(0x0c0804),bg:new THREE.Color(0x0c0804)},
  {fog:new THREE.Color(0x06060e),bg:new THREE.Color(0x06060e)},
];
let palIdx=0,targFog=new THREE.Color().copy(PALS[0].fog),curFog=new THREE.Color().copy(PALS[0].fog);

// ── Flicker registry ──────────────────────────────────────
const flickers=[];

// ── Sconce columns ────────────────────────────────────────
const ROWS=[
  {y:1.5, p:1.0, s:1.0},
  {y:3.8, p:0.65,s:0.75},
  {y:6.5, p:0.4, s:0.55},
  {y:9.8, p:0.22,s:0.38},
  {y:13.2,p:0.11,s:0.24},
  {y:16.5,p:0.05,s:0.14},
];

function sconceT(){const r=Math.random();return r<0.52?'on':r<0.76?'flicker':'off';}

function addSconces(grp,wx,z,side){
  ROWS.forEach(row=>{
    if(Math.random()>row.p)return;
    const tp=sconceT(), sc=row.s, y=row.y;

    // Bracket
    const arm=new THREE.Mesh(new THREE.BoxGeometry(0.06*sc,0.06*sc,0.2*sc),M.scon);
    arm.position.set(wx+side*0.07*sc,y,z);grp.add(arm);

    // Globe
    const gm=tp==='off'?M.gdead:M.glass;
    const globe=new THREE.Mesh(new THREE.SphereGeometry(0.085*sc,7,7),gm);
    globe.position.set(wx+side*0.15*sc,y,z);grp.add(globe);

    if(tp==='off'){
      // Dead shard
      const sh=new THREE.Mesh(new THREE.SphereGeometry(0.035*sc,4,4),M.rust);
      sh.position.set(wx+side*0.17*sc,y-0.025*sc,z);grp.add(sh);
      return;
    }

    // Bright core dot
    const core=new THREE.Mesh(new THREE.SphereGeometry(0.032*sc,5,5),
      new THREE.MeshBasicMaterial({color:0xe8f4ff}));
    core.position.set(wx+side*0.15*sc,y,z);grp.add(core);

    // Glow sprite — small, additive, atmospheric only
    // Size is in world units. At sc=1 (lowest row) glow radius = 0.55 world units.
    // This is visible but NOT overwhelming — sconces should be small points of light.
    const gsz=0.55*sc*(row.y<3?1.8:1.0);
    const gmat=new THREE.SpriteMaterial({
      color:0x88bbee,transparent:true,
      opacity:tp==='flicker'?0.5:0.58,
      blending:THREE.AdditiveBlending,depthWrite:false
    });
    const gsp=new THREE.Sprite(gmat);
    gsp.scale.set(gsz,gsz,1);
    gsp.position.set(wx+side*0.15*sc,y,z);
    grp.add(gsp);

    // Soft halo — only on lowest two rows
    if(row.y<4.5){
      const hm=new THREE.SpriteMaterial({
        color:0x3366aa,transparent:true,opacity:0.12,
        blending:THREE.AdditiveBlending,depthWrite:false
      });
      const hs=new THREE.Sprite(hm);
      hs.scale.set(gsz*2.8,gsz*2.8,1);
      hs.position.set(wx+side*0.15*sc,y,z);
      grp.add(hs);
    }

    if(tp==='flicker'){
      flickers.push({gmat,core,base:gmat.opacity,
        phase:Math.random()*Math.PI*2,
        speed:3+Math.random()*8,
        mode:Math.random()<0.5?'slow':'erratic'});
    }
  });
}

// ── Segment shell ─────────────────────────────────────────
// Floor at Y=0, ceiling at Y=CH. No FL offset needed now.
function shell(g,len,mat){
  const L=len||SEG,m=mat||M.wall;
  // Floor
  const fl=new THREE.Mesh(new THREE.PlaneGeometry(CW,L),M.fl);
  fl.rotation.x=-Math.PI/2;fl.position.set(0,0,-L/2);g.add(fl);
  // Ceiling
  const ce=new THREE.Mesh(new THREE.PlaneGeometry(CW,L),M.ceil);
  ce.rotation.x=Math.PI/2;ce.position.set(0,CH,-L/2);g.add(ce);
  // Left wall
  const wL=new THREE.Mesh(new THREE.PlaneGeometry(L,CH),m);
  wL.rotation.y=Math.PI/2;wL.position.set(-CW/2,CH/2,-L/2);g.add(wL);
  // Right wall
  const wR=new THREE.Mesh(new THREE.PlaneGeometry(L,CH),m.clone());
  wR.rotation.y=-Math.PI/2;wR.position.set(CW/2,CH/2,-L/2);g.add(wR);
  // Back cap — prevents seeing void
  const bk=new THREE.Mesh(new THREE.PlaneGeometry(CW,CH),M.dark);
  bk.position.set(0,CH/2,-L);g.add(bk);
  // Front cap — closes the near end (prevents seeing outside segment)
  const fr=new THREE.Mesh(new THREE.PlaneGeometry(CW,CH),M.dark);
  fr.rotation.y=Math.PI;fr.position.set(0,CH/2,0.02);g.add(fr);
}

// ── Derelict details ──────────────────────────────────────
function derelict(g,seed){
  const rng=n=>Math.sin(seed*91.3+n*177.7)*0.5+0.5;
  // Floor grime patches
  for(let i=0;i<3;i++){
    if(rng(i)<0.4)continue;
    const gm=new THREE.Mesh(new THREE.PlaneGeometry(0.3+rng(i+1)*0.7,0.25+rng(i+2)*0.5),
      new THREE.MeshBasicMaterial({color:0x07090b,transparent:true,opacity:0.5+rng(i+3)*0.3}));
    gm.rotation.x=-Math.PI/2;gm.position.set((rng(i+4)-.5)*(CW-.5),0.002,-rng(i+5)*SEG);g.add(gm);
  }
  // Rust streaks on lower wall
  for(const s of[-1,1]){
    if(rng(seed+s*3)<0.35)continue;
    const sh=0.9+rng(seed+s)*1.6;
    const sm=new THREE.Mesh(new THREE.PlaneGeometry(0.06+rng(seed+s+1)*0.12,sh),
      new THREE.MeshBasicMaterial({color:0x2e1508,transparent:true,opacity:0.45+rng(seed+s+2)*0.3}));
    sm.rotation.y=s>0?-Math.PI/2:Math.PI/2;
    sm.position.set(s*CW/2+s*0.005,sh/2,-(1.5+rng(seed+s+3)*(SEG-2)));g.add(sm);
  }
  // Hanging chain
  if(rng(seed+10)>0.65){
    const s=rng(seed+11)>0.5?1:-1;
    const ch=new THREE.Mesh(new THREE.CylinderGeometry(.009,.009,0.5+rng(seed+12)*1,5),M.iron);
    ch.position.set(s*(CW/2-.2),3.2+rng(seed+13)*1.5,-(2.5+rng(seed+14)*(SEG-4)));g.add(ch);
    const fx=new THREE.Mesh(new THREE.BoxGeometry(.09,.06,.09),M.rust);
    fx.position.set(ch.position.x,ch.position.y-.3,ch.position.z);g.add(fx);
  }
  // Moss base
  for(const s of[-1,1]){
    if(rng(seed+s*7)<0.3)continue;
    const mh=0.22+rng(seed+s*7+1)*0.4;
    const mm=new THREE.Mesh(new THREE.PlaneGeometry(SEG,mh),M.moss);
    mm.rotation.y=s>0?-Math.PI/2:Math.PI/2;mm.position.set(s*CW/2+s*.003,mh/2,-SEG/2);g.add(mm);
  }
  // Small rubble
  for(let i=0;i<Math.floor(rng(seed+20)*4);i++){
    const sz=.04+rng(seed+20+i)*.1;
    const rb=new THREE.Mesh(new THREE.BoxGeometry(sz,sz*.6,sz*1.1),M.rubb);
    rb.position.set((rng(seed+30+i)-.5)*(CW-.4),sz*.3,-(1+rng(seed+31+i)*(SEG-2)));
    rb.rotation.y=rng(seed+32+i)*Math.PI;g.add(rb);
  }
}

// ── Ten segment variants ──────────────────────────────────
let SS=0;const ns=()=>SS+=13.7;

function sStandard(){
  const g=new THREE.Group(),s=ns();shell(g);derelict(g,s);
  addSconces(g,-CW/2,-SEG*.28,1);addSconces(g,CW/2,-SEG*.72,-1);return g;
}
function sFlooded(){
  const g=new THREE.Group(),s=ns();shell(g);derelict(g,s);
  const w=new THREE.Mesh(new THREE.PlaneGeometry(CW-.05,SEG),M.wat);
  w.rotation.x=-Math.PI/2;w.position.set(0,0.07,-SEG/2);g.add(w);
  addSconces(g,-CW/2,-SEG*.5,1);return g;
}
function sCollapsed(){
  const g=new THREE.Group(),s=ns();shell(g);derelict(g,s);
  [[.4,.15,-SEG*.45],[-.3,.1,-SEG*.5],[.1,.18,-SEG*.55],[-.5,.08,-SEG*.42],[.6,.11,-SEG*.48]].forEach(([x,y,z],i)=>{
    const sz=.12+(i%3)*.09;
    const rb=new THREE.Mesh(new THREE.BoxGeometry(sz,sz*.6,sz*1.1),M.rubb);
    rb.position.set(x,y,z);rb.rotation.y=i*.7;g.add(rb);
  });
  const sl=new THREE.Mesh(new THREE.BoxGeometry(1.6,.12,1.0),M.rubb);
  sl.position.set(-.25,CH-1.4,-SEG*.5);sl.rotation.z=.13;g.add(sl);
  return g;
}
function sSealedL(){
  const g=new THREE.Group(),s=ns();shell(g);derelict(g,s);
  addSconces(g,CW/2,-SEG*.5,-1);
  const af=new THREE.Mesh(new THREE.BoxGeometry(.09,2.8,1.2),M.wall.clone());
  af.position.set(-CW/2+.045,1.4,-SEG*.5);g.add(af);
  const ks=new THREE.Mesh(new THREE.BoxGeometry(.11,.14,1.28),M.scon);
  ks.position.set(-CW/2+.055,2.87,-SEG*.5);g.add(ks);
  return g;
}
function sSealedR(){
  const g=new THREE.Group(),s=ns();shell(g);derelict(g,s);
  addSconces(g,-CW/2,-SEG*.5,1);
  const af=new THREE.Mesh(new THREE.BoxGeometry(.09,2.8,1.2),M.wall.clone());
  af.position.set(CW/2-.045,1.4,-SEG*.5);g.add(af);
  const ks=new THREE.Mesh(new THREE.BoxGeometry(.11,.14,1.28),M.scon);
  ks.position.set(CW/2-.055,2.87,-SEG*.5);g.add(ks);
  return g;
}
function sAlcove(){
  const g=new THREE.Group(),s=ns();shell(g);derelict(g,s);
  addSconces(g,-CW/2,-SEG*.5,1);
  const bk=new THREE.Mesh(new THREE.PlaneGeometry(1.4,2.8),M.wall.clone());
  bk.position.set(-CW/2-1.0,1.4,-SEG*.5);g.add(bk);
  const tp=new THREE.Mesh(new THREE.PlaneGeometry(1.0,1.4),M.ceil.clone());
  tp.rotation.x=Math.PI/2;tp.rotation.z=Math.PI/2;tp.position.set(-CW/2-.5,2.8,-SEG*.5);g.add(tp);
  return g;
}
function sChamber(){
  const g=new THREE.Group(),s=ns();const ex=1.8;
  const fl=new THREE.Mesh(new THREE.PlaneGeometry(CW+ex*2,SEG),M.fl);fl.rotation.x=-Math.PI/2;fl.position.set(0,0,-SEG/2);g.add(fl);
  const ce=new THREE.Mesh(new THREE.PlaneGeometry(CW+ex*2,SEG),M.ceil);ce.rotation.x=Math.PI/2;ce.position.set(0,CH,-SEG/2);g.add(ce);
  const wL=new THREE.Mesh(new THREE.PlaneGeometry(SEG,CH),M.wall.clone());wL.rotation.y=Math.PI/2;wL.position.set(-(CW/2+ex),CH/2,-SEG/2);g.add(wL);
  const wR=new THREE.Mesh(new THREE.PlaneGeometry(SEG,CH),M.wall.clone());wR.rotation.y=-Math.PI/2;wR.position.set(CW/2+ex,CH/2,-SEG/2);g.add(wR);
  const bk=new THREE.Mesh(new THREE.PlaneGeometry(CW+ex*2,CH),M.dark);bk.position.set(0,CH/2,-SEG);g.add(bk);
  const fr=new THREE.Mesh(new THREE.PlaneGeometry(CW+ex*2,CH),M.dark);fr.rotation.y=Math.PI;fr.position.set(0,CH/2,0.02);g.add(fr);
  derelict(g,s);
  addSconces(g,-(CW/2+ex),-SEG*.3,1);addSconces(g,CW/2+ex,-SEG*.3,-1);
  addSconces(g,-(CW/2+ex),-SEG*.7,1);addSconces(g,CW/2+ex,-SEG*.7,-1);
  return g;
}
function sPipes(){
  const g=new THREE.Group(),s=ns();shell(g,SEG,M.wall.clone());derelict(g,s);
  addSconces(g,CW/2,-SEG*.4,-1);
  [-.8,0,.9].forEach((px,i)=>{
    const p=new THREE.Mesh(new THREE.CylinderGeometry(.065,.065,SEG,8),M.pipe);
    p.rotation.x=Math.PI/2;p.position.set(px,CH-.28-i*.13,-SEG/2);g.add(p);
    for(let bz=-2;bz>=-SEG+2;bz-=3.2){
      const br=new THREE.Mesh(new THREE.BoxGeometry(.045,.32,.045),M.iron);
      br.position.set(px,CH-.52-i*.13,bz);g.add(br);
    }
  });
  return g;
}
function sDark(){
  const g=new THREE.Group(),s=ns();shell(g);derelict(g,s);
  // No sconces — just a single very dim distant glow handled by fog
  const sm=new THREE.Mesh(new THREE.SphereGeometry(.08,5,5),M.iron);
  sm.position.set(-CW/2+.5,.08,-SEG*.6);g.add(sm);
  return g;
}
function sNarrow(){
  const g=new THREE.Group(),s=ns();const nw=CW*.52;
  const fl=new THREE.Mesh(new THREE.PlaneGeometry(CW,SEG),M.fl);fl.rotation.x=-Math.PI/2;fl.position.set(0,0,-SEG/2);g.add(fl);
  const ce=new THREE.Mesh(new THREE.PlaneGeometry(CW,SEG),M.ceil);ce.rotation.x=Math.PI/2;ce.position.set(0,CH,-SEG/2);g.add(ce);
  const wL=new THREE.Mesh(new THREE.PlaneGeometry(SEG,CH),M.wall.clone());wL.rotation.y=Math.PI/2;wL.position.set(-nw/2,CH/2,-SEG/2);g.add(wL);
  const wR=new THREE.Mesh(new THREE.PlaneGeometry(SEG,CH),M.wall.clone());wR.rotation.y=-Math.PI/2;wR.position.set(nw/2,CH/2,-SEG/2);g.add(wR);
  const iL=new THREE.Mesh(new THREE.PlaneGeometry((CW-nw)/2,CH),M.wall.clone());iL.position.set(-(nw/2+(CW-nw)/4),CH/2,.01);g.add(iL);
  const iR=new THREE.Mesh(new THREE.PlaneGeometry((CW-nw)/2,CH),M.wall.clone());iR.position.set(nw/2+(CW-nw)/4,CH/2,.01);g.add(iR);
  const bk=new THREE.Mesh(new THREE.PlaneGeometry(CW,CH),M.dark);bk.position.set(0,CH/2,-SEG);g.add(bk);
  const fr=new THREE.Mesh(new THREE.PlaneGeometry(CW,CH),M.dark);fr.rotation.y=Math.PI;fr.position.set(0,CH/2,0.02);g.add(fr);
  derelict(g,s);addSconces(g,-nw/2,-SEG*.5,1);return g;
}

const BUILDERS=[sStandard,sFlooded,sCollapsed,sSealedL,sSealedR,sAlcove,sChamber,sPipes,sDark,sNarrow];
const WT=[4,2,1,1,1,1,1,1,1,1];
const WTOT=WT.reduce((a,b)=>a+b,0);
function pick(){let r=Math.random()*WTOT;for(let i=0;i<BUILDERS.length;i++){r-=WT[i];if(r<=0)return BUILDERS[i]();}return sStandard();}

// ── Segment pool ──────────────────────────────────────────
const segs=[];
let frontZ=0;
for(let i=0;i<POOL;i++){
  const s=i===0?sStandard():pick();
  s.position.z=frontZ;frontZ-=SEG;
  scene.add(s);segs.push(s);
}

// ── Sky window ────────────────────────────────────────────
let skyGrp=null,skyActive=false,skyT=0;
function buildSkyWindow(){
  const g=new THREE.Group();
  // Concrete frame around window
  [
    [0,CH*.35+3.1,0,CW+.3,.28,.25],  // top beam
    [0,CH*.35-.72,0,CW+.3,.28,.25],  // bottom sill
    [-CW/2+.14,CH*.35+1.2,0,.28,4.2,.25], // left jamb
    [ CW/2-.14,CH*.35+1.2,0,.28,4.2,.25], // right jamb
  ].forEach(([x,y,z,w,h,d])=>{
    const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),M.wall.clone());
    m.position.set(x,y,z);g.add(m);
  });
  // Animated sky canvas
  const sc=document.createElement('canvas');sc.width=512;sc.height=256;
  const sctx=sc.getContext('2d');
  const stex=new THREE.CanvasTexture(sc);
  function drawSky(t){
    const gr=sctx.createLinearGradient(0,0,0,256);
    gr.addColorStop(0,'#4a90c8');gr.addColorStop(.45,'#78b8e0');gr.addColorStop(1,'#b8d8f0');
    sctx.fillStyle=gr;sctx.fillRect(0,0,512,256);
    [{x:.12,y:.28,w:110,h:32,sp:.007},{x:.44,y:.18,w:165,h:45,sp:.005},{x:.75,y:.32,w:95,h:26,sp:.01}].forEach(cl=>{
      const cx=((cl.x+t*cl.sp)%1.15-.1)*512,cy=cl.y*256;
      sctx.fillStyle='rgba(255,255,255,0.85)';sctx.beginPath();sctx.ellipse(cx,cy,cl.w,cl.h,0,0,Math.PI*2);sctx.fill();
      sctx.fillStyle='rgba(255,255,255,0.5)';sctx.beginPath();sctx.ellipse(cx,cy-cl.h*.2,cl.w*.65,cl.h*.5,0,0,Math.PI*2);sctx.fill();
    });
    const sg=sctx.createRadialGradient(400,35,0,400,35,90);
    sg.addColorStop(0,'rgba(255,250,210,.65)');sg.addColorStop(1,'rgba(255,250,210,0)');
    sctx.fillStyle=sg;sctx.fillRect(0,0,512,256);
    stex.needsUpdate=true;
  }
  const sp=new THREE.Mesh(new THREE.PlaneGeometry(CW-.65,4.0),
    new THREE.MeshBasicMaterial({map:stex,side:THREE.FrontSide}));
  sp.position.set(0,CH*.35+1.2,.01);g.userData.draw=drawSky;g.add(sp);
  // Floor shaft
  const shm=new THREE.MeshBasicMaterial({color:0xfff5d8,transparent:true,opacity:0,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false});
  const sh=new THREE.Mesh(new THREE.PlaneGeometry(CW-.65,6),shm);
  sh.rotation.x=-Math.PI/2;sh.position.set(0,.01,-2.5);g.userData.shaft=shm;g.add(sh);
  g.visible=false;scene.add(g);return g;
}
skyGrp=buildSkyWindow();

// ── Drips ─────────────────────────────────────────────────
const drips=[];
const DM=new THREE.MeshBasicMaterial({color:0x1e3850,transparent:true,opacity:0.65});
const SM=new THREE.MeshBasicMaterial({color:0x182e40,transparent:true,opacity:0,side:THREE.DoubleSide});
for(let i=0;i<18;i++){
  const dm=new THREE.Mesh(new THREE.SphereGeometry(.015,4,4),DM.clone());dm.visible=false;scene.add(dm);
  const sp=new THREE.Mesh(new THREE.RingGeometry(.01,.05,8),SM.clone());sp.rotation.x=-Math.PI/2;sp.visible=false;scene.add(sp);
  drips.push({dm,sp,vy:0,x:0,z:0,sy:0,on:false,splash:false,st:0,timer:Math.random()*8});
}
function resetDrip(d){
  d.x=(Math.random()-.5)*(CW-.5);
  d.z=cam.position.z-2-Math.random()*25;
  d.sy=CH*.4+Math.random()*CH*.35;
  d.dm.position.set(d.x,d.sy,d.z);
  d.vy=0;d.on=true;d.splash=false;d.dm.visible=true;d.sp.visible=false;
  d.timer=4+Math.random()*10;
}

// ── Input ─────────────────────────────────────────────────
const K={};
document.addEventListener('keydown',e=>K[e.key]=true);
document.addEventListener('keyup',  e=>K[e.key]=false);
let yaw=0,pitch=0,locked=false;
canvas.addEventListener('click',()=>{if(started)canvas.requestPointerLock();});
document.addEventListener('pointerlockchange',()=>locked=document.pointerLockElement===canvas);
document.addEventListener('mousemove',e=>{
  if(!locked)return;
  yaw  -=e.movementX*.0018;pitch-=e.movementY*.0018;
  pitch=Math.max(-.75,Math.min(.75,pitch));yaw=Math.max(-.55,Math.min(.55,yaw));
});
// Mobile
let mf=false,ml=false,mr=false,ltid=null,lsy=0,lsp=0,lsx=0,lsyw=0;
document.getElementById('bf').addEventListener('touchstart',e=>{e.preventDefault();mf=true;},{passive:false});
document.getElementById('bf').addEventListener('touchend',()=>mf=false);
document.getElementById('bl').addEventListener('touchstart',e=>{e.preventDefault();ml=true;},{passive:false});
document.getElementById('bl').addEventListener('touchend',()=>ml=false);
document.getElementById('br').addEventListener('touchstart',e=>{e.preventDefault();mr=true;},{passive:false});
document.getElementById('br').addEventListener('touchend',()=>mr=false);
const lz=document.getElementById('look');
lz.addEventListener('touchstart',e=>{e.preventDefault();const t=e.changedTouches[0];ltid=t.identifier;lsy=t.clientY;lsp=pitch;lsx=t.clientX;lsyw=yaw;},{passive:false});
lz.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches){if(t.identifier!==ltid)continue;pitch=lsp-(t.clientY-lsy)*.0038;yaw=lsyw-(t.clientX-lsx)*.0038;pitch=Math.max(-.75,Math.min(.75,pitch));yaw=Math.max(-.55,Math.min(.55,yaw));}},{passive:false});
lz.addEventListener('touchend',()=>ltid=null);

// ── Messages ──────────────────────────────────────────────
const MSGS=["there is no end to this","you have always been here","the dark is not empty","all passages lead inward","you are the only warmth","before the first light — this","walk until you remember","the walls know your name","silence is the oldest language","depth is not a direction","something walks beside you","you began walking long ago","the dark precedes everything","to descend is to return","you have not been forgotten","the ceiling has no end","you are expected","keep walking","this has no exit","you were here before you arrived"];
const msgEl=document.getElementById('msg');
let lastMZ=0,mIdx=Math.floor(Math.random()*MSGS.length),mTimer=null;
function showMsg(){msgEl.textContent=MSGS[mIdx++%MSGS.length];msgEl.classList.add('show');if(mTimer)clearTimeout(mTimer);mTimer=setTimeout(()=>msgEl.classList.remove('show'),5500);}

// ── Start ─────────────────────────────────────────────────
let started=false;
document.getElementById('start').addEventListener('click',async()=>{
  await initAudio();started=true;
  const s=document.getElementById('start');s.classList.add('out');
  setTimeout(()=>s.style.display='none',2600);
});

// ── Main loop ─────────────────────────────────────────────
const WALK=2.4,CRAWL=0.25,TURN=0.66;
let bobT=0,totT=0,prevBlend=0,resetting=false,corCount=0;
const fadeEl=document.getElementById('fade');
const CLK=new THREE.Clock();

function lerp(a,b,t){return a+(b-a)*t;}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function ss(a,b,t){t=clamp((t-a)/(b-a),0,1);return t*t*(3-2*t);}

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(CLK.getDelta(),.05);
  totT+=dt;
  if(!started){R.render(scene,cam);return;}

  // ── Song phase ──
  const st=songTime();
  let brt=0;
  if(st>=T_TRANS&&st<T_DIRECT)brt=ss(T_TRANS,T_DIRECT,st);
  else if(st>=T_DIRECT&&st<T_RESET)brt=1;

  // Blend textures + brighten materials
  blend=clamp(lerp(blend,brt,dt*.022),0,1);
  if(Math.abs(blend-prevBlend)>.005){refreshMats();prevBlend=blend;}

  // Override wall brightness for song phase (additive on top of refreshMats)
  if(brt>0){
    const eb=1+brt*1.6;
    M.wall.color.setRGB(Math.min(1,.38*eb),Math.min(1,.44*eb),Math.min(1,.50*eb));
    M.fl.color.setRGB(  Math.min(1,.25*eb),Math.min(1,.31*eb),Math.min(1,.37*eb));
    M.ceil.color.setRGB(Math.min(1,.04+brt*.55),Math.min(1,.05+brt*.45),Math.min(1,.07+brt*.32));
  }

  // Fog
  const fn=lerp(16,40,brt),ff=lerp(52,95,brt);
  scene.fog.near=fn;scene.fog.far=ff;
  curFog.lerp(targFog,dt*.4);
  const fc=new THREE.Color().lerpColors(curFog,new THREE.Color(0xc8dce8),brt*.85);
  scene.fog.color.copy(fc);scene.background.copy(fc);

  // ── Sky window ──
  if(st>=T_WIN&&!resetting){
    if(!skyActive){skyActive=true;skyGrp.visible=true;skyGrp.position.set(0,0,cam.position.z-38);}
    skyT+=dt;if(skyGrp.userData.draw)skyGrp.userData.draw(skyT);
    if(skyGrp.userData.shaft)skyGrp.userData.shaft.opacity=ss(T_WIN,T_DIRECT,st)*.16;
  }

  // ── Reset ──
  if(st>=T_RESET&&!resetting){
    resetting=true;fadeEl.classList.add('on');
    setTimeout(()=>{
      blend=0;prevBlend=0;refreshMats();
      skyActive=false;skyGrp.visible=false;
      palIdx=0;targFog.copy(PALS[0].fog);curFog.copy(PALS[0].fog);
      corCount=0;startMain();
      setTimeout(()=>{fadeEl.classList.remove('on');resetting=false;},2600);
    },2500);
  }

  // ── Move ──
  if(!resetting){
    if(K.a||K.A||K.ArrowLeft||ml) yaw+=TURN*dt;
    if(K.d||K.D||K.ArrowRight||mr)yaw-=TURN*dt;
    yaw*=.967;yaw=clamp(yaw,-.55,.55);
    const mv=K.w||K.W||K.ArrowUp||mf;
    const sp=mv?WALK:CRAWL;
    cam.position.z+=-sp*dt;
    cam.position.x+=Math.sin(yaw)*sp*dt;
    cam.position.x=clamp(cam.position.x,-(CW/2-.45),CW/2-.45);
    bobT+=dt*(mv?3.1:.85);
    cam.position.y=1.7+Math.sin(bobT)*(mv?.045:.012);
    // Footstep
    if(mv&&AC){const now=AC.currentTime;if(now-lastStep>.5){shot('footstep',.62+Math.random()*.25,.06);lastStep=now;}}
  }

  cam.rotation.order='YXZ';
  cam.rotation.y=yaw;
  cam.rotation.x=pitch+Math.sin(bobT*.7)*.005;

  // ── Flicker ──
  flickers.forEach(f=>{
    let v;
    if(f.mode==='slow'){v=.72+Math.sin(totT*f.speed+f.phase)*.28+Math.sin(totT*f.speed*.38+f.phase)*.14;v=Math.max(.08,v);}
    else{const st2=Math.random()<.07?Math.random()<.5?0:.1:1;v=(.62+Math.sin(totT*f.speed+f.phase)*.38)*st2;v=Math.max(0,v);}
    f.gmat.opacity=f.base*v;
    if(f.core)f.core.material.color.setScalar(.12+v*.88);
  });

  // ── Drips ──
  drips.forEach(d=>{
    if(!d.on){d.timer-=dt;if(d.timer<=0)resetDrip(d);return;}
    if(d.splash){
      d.st+=dt;d.sp.material.opacity=Math.max(0,.42*(1-d.st/.5));d.sp.scale.setScalar(1+d.st*7);
      if(d.st>.5){d.dm.visible=false;d.sp.visible=false;d.on=false;d.timer=5+Math.random()*11;}
      return;
    }
    d.vy-=9.4*dt;d.dm.position.y+=d.vy*dt;
    if(d.dm.position.y<=.01){
      d.splash=true;d.st=0;d.dm.visible=false;
      d.sp.position.set(d.x,.003,d.z);d.sp.visible=true;
      d.sp.material.opacity=.42;d.sp.scale.setScalar(1);drip();
    }
  });

  // ── Recycle segments ──
  for(let i=0;i<segs.length;i++){
    const sg=segs[i];
    if(sg.position.z>cam.position.z+SEG*1.6){
      scene.remove(sg);
      const fr=pick();fr.position.z=frontZ;frontZ-=SEG;
      scene.add(fr);segs[i]=fr;corCount++;
      // Hue shift every 5 corridors during dark phase
      if(corCount%5===0&&brt<.2){
        palIdx=(palIdx+1)%PALS.length;targFog.copy(PALS[palIdx].fog);
      }
    }
  }

  // ── Messages ──
  if(cam.position.z<lastMZ-22-Math.random()*16){lastMZ=cam.position.z;showMsg();}

  R.render(scene,cam);
}

window.addEventListener('resize',()=>{
  cam.aspect=window.innerWidth/window.innerHeight;
  cam.updateProjectionMatrix();
  R.setSize(window.innerWidth,window.innerHeight);
});

animate();
</script>
</body>
</html>
