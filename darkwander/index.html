<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Darkwander</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;user-select:none;-webkit-user-select:none;}
body{background:#000;overflow:hidden;width:100vw;height:100vh;cursor:none;}
canvas{display:block;touch-action:none;}
#ui{position:fixed;inset:0;pointer-events:none;z-index:10;}
#vignette{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 32%,rgba(0,0,0,0.15) 60%,rgba(0,0,0,0.68) 100%);}
#grain{position:absolute;inset:0;opacity:0.022;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:200px 200px;animation:gs .1s steps(1) infinite;}
@keyframes gs{0%{background-position:0 0}25%{background-position:-50px -25px}50%{background-position:25px -50px}75%{background-position:-25px 50px}100%{background-position:50px 25px}}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none;transition:opacity 2.5s ease;z-index:5;}
#fade.on{opacity:1;}
#msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:rgba(180,165,140,0);font-family:'Palatino Linotype',Palatino,serif;font-size:clamp(11px,1.8vw,15px);letter-spacing:0.45em;text-transform:uppercase;text-align:center;pointer-events:none;transition:color 2.5s ease-in-out;max-width:55vw;line-height:2.2;z-index:6;}
#msg.show{color:rgba(180,160,120,0.42);}
#start{position:fixed;inset:0;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:100;transition:opacity 2.5s ease;cursor:pointer;}
#start h1{font-family:'Palatino Linotype',Palatino,serif;font-size:clamp(20px,4.5vw,46px);font-weight:400;color:rgba(200,180,140,0.8);letter-spacing:0.55em;text-transform:uppercase;text-align:center;margin-bottom:20px;text-shadow:0 0 50px rgba(180,140,80,0.3);animation:br 5s ease-in-out infinite;}
#start p{font-family:'Palatino Linotype',serif;font-size:clamp(9px,1.3vw,11px);color:rgba(140,120,80,0.38);letter-spacing:0.4em;text-transform:uppercase;animation:br 5s ease-in-out infinite reverse;}
@keyframes br{0%,100%{opacity:0.42}50%{opacity:1}}
#start.out{opacity:0;pointer-events:none;}
#ctrl{display:none;position:fixed;inset:0;z-index:20;pointer-events:none;}
#move{position:absolute;bottom:0;left:0;width:50%;height:220px;pointer-events:all;touch-action:none;}
#look{position:absolute;bottom:0;right:0;width:50%;height:100%;pointer-events:all;touch-action:none;}
.btn{position:absolute;border-radius:50%;border:1px solid rgba(180,150,80,0.12);background:rgba(0,0,0,0.26);display:flex;align-items:center;justify-content:center;pointer-events:all;touch-action:none;color:rgba(180,150,80,0.22);font-size:17px;font-family:serif;}
#bf{width:70px;height:70px;bottom:80px;left:50%;transform:translateX(-50%);}
#bl{width:52px;height:52px;bottom:90px;left:calc(50% - 88px);}
#br{width:52px;height:52px;bottom:90px;left:calc(50% + 36px);}
#lh{position:absolute;top:14px;right:14px;color:rgba(140,120,80,0.18);font-family:'Palatino Linotype',serif;font-size:8px;letter-spacing:0.3em;text-transform:uppercase;pointer-events:none;}
@media(max-width:900px){#ctrl{display:block;}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div id="vignette"></div>
  <div id="grain"></div>
  <div id="fade"></div>
  <div id="msg"></div>
</div>
<div id="start"><h1>The Darkwander</h1><p>touch to enter</p></div>
<div id="ctrl">
  <div id="move">
    <div class="btn" id="bf">↑</div>
    <div class="btn" id="bl">←</div>
    <div class="btn" id="br">→</div>
  </div>
  <div id="look"></div>
  <div id="lh">drag to look</div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
'use strict';

// ── Song timing ────────────────────────────────────────────
const T_TOTAL=2300,T_TRANS=1820,T_SUN=2120,T_WIN=2210,T_DIRECT=2230,T_RESET=2300;

// ── Audio ──────────────────────────────────────────────────
let AC=null,bufs={},mainStart=0,mainSrc=null,lastStep=0;
async function loadBuf(k,p){
  try{
    console.log('[audio] loading',k,'from',p);
    const r=await fetch(p);
    if(!r.ok){console.warn('[audio] not found:',p);return;}
    bufs[k]=await AC.decodeAudioData(await r.arrayBuffer());
    console.log('[audio] loaded',k);
  }catch(e){console.warn('[audio] failed',k,e.message);}
}
function shot(k,vol=1,pv=.05){
  if(!AC||!bufs[k])return;
  const s=AC.createBufferSource();s.buffer=bufs[k];
  s.playbackRate.value=1+(Math.random()-.5)*pv;
  const g=AC.createGain();g.gain.value=vol;
  s.connect(g);g.connect(AC.destination);s.start();
}
function dripSound(){shot(['drip','drip2','drip3'][Math.floor(Math.random()*3)],.28+Math.random()*.35,.12);}
async function initAudio(){
  if(AC)return;
  AC=new(window.AudioContext||window.webkitAudioContext)();
  console.log('[audio] context created, state:',AC.state);
  await Promise.all([
    loadBuf('step','audio/footstep.wav'),
    loadBuf('drip','audio/drip.wav'),
    loadBuf('drip2','audio/drip2.wav'),
    loadBuf('drip3','audio/drip3.wav'),
    loadBuf('ambi','audio/ambience.wav'),
    loadBuf('main','audio/nightmareflesh.mp3'),
  ]);
  console.log('[audio] all loads attempted. loaded keys:',Object.keys(bufs).join(', '));
  if(bufs.ambi){
    const n=AC.createBufferSource();n.buffer=bufs.ambi;n.loop=true;
    const g=AC.createGain();g.gain.value=.34;
    n.connect(g);g.connect(AC.destination);n.start();
    console.log('[audio] ambience started');
  }
  startMain();
}
function startMain(){
  if(!AC||!bufs.main)return;
  try{if(mainSrc)mainSrc.stop();}catch(e){}
  mainSrc=AC.createBufferSource();mainSrc.buffer=bufs.main;
  const g=AC.createGain();g.gain.value=.82;
  mainSrc.connect(g);g.connect(AC.destination);
  mainSrc.start();mainStart=AC.currentTime;
  console.log('[audio] main track started');
}
function songTime(){return AC?Math.min(AC.currentTime-mainStart,T_TOTAL):0;}

// ── Renderer ───────────────────────────────────────────────
const canvas=document.getElementById('c');
const R=new THREE.WebGLRenderer({canvas,antialias:false});
R.setPixelRatio(Math.min(window.devicePixelRatio,1.5));
R.setSize(window.innerWidth,window.innerHeight);
R.shadowMap.enabled=false;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x050810);
// Fog starts far enough that segments ahead are always pre-loaded and visible
// before they arrive. Near=18 means nothing disappears until well past camera.
scene.fog=new THREE.Fog(0x050810,18,55);

const cam=new THREE.PerspectiveCamera(70,window.innerWidth/window.innerHeight,.1,68);
cam.position.set(0,1.7,0);

// ── Dimensions ────────────────────────────────────────────
const CW=4.0, CH=14.0, SEG=12, POOL=14; // POOL=14 — deep queue, no pop-in

// ══════════════════════════════════════════════════════════
// GLOW SPRITE TEXTURE
// A proper radial gradient circle — NOT a square.
// This is what makes a sconce look like a light and not a tile.
// ══════════════════════════════════════════════════════════
function makeGlowTex(r,g,b){
  const S=128,c=document.createElement('canvas');c.width=c.height=S;
  const ctx=c.getContext('2d');
  const cx=S/2,cy=S/2,rad=S/2;
  const gr=ctx.createRadialGradient(cx,cy,0,cx,cy,rad);
  gr.addColorStop(0,  `rgba(${r},${g},${b},1.0)`);
  gr.addColorStop(0.2,`rgba(${r},${g},${b},0.7)`);
  gr.addColorStop(0.5,`rgba(${r},${g},${b},0.25)`);
  gr.addColorStop(0.8,`rgba(${r},${g},${b},0.06)`);
  gr.addColorStop(1,  `rgba(${r},${g},${b},0.0)`);
  ctx.fillStyle=gr;ctx.fillRect(0,0,S,S);
  return new THREE.CanvasTexture(c);
}
// Pre-generate glow textures
const GLOW_COOL=makeGlowTex(160,210,255); // cool blue-white
const GLOW_WARM=makeGlowTex(255,210,130); // warm amber (transition phase)
const GLOW_HALO=makeGlowTex(80,120,200);  // soft wide halo

// ══════════════════════════════════════════════════════════
// LIGHTMAPPED TEXTURE SYSTEM
// Light and shadow baked into textures — no real-time lighting needed.
// Each wall/floor gets unique canvas art with painted-in sconce glow.
// ══════════════════════════════════════════════════════════

function paintConcrete(ctx,W,H,seed,brightness){
  const rng=n=>Math.sin(seed*127.1+n*311.7)*.5+.5;
  const b=Math.max(0,Math.min(1,brightness));
  const base=Math.floor(22*b+3);
  ctx.fillStyle=`rgb(${base},${base},${base+1})`;ctx.fillRect(0,0,W,H);
  // Horizontal pour bands
  for(let y=0;y<H;y+=7+rng(y+seed)*10){
    const v=Math.floor((18+rng(y+seed+100)*10)*b+2);
    ctx.fillStyle=`rgba(${v},${v},${v+1},0.5)`;ctx.fillRect(0,y,W,1+rng(y+seed+200)*.8);
  }
  // Tie holes
  for(let i=0;i<7;i++){
    const x=rng(i+seed+10)*W,y=rng(i+seed+11)*H;
    ctx.beginPath();ctx.arc(x,y,1.1+rng(i+seed+12)*.7,0,Math.PI*2);
    ctx.fillStyle=`rgba(0,0,0,${.35+rng(i+seed+13)*.3})`;ctx.fill();
  }
  // Cracks
  for(let i=0;i<3;i++){
    ctx.beginPath();let cx=rng(i+seed+20)*W,cy=0;ctx.moveTo(cx,0);
    for(let s=0;s<8;s++){cx+=(rng(i+s+seed+30)-.5)*3;cy+=rng(i+s+seed+31)*H*.14;ctx.lineTo(cx,cy);}
    ctx.strokeStyle=`rgba(0,0,0,${.18+rng(i+seed+40)*.25})`;
    ctx.lineWidth=.4+rng(i+seed+41)*.35;ctx.stroke();
  }
  // Moisture patches
  for(let i=0;i<4;i++){
    const x=rng(i+seed+50)*W,y=rng(i+seed+51)*H;
    const gr=ctx.createRadialGradient(x,y,0,x,y,12+rng(i+seed+52)*22);
    gr.addColorStop(0,`rgba(0,0,0,${.12+rng(i+seed+53)*.18})`);
    gr.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
  }
}

function paintLightPool(ctx,W,H,lx,ly,radius,intensity,warm){
  const cx=lx*W,cy=ly*H,r=radius*Math.max(W,H);
  const gr=ctx.createRadialGradient(cx,cy,0,cx,cy,r);
  const wi=Math.min(1,intensity);
  if(warm){
    gr.addColorStop(0,  `rgba(255,235,170,${wi*.72})`);
    gr.addColorStop(.18,`rgba(210,175,100,${wi*.50})`);
    gr.addColorStop(.38,`rgba(140,110,55, ${wi*.24})`);
    gr.addColorStop(.65,`rgba(60,48,22,   ${wi*.07})`);
    gr.addColorStop(1,  'rgba(0,0,0,0)');
  } else {
    gr.addColorStop(0,  `rgba(210,228,255,${wi*.68})`);
    gr.addColorStop(.18,`rgba(148,175,225,${wi*.48})`);
    gr.addColorStop(.38,`rgba(80,105,160, ${wi*.20})`);
    gr.addColorStop(.65,`rgba(28,38,68,   ${wi*.06})`);
    gr.addColorStop(1,  'rgba(0,0,0,0)');
  }
  ctx.globalCompositeOperation='screen';
  ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
  ctx.globalCompositeOperation='source-over';
}

function makeWallTex(W,H,seed,lightY,hasLight,lightIntensity,warm){
  const c=document.createElement('canvas');c.width=W;c.height=H;
  const ctx=c.getContext('2d');
  paintConcrete(ctx,W,H,seed,.36);
  if(hasLight&&lightIntensity>0){
    paintLightPool(ctx,W,H,.5,lightY,.58,lightIntensity,warm||false);
    paintLightPool(ctx,W,H,.5,lightY,.16,lightIntensity*1.3,warm||false);
  }
  // Edge darkening — corners always darker
  const eL=ctx.createLinearGradient(0,0,W*.3,0);
  eL.addColorStop(0,'rgba(0,0,0,0.58)');eL.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=eL;ctx.fillRect(0,0,W,H);
  const eR=ctx.createLinearGradient(W,0,W*.7,0);
  eR.addColorStop(0,'rgba(0,0,0,0.58)');eR.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=eR;ctx.fillRect(0,0,W,H);
  // Top dark (ceiling region)
  const tG=ctx.createLinearGradient(0,0,0,H*.45);
  tG.addColorStop(0,'rgba(0,0,0,0.72)');tG.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=tG;ctx.fillRect(0,0,W,H);
  const t=new THREE.CanvasTexture(c);
  return t;
}

function makeFloorTex(W,H,seed,hasLight,lightX,warm){
  const c=document.createElement('canvas');c.width=W;c.height=H;
  const ctx=c.getContext('2d');
  const b=6;ctx.fillStyle=`rgb(${b},${b+1},${b+1})`;ctx.fillRect(0,0,W,H);
  // Slab grid
  ctx.strokeStyle='rgba(0,0,0,0.65)';ctx.lineWidth=1.2;
  for(let x=0;x<W;x+=64)for(let y=0;y<H;y+=32){
    const o=(Math.floor(y/32)%2)*32;ctx.strokeRect(x+o-64,y,64,32);
  }
  // Drain
  ctx.fillStyle='rgba(0,0,0,0.75)';ctx.fillRect(W/2-2,0,3,H);
  // Stains
  for(let i=0;i<7;i++){
    const x=Math.sin(seed+i*77)*W*.38+W*.5,y=Math.sin(seed+i*123)*H*.38+H*.5;
    const gr=ctx.createRadialGradient(x,y,0,x,y,10+Math.sin(seed+i*31)*8);
    gr.addColorStop(0,'rgba(0,0,0,0.32)');gr.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
  }
  // Reflected light from sconce above
  if(hasLight){
    const lx=(lightX||.5)*W;
    const gr=ctx.createRadialGradient(lx,H*.25,0,lx,H*.25,W*.42);
    if(warm){
      gr.addColorStop(0,'rgba(110,82,35,0.32)');
      gr.addColorStop(.45,'rgba(55,40,16,0.12)');
      gr.addColorStop(1,'rgba(0,0,0,0)');
    } else {
      gr.addColorStop(0,'rgba(55,75,115,0.30)');
      gr.addColorStop(.45,'rgba(28,38,65,0.10)');
      gr.addColorStop(1,'rgba(0,0,0,0)');
    }
    ctx.globalCompositeOperation='screen';
    ctx.fillStyle=gr;ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation='source-over';
  }
  // Edge darkening
  const eL=ctx.createLinearGradient(0,0,W*.28,0);
  eL.addColorStop(0,'rgba(0,0,0,0.62)');eL.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=eL;ctx.fillRect(0,0,W,H);
  const eR=ctx.createLinearGradient(W,0,W*.72,0);
  eR.addColorStop(0,'rgba(0,0,0,0.62)');eR.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=eR;ctx.fillRect(0,0,W,H);
  const t=new THREE.CanvasTexture(c);
  return t;
}

// ── Load external textures (with console confirmation) ─────
// These override the procedural fallbacks when present.
// Wall textures are applied to a shared per-material map.
// Since lightmaps are baked per-segment, external textures
// are composited as an overlay tint rather than a full replace.
const TL=new THREE.TextureLoader();
const EXT={}; // external textures when loaded

function tryLoadTex(key,url){
  console.log('[tex] attempting',key,'from',url);
  TL.load(url,
    t=>{
      t.wrapS=t.wrapT=THREE.RepeatWrapping;
      EXT[key]=t;
      console.log('[tex] loaded',key);
    },
    undefined,
    ()=>console.warn('[tex] not found (using procedural):',url)
  );
}
tryLoadTex('dark_wall',  'textures/dark/wall.jpg');
tryLoadTex('dark_floor', 'textures/dark/floor.jpg');
tryLoadTex('dark_ceil',  'textures/dark/ceiling.jpg');
tryLoadTex('light_wall', 'textures/light/wall.jpg');
tryLoadTex('light_floor','textures/light/floor.jpg');
tryLoadTex('light_ceil', 'textures/light/ceiling.jpg');

// ── Static materials ───────────────────────────────────────
const M_CEIL =new THREE.MeshBasicMaterial({color:0x030508});
const M_DARK =new THREE.MeshBasicMaterial({color:0x010203});
const M_RUBB =new THREE.MeshBasicMaterial({color:0x1a2028});
const M_IRON =new THREE.MeshBasicMaterial({color:0x101620});
const M_SCON =new THREE.MeshBasicMaterial({color:0x182030});
const M_RUST =new THREE.MeshBasicMaterial({color:0x2a1006});
const M_MOSS =new THREE.MeshBasicMaterial({color:0x0c1208});
const M_PIPE =new THREE.MeshBasicMaterial({color:0x222e38});
const M_WAT  =new THREE.MeshBasicMaterial({color:0x0a1218,transparent:true,opacity:.68});
const M_GDEAD=new THREE.MeshBasicMaterial({color:0x121820,transparent:true,opacity:.48});
const M_GLASS=new THREE.MeshBasicMaterial({color:0x78a8c8,transparent:true,opacity:.28});

// Flicker registry
const FLICKERS=[];

// ── Sconce visual ─────────────────────────────────────────
// Uses circular glow texture — looks like a real light source
function addSconceVisual(g,wx,y,z,side,type,sc){
  // Wall bracket
  const arm=new THREE.Mesh(new THREE.BoxGeometry(.052*sc,.052*sc,.16*sc),M_SCON);
  arm.position.set(wx+side*.06*sc,y,z);g.add(arm);

  // Globe
  const gm=(type==='off')?M_GDEAD:M_GLASS.clone();
  const globe=new THREE.Mesh(new THREE.SphereGeometry(.075*sc,7,7),gm);
  globe.position.set(wx+side*.13*sc,y,z);g.add(globe);

  if(type==='off'){
    // Smashed remnant
    const sh=new THREE.Mesh(new THREE.SphereGeometry(.026*sc,4,4),M_RUST);
    sh.position.set(wx+side*.14*sc,y-.018*sc,z);g.add(sh);
    return null;
  }

  // Hot emissive core dot
  const coreMat=new THREE.MeshBasicMaterial({color:0xeef5ff});
  const core=new THREE.Mesh(new THREE.SphereGeometry(.022*sc,5,5),coreMat);
  core.position.set(wx+side*.13*sc,y,z);g.add(core);

  // ── Glow sprite with CIRCULAR radial texture ──
  // Close glow — tight, bright
  const closeSize=.30*sc*(y<2.5?1.6:1.0);
  const closeMat=new THREE.SpriteMaterial({
    map:GLOW_COOL,color:0xc8e0ff,
    transparent:true,opacity:.72,
    blending:THREE.AdditiveBlending,depthWrite:false
  });
  const closeGlow=new THREE.Sprite(closeMat);
  closeGlow.scale.set(closeSize,closeSize,1);
  closeGlow.position.set(wx+side*.13*sc,y,z);
  g.add(closeGlow);

  // Wide soft halo — only bottom two rows
  if(y<4.0){
    const haloSize=closeSize*3.2;
    const haloMat=new THREE.SpriteMaterial({
      map:GLOW_HALO,color:0x6090d8,
      transparent:true,opacity:.18,
      blending:THREE.AdditiveBlending,depthWrite:false
    });
    const halo=new THREE.Sprite(haloMat);
    halo.scale.set(haloSize,haloSize,1);
    halo.position.set(wx+side*.13*sc,y,z);
    g.add(halo);
  }

  if(type==='flicker'){
    FLICKERS.push({
      closeMat,coreMat,
      base:.72,
      phase:Math.random()*Math.PI*2,
      speed:3.5+Math.random()*8,
      mode:Math.random()<.5?'slow':'erratic'
    });
  }
  return {closeMat,coreMat};
}

// ── Shell builder ─────────────────────────────────────────
function buildShell(g,seed,scL,scR,len,warm){
  const L=len||SEG;
  const W=512,H=512;
  const w=warm||false;
  const sLy=scL?(1-(scL.y/CH)):.35;
  const sRy=scR?(1-(scR.y/CH)):.35;

  const ltex=makeWallTex(W,H,seed,    scL?sLy:.35, !!scL&&scL.type!=='off', scL?scL.i:.0, w);
  const rtex=makeWallTex(W,H,seed+50, scR?sRy:.35, !!scR&&scR.type!=='off', scR?scR.i:.0, w);
  const ftex=makeFloorTex(W,H,seed+100, !!(scL||scR), scL?.35:.5, w);

  const fl=new THREE.Mesh(new THREE.PlaneGeometry(CW,L),new THREE.MeshBasicMaterial({map:ftex}));
  fl.rotation.x=-Math.PI/2;fl.position.set(0,0,-L/2);g.add(fl);

  const ce=new THREE.Mesh(new THREE.PlaneGeometry(CW,L),M_CEIL);
  ce.rotation.x=Math.PI/2;ce.position.set(0,CH,-L/2);g.add(ce);

  const wL=new THREE.Mesh(new THREE.PlaneGeometry(L,CH),new THREE.MeshBasicMaterial({map:ltex}));
  wL.rotation.y=Math.PI/2;wL.position.set(-CW/2,CH/2,-L/2);g.add(wL);

  const wR=new THREE.Mesh(new THREE.PlaneGeometry(L,CH),new THREE.MeshBasicMaterial({map:rtex}));
  wR.rotation.y=-Math.PI/2;wR.position.set(CW/2,CH/2,-L/2);g.add(wR);

  // Back cap
  const bk=new THREE.Mesh(new THREE.PlaneGeometry(CW,CH),M_DARK);
  bk.position.set(0,CH/2,-L);g.add(bk);

  // Front cap (prevents seeing behind you into void)
  const fr=new THREE.Mesh(new THREE.PlaneGeometry(CW,CH),M_DARK);

// ── Derelict details ──────────────────────────────────────
function derelict(g,seed){
  const rng=n=>Math.sin(seed*91.3+n*177.7)*.5+.5;
  for(let i=0;i<3;i++){
    if(rng(i)<.42)continue;
    const grime=new THREE.Mesh(
      new THREE.PlaneGeometry(.28+rng(i+1)*.65,.18+rng(i+2)*.4),
      new THREE.MeshBasicMaterial({color:0x040608,transparent:true,opacity:.42+rng(i+3)*.28})
    );
    grime.rotation.x=-Math.PI/2;grime.position.set((rng(i+4)-.5)*(CW-.38),.002,-rng(i+5)*SEG);g.add(grime);
  }
  for(const s of[-1,1]){
    if(rng(seed+s*3)<.38)continue;
    const sh=.7+rng(seed+s)*1.4;
    const sm=new THREE.Mesh(
      new THREE.PlaneGeometry(.045+rng(seed+s+1)*.09,sh),
      new THREE.MeshBasicMaterial({color:0x240c04,transparent:true,opacity:.38+rng(seed+s+2)*.26})
    );
    sm.rotation.y=s>0?-Math.PI/2:Math.PI/2;
    sm.position.set(s*CW/2+s*.003,sh/2,-(1.5+rng(seed+s+3)*(SEG-2)));g.add(sm);
  }
  if(rng(seed+10)>.66){
    const s=rng(seed+11)>.5?1:-1;
    const ch=new THREE.Mesh(new THREE.CylinderGeometry(.007,.007,.4+rng(seed+12)*.8,5),M_IRON);
    ch.position.set(s*(CW/2-.17),2.8+rng(seed+13)*1.2,-(2+rng(seed+14)*(SEG-4)));g.add(ch);
    const fx=new THREE.Mesh(new THREE.BoxGeometry(.07,.05,.07),M_RUST);
    fx.position.set(ch.position.x,ch.position.y-.24,ch.position.z);g.add(fx);
  }
  for(const s of[-1,1]){
    if(rng(seed+s*7)<.32)continue;
    const mh=.16+rng(seed+s*7+1)*.34;
    const mm=new THREE.Mesh(new THREE.PlaneGeometry(SEG,mh),M_MOSS);
    mm.rotation.y=s>0?-Math.PI/2:Math.PI/2;mm.position.set(s*CW/2+s*.003,mh/2,-SEG/2);g.add(mm);
  }
  for(let i=0;i<Math.floor(rng(seed+20)*3);i++){
    const sz=.035+rng(seed+21+i)*.08;
    const rb=new THREE.Mesh(new THREE.BoxGeometry(sz,sz*.55,sz*1.05),M_RUBB);
    rb.position.set((rng(seed+30+i)-.5)*(CW-.35),sz*.27,-(1+rng(seed+31+i)*(SEG-2)));
    rb.rotation.y=rng(seed+32+i)*Math.PI;g.add(rb);
  }
}

function buildSkyWindow(){
  const g=new THREE.Group();
  const sc2=document.createElement('canvas');sc2.width=512;sc2.height=256;
  const sctx=sc2.getContext('2d');
  const stex=new THREE.CanvasTexture(sc2);
  function drawSky(t){
    const gr=sctx.createLinearGradient(0,0,0,256);
    gr.addColorStop(0,'#4a90c8');gr.addColorStop(.45,'#78b8e0');gr.addColorStop(1,'#b8d8f0');
    sctx.fillStyle=gr;sctx.fillRect(0,0,512,256);
    [{x:.12,y:.28,w:100,h:30,sp:.007},{x:.44,y:.18,w:155,h:42,sp:.005},{x:.75,y:.32,w:88,h:24,sp:.01}].forEach(cl=>{
      const cx=((cl.x+t*cl.sp)%1.15-.1)*512,cy=cl.y*256;
      sctx.fillStyle='rgba(255,255,255,0.88)';sctx.beginPath();sctx.ellipse(cx,cy,cl.w,cl.h,0,0,Math.PI*2);sctx.fill();
    });
    const sg=sctx.createRadialGradient(400,35,0,400,35,85);
    sg.addColorStop(0,'rgba(255,250,200,.6)');sg.addColorStop(1,'rgba(255,250,200,0)');
    sctx.fillStyle=sg;sctx.fillRect(0,0,512,256);
    stex.needsUpdate=true;
  }
  const sp=new THREE.Mesh(new THREE.PlaneGeometry(CW-.6,3.8),
    new THREE.MeshBasicMaterial({map:stex}));
  sp.position.set(0,CH*.38+1.6,.01);g.userData.draw=drawSky;g.add(sp);
  const shm=new THREE.MeshBasicMaterial({color:0xffe8b0,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false});
  const sh=new THREE.Mesh(new THREE.PlaneGeometry(CW-.6,5),shm);
  sh.rotation.x=-Math.PI/2;sh.position.set(0,.008,-2.2);g.userData.shaft=shm;g.add(sh);
  g.visible=false;scene.add(g);return g;
}

// ── Main loop ─────────────────────────────────────────────
const WALK=2.4,CRAWL=0.22,TURN=0.65;
let bobT=0,totT=0,resetting=false,corCount=0;
const fadeEl=document.getElementById('fade');
const CLK=new THREE.Clock();
function lerp(a,b,t){return a+(b-a)*t;}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function ss(a,b,t){t=clamp((t-a)/(b-a),0,1);return t*t*(3-2*t);}

function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(CLK.getDelta(),.05);totT+=dt;
  if(!started){R.render(scene,cam);return;}

  const st=songTime();
  let brt=0;
  if(st>=T_TRANS&&st<T_DIRECT)brt=ss(T_TRANS,T_DIRECT,st);
  else if(st>=T_DIRECT&&st<T_RESET)brt=1;

  // Fog
  scene.fog.near=lerp(18,40,brt);scene.fog.far=lerp(55,95,brt);
  curFog.lerp(targFog,dt*.4);
  scene.fog.color.lerpColors(curFog,new THREE.Color(0xc0d0dc),brt*.75);
  scene.background.copy(scene.fog.color);

  // Sky window
  if(st>=T_WIN&&!resetting){
    if(!skyActive){skyActive=true;skyGrp.visible=true;skyGrp.position.set(0,0,cam.position.z-34);}
    skyT+=dt;if(skyGrp.userData.draw)skyGrp.userData.draw(skyT);
    if(skyGrp.userData.shaft)skyGrp.userData.shaft.opacity=ss(T_WIN,T_DIRECT,st)*.14;
  }

  // Reset
  if(st>=T_RESET&&!resetting){
    resetting=true;fadeEl.classList.add('on');
    setTimeout(()=>{
      skyActive=false;skyGrp.visible=false;
      palIdx=0;targFog.copy(PALS[0]);curFog.copy(PALS[0]);
      corCount=0;startMain();
      setTimeout(()=>{fadeEl.classList.remove('on');resetting=false;},2600);
    },2500);
  }

  // Move
  if(!resetting){
    if(K.a||K.A||K.ArrowLeft||ml)  yaw+=TURN*dt;
    if(K.d||K.D||K.ArrowRight||mr) yaw-=TURN*dt;
    yaw*=.967;yaw=clamp(yaw,-.55,.55);
    const mv=K.w||K.W||K.ArrowUp||mf;
    const sp=mv?WALK:CRAWL;
    cam.position.z+=-sp*dt;
    cam.position.x+=Math.sin(yaw)*sp*dt;
    cam.position.x=clamp(cam.position.x,-(CW/2-.43),CW/2-.43);
    bobT+=dt*(mv?2.9:.78);
    cam.position.y=1.7+Math.sin(bobT)*(mv?.042:.009);
    if(mv&&AC){const now=AC.currentTime;if(now-lastStep>.5){shot('step',.58+Math.random()*.22,.06);lastStep=now;}}
  }

  cam.rotation.order='YXZ';
  cam.rotation.y=yaw;
  cam.rotation.x=pitch+Math.sin(bobT*.62)*.004;

  // Flicker
  FLICKERS.forEach(f=>{
    let v;
    if(f.mode==='slow'){v=.72+Math.sin(totT*f.speed+f.phase)*.28+Math.sin(totT*f.speed*.38+f.phase)*.14;v=Math.max(.07,v);}
    else{const s2=Math.random()<.07?Math.random()<.5?0:.08:1;v=(.62+Math.sin(totT*f.speed+f.phase)*.38)*s2;v=Math.max(0,v);}
    f.closeMat.opacity=f.base*v;
    if(f.coreMat)f.coreMat.color.setScalar(.1+v*.9);
  });

  // Drips — full lifecycle
  DRIPS.forEach(d=>{
    if(!d.active){
      d.timer-=dt;
      if(d.timer<=0)resetDrip(d);
      return;
    }
    if(d.splashing){
      d.splashT+=dt;
      d.sp.material.opacity=Math.max(0,.38*(1-d.splashT/.46));
      d.sp.scale.setScalar(1+d.splashT*7.5);
      if(d.splashT>.46){
        d.dm.visible=false;d.sp.visible=false;
        d.active=false;d.timer=4+Math.random()*10;
      }
      return;
    }
    d.vy-=9.4*dt;
    d.dm.position.y+=d.vy*dt;
    if(d.dm.position.y<=.015){
      d.splashing=true;d.splashT=0;
      d.dm.visible=false;
      d.sp.position.set(d.x,.003,d.z);
      d.sp.visible=true;
      d.sp.material.opacity=.38;
      d.sp.scale.setScalar(1);
      dripSound();
    }
  });

  // Recycle — always maintain POOL segments ahead
  // Segments recycle far behind camera (> 1.5 segments back)
  // New ones spawn at frontZ which is always well ahead in fog
  for(let i=0;i<segs.length;i++){
    const sg=segs[i];
    if(sg.position.z>cam.position.z+SEG*1.8){
      scene.remove(sg);
      const fr=pick();fr.position.z=frontZ;frontZ-=SEG;
      scene.add(fr);segs[i]=fr;corCount++;
      if(corCount%5===0&&brt<.12){
        palIdx=(palIdx+1)%PALS.length;targFog.copy(PALS[palIdx]);
      }
    }
  }

  if(cam.position.z<lastMZ-22-Math.random()*14){lastMZ=cam.position.z;showMsg();}

  R.render(scene,cam);
}

window.addEventListener('resize',()=>{
  cam.aspect=window.innerWidth/window.innerHeight;
  cam.updateProjectionMatrix();
  R.setSize(window.innerWidth,window.innerHeight);
});

animate();
</script>
</body>
</html>
