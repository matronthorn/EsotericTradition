<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>THE DARKWANDER</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#000;color:#b9b2a4;font-family:Georgia,'Times New Roman',serif;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
  #gl{position:fixed;left:0;top:0;width:100%;height:100%;display:block;background:#000}
  #grain{position:fixed;left:0;top:0;width:100%;height:100%;pointer-events:none;image-rendering:pixelated;mix-blend-mode:overlay;opacity:.8;z-index:2}
  #vig{position:fixed;inset:0;pointer-events:none;z-index:3;
    background:radial-gradient(ellipse 85% 80% at 50% 50%,rgba(0,0,0,0) 48%,rgba(0,0,0,.42) 82%,rgba(0,0,0,.82) 100%)}
  #touch{position:fixed;inset:0;z-index:5;touch-action:none}
  #hud{display:none;position:fixed;inset:0;z-index:6;pointer-events:none}
  #stick{display:none;position:absolute;border:1px solid rgba(214,200,170,.28);border-radius:50%;background:rgba(0,0,0,.12);pointer-events:none}
  #knob{position:absolute;left:50%;top:50%;width:42%;height:42%;margin:-21% 0 0 -21%;border-radius:50%;
    background:rgba(214,200,170,.20);border:1px solid rgba(214,200,170,.4)}
  .hb{position:absolute;pointer-events:auto;width:46px;height:46px;border-radius:50%;border:1px solid rgba(214,200,170,.28);
    background:rgba(0,0,0,.28);display:flex;align-items:center;justify-content:center;padding:0;cursor:pointer;color:#cfc4ad}
  .hb svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round}
  .hb.off{opacity:.38}
  #bMenu{left:calc(12px + env(safe-area-inset-left));top:calc(12px + env(safe-area-inset-top))}
  #bLight{right:calc(12px + env(safe-area-inset-right));top:calc(12px + env(safe-area-inset-top))}
  #dbg{display:none;position:absolute;left:70px;top:12px;font:11px/1.35 ui-monospace,Menlo,Consolas,monospace;color:#9c9486;white-space:pre;
    text-shadow:0 0 3px #000;pointer-events:none}
  #menu{display:none;position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.9);flex-direction:column;align-items:center;justify-content:flex-start;
    overflow:auto;padding:22px 18px;box-sizing:border-box}
  #menu h2{font-weight:normal;letter-spacing:.4em;font-size:15px;margin:6px 0 14px;color:#d8cfbb}
  .row{display:flex;align-items:center;justify-content:space-between;width:min(92vw,360px);margin:7px 0;font-size:14px;color:#a79f8e}
  .row input[type=range]{width:55%}
  .row select{background:#14110d;color:#cfc4ad;border:1px solid #4a4235;padding:5px;font-family:inherit}
  .btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px}
  .btn{background:#14110d;color:#d8cfbb;border:1px solid #5b5141;padding:10px 16px;font-family:inherit;letter-spacing:.14em;font-size:13px;cursor:pointer}
  .btn:active{background:#2a241b}
  #seedLine{margin-top:14px;font-size:11px;color:#6d665a;letter-spacing:.1em}
  #title{position:fixed;inset:0;z-index:40;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;box-sizing:border-box}
  #title h1{font-weight:normal;font-size:clamp(22px,5.4vw,40px);letter-spacing:.5em;margin:0 0 6px .5em;color:#d8cfbb}
  #title .v{font-size:12px;letter-spacing:.35em;color:#6d665a;margin-bottom:34px}
  #title p{margin:5px 0;font-size:14px;color:#8d8576;max-width:440px;line-height:1.55}
  #go{margin-top:30px;background:none;color:#d8cfbb;border:1px solid #6a5f4c;padding:14px 30px;font-family:inherit;letter-spacing:.35em;font-size:14px;cursor:pointer}
  #go:disabled{opacity:.4}
  #err{display:none;position:fixed;left:0;right:0;top:0;max-height:45vh;overflow:auto;z-index:99;background:rgba(120,0,0,.92);color:#fff;font:11px/1.3 monospace;padding:8px;white-space:pre-wrap;pointer-events:none}
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="grain" width="384" height="216"></canvas>
<div id="vig"></div>
<div id="touch"></div>
<div id="hud">
  <div id="stick"><div id="knob"></div></div>
  <button class="hb" id="bMenu" aria-label="menu"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <button class="hb" id="bLight" aria-label="flashlight"><svg viewBox="0 0 24 24"><path d="M7 3h10l-2 6H9z"/><path d="M9 9v10a1 1 0 0 0 1 1h4a1 1 0 0 0 1-1V9"/><path d="M12 12v2"/></svg></button>
  <div id="dbg"></div>
</div>
<div id="menu">
  <h2>THE DARKWANDER</h2>
  <div class="row"><span>Master</span><input type="range" id="vMaster" min="0" max="100"></div>
  <div class="row"><span>Music</span><input type="range" id="vMusic" min="0" max="100"></div>
  <div class="row"><span>Atmosphere</span><input type="range" id="vAtmos" min="0" max="100"></div>
  <div class="row"><span>Footsteps</span><input type="range" id="vSfx" min="0" max="100"></div>
  <div class="row"><span>Resolution</span><select id="selRes"><option value="360">Low 360p</option><option value="480">PS2 480p</option><option value="720">High 720p</option><option value="0">Native</option></select></div>
  <div class="row"><span>Film grain</span><input type="checkbox" id="chkGrain"></div>
  <div class="row"><span>Debug readout</span><input type="checkbox" id="chkDebug"></div>
  <div class="btns"><button class="btn" id="bResume">RESUME</button><button class="btn" id="bNew">NEW SEED</button><button class="btn" id="bFull">FULLSCREEN</button></div>
  <div id="seedLine">SEED <span id="seedTxt"></span> &nbsp;·&nbsp; F flashlight &nbsp;·&nbsp; WASD + mouse on desktop</div>
</div>
<div id="title">
  <h1>THE DARKWANDER</h1>
  <div class="v">V33</div>
  <p>Left thumb walks. Push it further to run.<br>Right thumb looks. Torch button, top right.</p>
  <p>Do not trust the way you came.</p>
  <button id="go" disabled>LOADING</button>
</div>

function mulberry32(a) {

    a |= 0; a = a + 0x6D2B79F5 | 0;

function hash3(a, b, c) {

  h ^= h >>> 15; h = Math.imul(h, 0x2C1B3C6D); h ^= h >>> 12; h = Math.imul(h, 0x297A2D39); h ^= h >>> 15;

function vnoise(x, y, z) {

  const xf = x - xi, yf = y - yi, zf = z - zi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf), w = zf * zf * (3 - 2 * zf);
  const h = (a, b, c) => hash3(xi + a, yi + b, zi + c) / 4294967296;
  const x00 = lerp(h(0, 0, 0), h(1, 0, 0), u), x10 = lerp(h(0, 1, 0), h(1, 1, 0), u);
  const x01 = lerp(h(0, 0, 1), h(1, 0, 1), u), x11 = lerp(h(0, 1, 1), h(1, 1, 1), u);

/* ---------------- STAIRWELL ---------------- */

    grid(B, c.texF, [0, y, 0], [1, 0, 0], [0, 0, 1], xs, [z0, z1], fT, [0.5, 0.5]);

  };

/* ---------------- TWISTING GRAVITY TUBE ---------------- */

      addHalo(B, q[0] * 0.95, Rf + (q[1] - Rf) * 0.95, z, col, 1.2, rb());

    for (let i = 0; i <= SEG; i++) { const a = i / SEG * TAU, x = Math.cos(a) * Rt, y = Rf + Math.sin(a) * Rt, col = shade(ctx, x, y, z, [0, 0, nz], 0); m.p.push(x, y, z, 0.5 + Math.cos(a) * 0.5, 0.5 + Math.sin(a) * 0.5, col[0], col[1], col[2]); }

/* ---------------- collision, crossing ---------------- */
function resolveCell(c, p, r) {
  if (c.hx !== undefined) {
    const hx = c.hx, hz = c.hz;
    let x = p.x, z = p.z;
    let xmax = hx - r, xmin = -hx + r, zmax = hz - r, zmin = -hz + r;
    for (const d of c.doors) {
      if (!d.link || !doorOpen(d)) continue;
      const lat = d.side < 2 ? x - d.x : z - d.z, half = d.w / 2 - r * 0.5;
      if (Math.abs(lat) < half) {
        if (d.side === 0) zmax = hz + 1.5; else if (d.side === 1) zmin = -hz - 1.5; else if (d.side === 2) xmax = hx + 1.5; else xmin = -hx - 1.5;
      }
    }
    x = clamp(x, xmin, xmax); z = clamp(z, zmin, zmax);
    // when crossing a doorway keep to the jambs
    for (const d of c.doors) {
      if (!d.link || !doorOpen(d)) continue;
      if (d.side < 2 ? (d.side === 0 ? z > hz - r : z < -hz + r) : (d.side === 2 ? x > hx - r : x < -hx + r)) {
        if (d.side < 2) { if (Math.abs(x - d.x) < d.w / 2 + 0.1) x = clamp(x, d.x - d.w / 2 + r * 0.5, d.x + d.w / 2 - r * 0.5); }

      if (dd < m && dd > 1e-6) { x = k.x + dx / dd * m; z = k.z + dz / dd * m; }
    }

  } else {

    p.x = clamp(p.x, -lim, lim);

/* returns the door the player has just walked through, if any */

    for (const d of c.doors) {
      if (!d.link || !doorOpen(d)) continue;
      const dist = (p.x - d.x) * d.n[0] + (p.z - d.z) * d.n[2];
      const lat = d.side < 2 ? p.x - d.x : p.z - d.z;

/* ==========================================================================
   WORLD MANAGER: lazy linking of cells, placement, overlap rejection, the
   load window (current cell + direct neighbours), floating origin, and the
   unseen mutation that changes what lies behind you.
   ========================================================================== */
const W = {
  cells: [], cur: null, vp: null, planes: null, mutRng: null,
  stats: { built: 0, disposed: 0, mutations: 0, sealed: 0, relinked: 0, rejected: 0, entered: 0, failSeal: 0 },
  log: []

function obbOf(c) {
  const b = c.bounds, ctr = M4.pt(c.M, b.c[0], b.c[1], b.c[2]);
  return { c: ctr, u: [M4.dir(c.M, 1, 0, 0), M4.dir(c.M, 0, 1, 0), M4.dir(c.M, 0, 0, 1)], h: b.h };
}

  const t = [b.c[0] - a.c[0], b.c[1] - a.c[1], b.c[2] - a.c[2]];
  const dot = (p, q) => p[0] * q[0] + p[1] * q[1] + p[2] * q[2];

    const cr = [x[1] * y[2] - x[2] * y[1], x[2] * y[0] - x[0] * y[2], x[0] * y[1] - x[1] * y[0]];

/* place cell nw so that its door nwD faces the existing door exD of cell ex */
function placeNew(ex, exD, nw, nwD) {

    const sr = AU.ctx.sampleRate, a = bandDb(A.an, A.fd, sr), m = bandDb(M.an, M.fd, sr);
    for (let b = 0; b < 3; b++) {
      let cutM = 0, cutA = 0;
      if (a[b] > -95 && m[b] > -95) {
        const diff = m[b] - a[b];
        if (diff > MIX_WINDOW[b]) cutM = -(diff - MIX_WINDOW[b]); else if (diff < -MIX_WINDOW[b]) cutA = -(-diff - MIX_WINDOW[b]);
      }
      AU.mixDb[b] += (clamp(cutM, -12, 0) - AU.mixDb[b]) * 0.25;
      AU.mixDb[3 + b] += (clamp(cutA, -12, 0) - AU.mixDb[3 + b]) * 0.25;
      M.eq[b].gain.setTargetAtTime(AU.mixDb[b], t, 0.3);
      A.eq[b].gain.setTargetAtTime(AU.mixDb[3 + b], t, 0.3);
    }
  }
  // scene dependent levels: vast spaces carry more atmosphere, closets muffle it
  if (A) {
    A.level.gain.setTargetAtTime(A.base * AU.vol.atmos * (0.72 + 0.5 * AU.size), t, 1.2);
    A.lp.frequency.setTargetAtTime(18000 - AU.muffle * 15200, t, 0.8);
  }
  if (M) {
    M.level.gain.setTargetAtTime(M.base * AU.vol.music * (0.55 + 0.6 * AU.breath), t, 1.5);
    M.lp.frequency.setTargetAtTime(18000 - AU.muffle * 9000, t, 0.8);
  }
  AU.wetS.gain.setTargetAtTime(0.34 * (1 - AU.size * 0.55), t, 0.4);
  AU.wetL.gain.setTargetAtTime(0.62 * Math.pow(AU.size, 1.5), t, 0.4);
}
function audioScene(cell, time) {
  if (!AU.ok) return;
  AU.size = clamp((Math.log10(Math.max(cell.vol, 8)) - 1.4) / 2.6, 0, 1);
  AU.muffle = cell.kind === 'closet' ? 1 : 0;
  AU.breath = 0.5 + 0.5 * Math.sin(time / 47) * Math.sin(time / 83 + 1);
}
function audioVolumes() {
  if (!AU.ok) return;
  const t = AU.ctx.currentTime;
  AU.master.gain.setTargetAtTime(AU.vol.master, t, 0.05); AU.sfx.gain.setTargetAtTime(AU.vol.sfx, t, 0.05);
}

/* ==========================================================================
   MAIN: UI, input, settings, render loop
   ========================================================================== */
const $ = (id) => document.getElementById(id);
const CFG = { res: 480, grain: true, debug: false, flash: true };
try { const s = JSON.parse(localStorage.getItem('dw33') || '{}'); Object.assign(CFG, s.cfg || {}); Object.assign(AU.vol, s.vol || {}); } catch (e) { }
const saveCfg = () => { try { localStorage.setItem('dw33', JSON.stringify({ cfg: CFG, vol: AU.vol })); } catch (e) { } };

function showErr(msg) {
  const e = $('err'); if (!e) return;
  e.style.display = 'block'; e.textContent = (e.textContent + '\n' + msg).slice(-1500);
}
window.addEventListener('error', (ev) => showErr('ERR ' + ev.message + ' @' + (ev.lineno || '')));
window.addEventListener('unhandledrejection', (ev) => showErr('PROMISE ' + (ev.reason && ev.reason.message || ev.reason)));

/* ---------- textures ---------- */
function loadTextures() {
  const keys = Object.keys(TEXDATA);
  return Promise.all(keys.map(k => new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => { GLR.tex[k] = GLR.makeTexture(img); res(); };
    img.onerror = () => rej(new Error('texture ' + k));
    img.src = 'data:image/jpeg;base64,' + TEXDATA[k];
  })));
}

/* ---------- world start ---------- */
function startWorld() {
  const q = new URLSearchParams(location.search);
  if (q.get('seed')) RUN.seed = (parseInt(q.get('seed'), 10) >>> 0) || RUN.seed;
  W.mutRng = mulberry32(RUN.seed ^ 0x1234ABCD);
  for (const c of W.cells.slice()) { GLR.free(c); }
  W.cells = []; PERSIST.clear();
  const s = genCell(hash3(RUN.seed, 1, 2), 'room', { w: 3.2, h: 3.4, dep: 0, entry: 0 });
  s.doors[0].meta.sealed = true;
  buildCell(s); W.cells.push(s);
  W.stats = { built: 1, disposed: 0, mutations: 0, sealed: 0, relinked: 0, rejected: 0, entered: 0, failSeal: 0 }; W.log = [];
  setCurrent(s);
  P.x = 0; P.y = 0; P.z = 0; P.vy = 0; P.speed = 0; P.pitch = 0;
  const d = s.doors.find(x => doorOpen(x));
  P.yaw = d ? Math.atan2(-(d.x - 0), -(d.z - 0)) : 0;
  maintainLinks(s, P);
}

/* ---------- sizing ---------- */
let RW = 640, RH = 360, FOVY = 72 * PI / 180;
function resize() {
  const cw = window.innerWidth, ch = window.innerHeight, asp = cw / ch;
  const rh = CFG.res === 0 ? Math.min(ch * (window.devicePixelRatio || 1), 1080) : CFG.res;
  RH = Math.round(rh); RW = Math.round(rh * asp);
  const cv = $('gl'); cv.width = RW; cv.height = RH;
  FOVY = (asp >= 1.3 ? 72 : Math.min(104, 72 * Math.pow(1.3 / asp, 0.8))) * PI / 180;
}
window.addEventListener('resize', resize);

/* ---------- input ---------- */
const stick = { id: -1, x0: 0, y0: 0, R: 60 }, look = { id: -1, x: 0, y: 0 };
let paused = true, started = false;
function bindInput() {
  const pad = $('touch'), sb = $('stick'), kn = $('knob');
  const setStick = (x, y) => {
    let dx = x - stick.x0, dy = y - stick.y0; const d = Math.hypot(dx, dy), m = Math.min(d, stick.R);
    const ux = d > 0 ? dx / d : 0, uy = d > 0 ? dy / d : 0;
    kn.style.transform = `translate(${ux * m}px,${uy * m}px)`;
    INP.mx = ux; INP.mz = -uy; INP.mag = d / stick.R;
  };
  pad.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse') { if (!document.pointerLockElement && pad.requestPointerLock) pad.requestPointerLock(); return; }
    if (paused) return;
    e.preventDefault(); pad.setPointerCapture(e.pointerId);
    if (e.clientX < window.innerWidth * 0.5 && stick.id < 0) {
      stick.id = e.pointerId; stick.R = clamp(Math.min(window.innerWidth, window.innerHeight) * 0.13, 46, 84);
      stick.x0 = e.clientX; stick.y0 = e.clientY; sb.style.display = 'block';
      sb.style.left = (e.clientX - stick.R) + 'px'; sb.style.top = (e.clientY - stick.R) + 'px';
      sb.style.width = sb.style.height = (stick.R * 2) + 'px'; kn.style.transform = 'translate(0,0)'; setStick(e.clientX, e.clientY);
    } else if (look.id < 0) { look.id = e.pointerId; look.x = e.clientX; look.y = e.clientY; }
  });
  pad.addEventListener('pointermove', (e) => {
    if (e.pointerType === 'mouse') return;
    if (e.pointerId === stick.id) { e.preventDefault(); setStick(e.clientX, e.clientY); }
    else if (e.pointerId === look.id) {
      e.preventDefault(); const dx = e.clientX - look.x, dy = e.clientY - look.y; look.x = e.clientX; look.y = e.clientY;
      P.yaw -= dx * 0.0052; P.pitch = clamp(P.pitch - dy * 0.0052, -1.45, 1.45);
    }
  });
  const up = (e) => {
    if (e.pointerId === stick.id) { stick.id = -1; INP.mx = INP.mz = INP.mag = 0; sb.style.display = 'none'; }
    else if (e.pointerId === look.id) look.id = -1;
  };
  pad.addEventListener('pointerup', up); pad.addEventListener('pointercancel', up);
  document.addEventListener('mousemove', (e) => {
    if (document.pointerLockElement === pad && !paused) { P.yaw -= e.movementX * 0.0022; P.pitch = clamp(P.pitch - e.movementY * 0.0022, -1.45, 1.45); }
  });
  window.addEventListener('keydown', (e) => {
    if (paused) return; INP.keys[e.code] = true;
    if (e.code === 'KeyF') toggleFlash();
    if (e.code === 'Tab' || e.code === 'KeyM') { e.preventDefault(); openMenu(true); }
  });
  window.addEventListener('keyup', (e) => { INP.keys[e.code] = false; });
  window.addEventListener('blur', () => { INP.keys = {}; });
  pad.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('visibilitychange', () => {
    if (!AU.ctx) return;
    if (document.hidden) AU.ctx.suspend(); else if (started && !paused) AU.ctx.resume();
  });
}
function toggleFlash() { INP.flash = !INP.flash; CFG.flash = INP.flash; $('bLight').classList.toggle('off', !INP.flash); saveCfg(); }

/* ---------- menu ---------- */
function openMenu(on) {
  $('menu').style.display = on ? 'flex' : 'none'; paused = on || !started;
  if (on) { stick.id = look.id = -1; INP.mx = INP.mz = INP.mag = 0; INP.keys = {}; $('stick').style.display = 'none'; if (document.exitPointerLock) document.exitPointerLock(); }
  if (!on) saveCfg();
}
function bindMenu() {
  const sl = (id, key) => { const el = $(id); el.value = Math.round(AU.vol[key] * 100); el.oninput = () => { AU.vol[key] = el.value / 100; audioVolumes(); }; };
  sl('vMaster', 'master'); sl('vMusic', 'music'); sl('vAtmos', 'atmos'); sl('vSfx', 'sfx');
  const res = $('selRes'); res.value = String(CFG.res); res.onchange = () => { CFG.res = parseInt(res.value, 10); resize(); saveCfg(); };
  const gr = $('chkGrain'); gr.checked = CFG.grain; gr.onchange = () => { CFG.grain = gr.checked; $('grain').style.display = CFG.grain ? 'block' : 'none'; saveCfg(); };
  const db = $('chkDebug'); db.checked = CFG.debug; db.onchange = () => { CFG.debug = db.checked; $('dbg').style.display = CFG.debug ? 'block' : 'none'; saveCfg(); };
  $('bResume').onclick = () => openMenu(false);
  $('bNew').onclick = () => { RUN.seed = (Math.random() * 4294967296) >>> 0; startWorld(); openMenu(false); };
  $('bFull').onclick = () => { goFull(); };
  $('bMenu').onclick = () => openMenu(true);
  $('bLight').onclick = () => toggleFlash();
  $('bLight').classList.toggle('off', !INP.flash);
  $('grain').style.display = CFG.grain ? 'block' : 'none'; $('dbg').style.display = CFG.debug ? 'block' : 'none';
  $('seedTxt').textContent = RUN.seed;
}
function goFull() {
  const el = document.documentElement;
  try { const p = (el.requestFullscreen || el.webkitRequestFullscreen || function () { }).call(el); if (p && p.catch) p.catch(() => { }); } catch (e) { }
  try { if (screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(() => { }); } catch (e) { }
}

/* ---------- film grain ---------- */
let grainCtx = null, grainImg = null, grainT = 0;
function initGrain() {
  const g = $('grain'); g.width = 384; g.height = 216; grainCtx = g.getContext('2d'); grainImg = grainCtx.createImageData(384, 216);
}
function drawGrain(now) {
  if (!CFG.grain || now - grainT < 70) return; grainT = now;
  const d = grainImg.data;
  for (let i = 0; i < d.length; i += 4) { const v = (Math.random() * 255) | 0; d[i] = d[i + 1] = d[i + 2] = v; d[i + 3] = 22; }
  grainCtx.putImageData(grainImg, 0, 0);
}

/* ---------- frame ---------- */
const ENV = { fog: [0.02, 0.025, 0.03], den: 0.06, flick: 1, fl: [0, 0.988, 0.9135], flCol: [1.0, 0.9, 0.74], scale: 300, time: 0 };
let tNow = 0, lastNow = 0, fpsAcc = 0, fpsN = 0, fps = 0, flashLevel = 1, dipT = 0, dipNext = 9, flashDip = 0;
function updateEnv(dt) {
  const c = W.cur, Z = c.Z, k = Math.min(1, dt * 0.9);
  const dtgt = Z.den * (c.kind === 'hall' ? 0.58 : c.kind === 'closet' ? 1.15 : 1);
  for (let i = 0; i < 3; i++) ENV.fog[i] += (Z.fog[i] - ENV.fog[i]) * k;
  ENV.den += (dtgt - ENV.den) * k;
  // lamp flicker and the occasional brown-out
  dipNext -= dt;
  if (dipNext <= 0) { dipT = 0.35 + Math.random() * 0.5; dipNext = 14 + Math.random() * 40; }
  let f = 0.97 + 0.03 * Math.sin(tNow * 9.3) * Math.sin(tNow * 3.7);
  if (dipT > 0) { dipT -= dt; f *= 0.45 + 0.55 * (Math.sin(tNow * 70) > 0 ? 1 : 0.15); flashDip = 1; } else flashDip = 0;
  ENV.flick = f;
  flashLevel += ((INP.flash ? 1 : 0) - flashLevel) * Math.min(1, dt * 8);
  ENV.fl[0] = 1.55 * flashLevel * (flashDip ? 0.35 + 0.65 * (Math.sin(tNow * 53) > 0 ? 1 : 0) : 1) * (0.96 + 0.04 * Math.sin(tNow * 31));
  ENV.time = tNow;
  ENV.scale = 0.55 * RH / (2 * Math.tan(FOVY / 2));
}
function simulate(dt) {
  updatePlayer(dt);
  maintainLinks(W.cur, P);
}
function renderFrame(dt) {
  const c = W.cur, cam = cameraMatrix(c, P, tNow), view = M4.inv(cam), proj = M4.persp(FOVY, RW / RH, 0.1, 220);
  W.planes = GLR.planes(M4.mul(proj, view));
  updateMutation(dt, [cam[12], cam[13], cam[14]]);
  updateEnv(dt);
  audioScene(W.cur, tNow);
  return GLR.draw(W.cells, view, proj, ENV);
}
function frame(now) {
  requestAnimationFrame(frame);
  if (GLR.lost) return;
  const dt = Math.min(0.05, (now - lastNow) / 1000 || 0.016); lastNow = now;
  if (!paused) { tNow += dt; simulate(dt); }
  const st = renderFrame(paused ? 0 : dt);
  drawGrain(now);
  fpsAcc += dt; fpsN++; if (fpsAcc > 0.5) { fps = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0; }
  if (CFG.debug) {
    const c = W.cur;
    $('dbg').textContent = `fps ${fps.toFixed(0)}  ${RW}x${RH}\nseed ${RUN.seed}\n${c.kind} z:${c.Z.name} dep ${c.dep}\ncells ${W.cells.length} drawn ${st.cells}/${st.drawn}\nmut ${W.stats.mutations} (seal ${W.stats.sealed} relink ${W.stats.relinked})\natmos ${AU.status.atmos} ${AU.beds.atmos ? AU.beds.atmos.mode : ''}\nmusic ${AU.status.music} ${AU.beds.music ? AU.beds.music.mode : ''}\nsteps ${AU.status.steps}\nmix ${AU.mixDb.map(v => v.toFixed(1)).join(' ')}`;
  }
}

/* ---------- boot ---------- */
async function boot() {
  try {
    GLR.init($('gl'));
    resize(); initGrain(); bindInput(); bindMenu();
    stepHook = playStep; landHook = (v) => playStep({ vel: 0.6, press: clamp(v / 9, 0.3, 1.2), mat: 'stone', side: 0, rateMul: 0.7 });
    INP.flash = CFG.flash;
    await loadTextures();
    startWorld();
    requestAnimationFrame((n) => { lastNow = n; frame(n); });
    const go = $('go'); go.textContent = 'TOUCH TO ENTER'; go.disabled = false;
    const enter = () => {
      if (started) return; started = true; paused = false;
      audioInit(); goFull(); $('title').style.display = 'none'; $('hud').style.display = 'block';
    };
    $('title').addEventListener('click', enter); $('title').addEventListener('touchend', (e) => { e.preventDefault(); enter(); }, { passive: false });
    window.DW = { W, P, INP, RUN, PERSIST, GLR, AU, CFG, ZONES, simulate, renderFrame, startWorld, switchTo, cameraMatrix, camWorldPos, resolveCell, crossingDoor, doorOpen, maintainLinks, enter, setPaused: (v) => { paused = v; }, tick: (dt) => { tNow += dt; simulate(dt); }, hash3, M4, genCell, buildCell, ensureBeyond, setCurrent, placeNew, obbOf, obbOverlap };
  } catch (e) {
    showErr('BOOT ' + e.message + '\n' + (e.stack || ''));
    const go = $('go'); if (go) go.textContent = 'FAILED: ' + e.message;
  }
}
boot();

</script>
