<style>

.sc{position:absolute;overflow:hidden;z-index:5;}
.sc::after{content:"";position:absolute;inset:0;z-index:20;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(0,0,0,0) 0px,rgba(0,0,0,0) 1px,rgba(0,0,0,0.28) 1px,rgba(0,0,0,0.28) 2px);}
.sc video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;}

#feed-zone{flex:1;position:relative;z-index:30;display:flex;flex-direction:column;align-items:center;overflow:hidden;padding:0 clamp(0.8rem,3vw,2rem);background:linear-gradient(to bottom,rgba(1,0,5,0.92) 0%,rgba(2,1,8,1) 12%,#010006 100%);border-top:1px solid rgba(105,48,6,0.1);min-height:0;}
#feed-status{display:flex;align-items:center;gap:0.7rem;width:100%;max-width:640px;padding:clamp(0.28rem,0.7vh,0.42rem) 0;border-bottom:1px solid rgba(105,48,6,0.08);flex-shrink:0;}
.sdot{width:4px;height:4px;border-radius:50%;background:rgba(165,72,10,0.5);animation:dp 2.5s ease-in-out infinite;flex-shrink:0;}
@keyframes dp{0%,100%{opacity:0.25;}50%{opacity:1;}}
.stext{font-size:clamp(0.55rem,1.4vw,0.68rem);letter-spacing:0.32em;text-transform:uppercase;color:rgba(105,52,8,0.4);}

#controls{display:flex;align-items:center;gap:0.6rem;flex-wrap:wrap;width:100%;max-width:640px;padding:clamp(0.22rem,0.55vh,0.35rem) 0;border-bottom:1px solid rgba(105,48,6,0.06);flex-shrink:0;}

<script>

var BASE='https://raw.githubusercontent.com/matronthorn/EsotericTradition/main/alley/';

// Uses the Internet Archive Advanced Search API which returns

var IA_QUERIES = {

  crime:    '(subject:"crime" OR subject:"murder" OR subject:"serial killer" OR subject:"detective" OR subject:"criminal") AND mediatype:movies AND format:MPEG4 AND -collection:TV',
  war:      '(subject:"war" OR subject:"propaganda" OR subject:"civil defense" OR subject:"military" OR subject:"atomic") AND mediatype:movies AND format:MPEG4 AND -collection:TV',
  occult:   '(subject:"witchcraft" OR subject:"horror" OR subject:"occult" OR subject:"satanism" OR subject:"supernatural") AND mediatype:movies AND format:MPEG4',
  pop:      '(subject:"music" OR subject:"jazz" OR subject:"dancing" OR subject:"musical" OR subject:"performance") AND mediatype:movies AND format:MPEG4 AND -collection:TV',
  kids:     '(subject:"children" OR subject:"educational" OR subject:"safety" OR subject:"school" OR subject:"juvenile") AND mediatype:movies AND format:MPEG4 AND collection:prelinger',
  funeral:  '(subject:"death" OR subject:"funeral" OR subject:"mourning" OR subject:"burial" OR subject:"mortality") AND mediatype:movies AND format:MPEG4',
  night:    '(subject:"nightlife" OR subject:"city" OR subject:"neon" OR subject:"nightclub" OR subject:"urban") AND mediatype:movies AND format:MPEG4 AND -collection:TV',
  medical:  '(subject:"medical" OR subject:"health" OR subject:"surgery" OR subject:"drug" OR subject:"addiction") AND mediatype:movies AND format:MPEG4',
};

// Resolved video URL pools — filled by fetchIAVideos()
var POOLS = {};
Object.keys(IA_QUERIES).forEach(function(k){ POOLS[k]=[]; });

// Screen data
var SCREENS=[
  {id:1,x1:566,y1:433,x2:729,y2:554,r:35,cat:'occult'},
  {id:2,x1:751,y1:429,x2:872,y2:522,r:5,cat:'crime'},
  {id:3,x1:917,y1:296,x2:1037,y2:381,r:33,cat:'funeral'},

  {id:13,x1:540,y1:327,x2:612,y2:381,r:14,cat:'kids'},
  {id:14,x1:662,y1:327,x2:733,y2:382,r:17,cat:'fashion'},
  {id:15,x1:543,y1:114,x2:613,y2:169,r:26,cat:'funeral'},
  {id:16,x1:940,y1:462,x2:1010,y2:512,r:12,cat:'crime'},
  {id:17,x1:765,y1:228,x2:834,y2:279,r:14,cat:'war'},

  {id:34,x1:559,y1:188,x2:602,y2:230,r:2,cat:'war'},
  {id:35,x1:320,y1:214,x2:361,y2:256,r:8,cat:'occult'},
  {id:36,x1:858,y1:87,x2:904,y2:125,r:20,cat:'night'},
  {id:37,x1:720,y1:45,x2:767,y2:81,r:19,cat:'pop'},

];
var SRC_W=1280,SRC_H=720;
var STARTED=false,_myVids=[],_screenEls={},_musicOn=true,_rainOn=true,_rdrops=[],_rctx=null;

// ════════════════════════════════════════════════════════════
// FETCH REAL VIDEO URLS FROM ARCHIVE.ORG SEARCH API
// Uses the advanced search JSON endpoint — returns real item
// identifiers, then fetches each item's file list for real URLs
// ════════════════════════════════════════════════════════════
async function fetchIAVideos() {
  var cats = Object.keys(IA_QUERIES);
  // Fetch all categories in parallel
  await Promise.all(cats.map(function(cat){ return fetchCat(cat); }));
}

async function fetchCat(cat) {
  try {
    var q = encodeURIComponent(IA_QUERIES[cat]);
    var url = 'https://archive.org/advancedsearch.php?q='+q+
      '&fl[]=identifier&rows=12&start='+Math.floor(Math.random()*40)+
      '&sort[]=random&output=json';
    var resp = await fetch(url);
    if(!resp.ok) return;
    var data = await resp.json();
    var docs = (data.response && data.response.docs) || [];
    // For each identifier, get the actual mp4 download URL
    await Promise.all(docs.slice(0,8).map(function(doc){
      return fetchFileURL(doc.identifier, cat);
    }));
  } catch(e) {}
}

async function fetchFileURL(identifier, cat) {
  try {
    var url = 'https://archive.org/metadata/'+identifier+'/files';
    var resp = await fetch(url);
    if(!resp.ok) return;
    var data = await resp.json();
    var files = (data.result || []);
    // Prefer 512kb mp4 (small), fall back to any mp4
    var mp4 = files.find(function(f){ return f.name && f.name.endsWith('_512kb.mp4'); }) ||
               files.find(function(f){ return f.name && f.name.endsWith('.ia.mp4'); }) ||
               files.find(function(f){ return f.name && f.name.endsWith('.mp4') && !f.name.includes('thumb'); });
    if(mp4) {
      POOLS[cat].push('https://archive.org/download/'+identifier+'/'+encodeURIComponent(mp4.name));
    }
  } catch(e) {}
}

function pickSrc(cat, forceOwn) {
  if(forceOwn || _myVids.length===0 || (POOLS[cat].length===0 && Math.random()<0.5)) {
    return _myVids.length ? _myVids[Math.floor(Math.random()*_myVids.length)] : null;
  }
  var pool = POOLS[cat].length ? POOLS[cat] : _myVids;
  return pool[Math.floor(Math.random()*pool.length)];
}

// ════════════════════════════════════════════════════════════
// FETCH MY GITHUB VIDEOS
// ════════════════════════════════════════════════════════════
async function fetchMyVideos() {
  try {
    var resp = await fetch('https://api.github.com/repos/'+REPO+'/contents/'+FOLDER+'?ref='+BRANCH);
    if(!resp.ok) throw 0;
    var files = await resp.json();
    _myVids = files
      .filter(function(f){ return f.name.toLowerCase().endsWith('.mp4'); })
      .map(function(f){ return f.download_url; });
  } catch(e) {
    _myVids = [BASE+'vid1.mp4',BASE+'vid2.mp4',BASE+'vid3.mp4'];
  }
  if(!_myVids.length) _myVids=[BASE+'vid1.mp4',BASE+'vid2.mp4',BASE+'vid3.mp4'];
}

// ════════════════════════════════════════════════════════════
// ENTRY
// ════════════════════════════════════════════════════════════
function enterAlley(){
  if(STARTED)return; STARTED=true;
  var gate=document.getElementById('gate');
  gate.style.opacity='0'; gate.style.pointerEvents='none';
  setTimeout(function(){
    gate.style.display='none';
    document.getElementById('scene').style.display='flex';
    document.getElementById('bg-img').src=BG_SRC;
    document.getElementById('hw-img').src=HW_SRC;
    // Fetch videos and GitHub files in parallel, then build screens
    Promise.all([fetchMyVideos(), fetchIAVideos()]).then(function(){
      buildScreens();
      positionScreens();
      var dbt; window.addEventListener('resize',function(){clearTimeout(dbt);dbt=setTimeout(positionScreens,150);});
      setTimeout(function(){setInterval(reshuffleScreens,35000+Math.random()*25000);},35000);
    });
    initRain(); initMusic(); initFeed(); startClock();
  },2500);
}

// ════════════════════════════════════════════════════════════
// BUILD SCREENS
// ════════════════════════════════════════════════════════════
function makeVidEl(src) {
  if(!src) return null;
  var v=document.createElement('video');
  v.loop=true; v.muted=true; v.playsinline=true;
  v.setAttribute('playsinline',''); v.preload='auto'; v.src=src;
  v.addEventListener('canplay',function(){
    try{if(v.duration>5)v.currentTime=Math.random()*Math.min(v.duration*0.5,60);}catch(e){}
    v.play().catch(function(){});
  },{once:true});
  v.addEventListener('error',function(){
    // On any error, swap to one of your own videos
    if(_myVids.length){v.src=_myVids[Math.floor(Math.random()*_myVids.length)];v.load();}
  });
  v.load(); return v;
}

function buildScreens(){
  var tz=document.getElementById('tv-zone');
  var hw=document.getElementById('hw-img');
  SCREENS.forEach(function(s,i){
    var div=document.createElement('div');
    div.className='sc'; div.id='sc'+s.id; div.dataset.cat=s.cat;
    var useOwn=(i%4===0);
    var src=pickSrc(s.cat, useOwn);
    var v=makeVidEl(src);
    if(v) div.appendChild(v);
    tz.insertBefore(div, hw);
    _screenEls[s.id]=div;
  });
}

function positionScreens(){
  var tz=document.getElementById('tv-zone');
  var W=tz.offsetWidth,H=tz.offsetHeight; if(!W||!H)return;
  var sx=W/SRC_W,sy=H/SRC_H;
  SCREENS.forEach(function(s){
    var el=_screenEls[s.id]; if(!el)return;
    var x=s.x1*sx,y=s.y1*sy,w=(s.x2-s.x1)*sx,h=(s.y2-s.y1)*sy;
    el.style.left=x+'px'; el.style.top=y+'px';
    el.style.width=w+'px'; el.style.height=h+'px';
    el.style.borderRadius=((s.r/100)*Math.min(w,h))+'px';
  });
}

function reshuffleScreens(){
  var n=6+Math.floor(Math.random()*5);
  SCREENS.slice().sort(function(){return Math.random()-0.5;}).slice(0,n).forEach(function(s){
    var el=_screenEls[s.id]; if(!el)return;
    while(el.firstChild)el.removeChild(el.firstChild);
    var src=pickSrc(s.cat, Math.random()<0.25);
    var v=makeVidEl(src);
    if(v) el.appendChild(v);
  });
}

// ════════════════════════════════════════════════════════════
// RAIN
// ════════════════════════════════════════════════════════════
function initRain(){
  var c=document.getElementById('rain-canvas'),tz=document.getElementById('tv-zone');
  c.width=tz.offsetWidth||320; c.height=tz.offsetHeight||240; _rctx=c.getContext('2d');
  window.addEventListener('resize',function(){c.width=tz.offsetWidth||320;c.height=tz.offsetHeight||240;spawnRain();});
  spawnRain();
  var lt=0;
  (function loop(t){var dt=lt?Math.min(t-lt,80):16;lt=t;
    if(_rainOn&&c.width&&c.height){_rctx.clearRect(0,0,c.width,c.height);var step=dt/16;
      _rdrops.forEach(function(d){_rctx.beginPath();_rctx.moveTo(d.x,d.y);_rctx.lineTo(d.x-d.len*0.1,d.y+d.len);
        _rctx.strokeStyle='rgba(155,180,205,'+d.op+')';_rctx.lineWidth=d.wd;_rctx.stroke();
        d.y+=d.spd*step;d.x-=d.spd*step*0.05;
        if(d.y>c.height+d.len){d.y=-d.len;d.x=Math.random()*c.width;}});}
    requestAnimationFrame(loop);})(0);
}
function spawnRain(){var c=document.getElementById('rain-canvas');_rdrops=[];
  for(var i=0;i<130;i++)_rdrops.push({x:Math.random()*c.width,y:Math.random()*c.height,len:9+Math.random()*20,spd:4+Math.random()*11,op:0.05+Math.random()*0.18,wd:0.45+Math.random()*0.75});}
function toggleRain(){_rainOn=!_rainOn;document.getElementById('rain-btn').classList.toggle('on',_rainOn);
  if(!_rainOn){var c=document.getElementById('rain-canvas');if(_rctx)_rctx.clearRect(0,0,c.width,c.height);}}

// ════════════════════════════════════════════════════════════
// MUSIC
// ════════════════════════════════════════════════════════════
