<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>THE ALLEY</title>
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Courier+Prime:ital@0;1&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;background:#010006;overflow:hidden;font-family:"Courier Prime",monospace;-webkit-text-size-adjust:100%;touch-action:manipulation;}
/* GATE */
#gate{position:fixed;inset:0;z-index:500;background:#010006;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(0.9rem,2.2vh,1.6rem);cursor:pointer;transition:opacity 2.5s ease;}
.gate-rule{width:min(220px,55vw);height:1px;background:linear-gradient(to right,transparent,rgba(165,72,10,0.28),transparent);}
.gate-title{font-family:"IM Fell English",Georgia,serif;font-size:clamp(1.1rem,4vw,1.5rem);letter-spacing:0.5em;text-transform:uppercase;color:rgba(165,82,10,0.4);font-style:italic;}
.gate-sub{font-size:clamp(0.6rem,1.8vw,0.78rem);letter-spacing:0.35em;text-transform:uppercase;color:rgba(105,52,8,0.28);text-align:center;line-height:2.3;}
.gate-enter{font-size:clamp(0.55rem,1.5vw,0.7rem);letter-spacing:0.5em;text-transform:uppercase;color:rgba(92,46,8,0.3);border:1px solid rgba(125,58,8,0.12);padding:0.6rem 1.5rem;margin-top:0.5rem;animation:gb 3s ease-in-out infinite;}
@keyframes gb{0%,100%{opacity:0.35;}50%{opacity:1;}}
/* SCENE */
#scene{position:fixed;inset:0;z-index:1;display:none;flex-direction:column;}
#tv-zone{position:relative;flex:0 0 auto;height:60vh;overflow:hidden;background:#000;}
@media(orientation:landscape){#tv-zone{height:72vh;}}
@media(min-width:900px){#tv-zone{height:74vh;}}
#compositor{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:10;}
#rain-canvas{position:absolute;inset:0;width:100%;height:100%;z-index:20;pointer-events:none;}
/* Video pool — must be in the document and have real dimensions for drawImage to work.
   Positioned off-screen but NOT display:none or visibility:hidden, and NOT inside
   an element that is display:none. opacity:0 is fine. */
#vpool{position:fixed;top:-3000px;left:0;width:320px;height:240px;overflow:hidden;opacity:0.001;pointer-events:none;z-index:-1;}
#vpool video{position:absolute;top:0;left:0;width:320px;height:240px;}
/* FEED ZONE */
#feed-zone{flex:1;position:relative;z-index:30;display:flex;flex-direction:column;align-items:center;overflow:hidden;padding:0 clamp(0.8rem,3vw,2rem);background:linear-gradient(to bottom,rgba(1,0,5,0.92) 0%,rgba(2,1,8,1) 12%,#010006 100%);border-top:1px solid rgba(105,48,6,0.1);min-height:0;}
#feed-status{display:flex;align-items:center;gap:0.7rem;width:100%;max-width:640px;padding:clamp(0.28rem,0.7vh,0.42rem) 0;border-bottom:1px solid rgba(105,48,6,0.08);flex-shrink:0;}
.sdot{width:4px;height:4px;border-radius:50%;background:rgba(165,72,10,0.5);animation:dp 2.5s ease-in-out infinite;flex-shrink:0;}
@keyframes dp{0%,100%{opacity:0.25;}50%{opacity:1;}}
.stext{font-size:clamp(0.55rem,1.4vw,0.68rem);letter-spacing:0.32em;text-transform:uppercase;color:rgba(105,52,8,0.4);}
.stime{margin-left:auto;font-size:clamp(0.5rem,1.1vw,0.62rem);letter-spacing:0.25em;color:rgba(82,40,6,0.28);}
#controls{display:flex;align-items:center;gap:0.6rem;flex-wrap:wrap;width:100%;max-width:640px;padding:clamp(0.22rem,0.55vh,0.35rem) 0;border-bottom:1px solid rgba(105,48,6,0.06);flex-shrink:0;}
.ctrl{font-family:"Courier Prime",monospace;font-size:clamp(0.55rem,1.3vw,0.65rem);letter-spacing:0.3em;text-transform:uppercase;color:rgba(95,48,8,0.38);background:transparent;border:1px solid rgba(105,48,6,0.12);padding:0.28rem 0.7rem;cursor:pointer;transition:all 0.35s;white-space:nowrap;-webkit-tap-highlight-color:transparent;}
.ctrl.on{color:rgba(215,125,28,0.78);border-color:rgba(165,78,10,0.3);background:rgba(75,28,5,0.25);}
#feed-track{flex:1;width:100%;max-width:640px;position:relative;overflow:hidden;min-height:0;}
#feed-inner{position:absolute;bottom:0;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:0;}
.tx-block{width:100%;padding:clamp(0.55rem,1.4vh,0.95rem) 0;border-top:1px solid rgba(105,48,6,0.07);display:flex;flex-direction:column;align-items:center;gap:0.32rem;opacity:0;transform:translateY(8px);transition:opacity 1.8s ease,transform 1.8s ease;}
.tx-block.vis{opacity:1;transform:translateY(0);}
.tx-src{font-size:clamp(0.5rem,1.1vw,0.62rem);letter-spacing:0.42em;text-transform:uppercase;color:rgba(100,50,8,0.32);}
.tx-text{font-family:"IM Fell English",Georgia,serif;font-size:clamp(0.8rem,1.9vw,1.02rem);line-height:1.88;color:rgba(196,180,154,0.65);font-style:italic;text-align:center;letter-spacing:0.02em;max-width:520px;}
.tx-text .redact{color:rgba(90,48,10,0.35);}
.tx-meta{font-size:clamp(0.46rem,1vw,0.56rem);letter-spacing:0.32em;color:rgba(80,40,6,0.25);}
#tx-loading{font-size:clamp(0.52rem,1.2vw,0.64rem);letter-spacing:0.42em;text-transform:uppercase;color:rgba(125,62,10,0.28);padding:0.8rem 0;animation:lp 2s ease-in-out infinite;}
@keyframes lp{0%,100%{opacity:0.2;}50%{opacity:0.72;}}
</style>
</head>
<body>

<div id="gate" onclick="enterAlley()">
  <div class="gate-rule"></div>
  <div class="gate-title">The Alley</div>
  <div class="gate-rule"></div>
  <div class="gate-sub">Parish of Esoteric Tradition<br>A Place of Forsaking</div>
  <div class="gate-enter">Enter</div>
</div>

<div id="scene">
  <div id="tv-zone">
    <canvas id="compositor"></canvas>

  </div>

      <div class="sdot"></div>
      <span class="stext" id="tx-count">signal receiving</span>

    <div id="controls">
      <button class="ctrl on" id="music-btn" onclick="toggleMusic()">&#9834; Music</button>
      <button class="ctrl on" id="rain-btn"  onclick="toggleRain()">&#8776; Rain</button>
      <button class="ctrl on" id="noise-btn" onclick="toggleNoise()">&#9618; Noise</button>
    </div>
    <div id="feed-track">
      <div id="feed-inner">
        <div id="tx-loading">receiving transmission</div>
      </div>
    </div>
  </div>
</div>

     opacity:0.001 keeps it invisible but rendered — critical for drawImage. -->
<div id="vpool"></div>

  {id:16, x1:940,y1:462,x2:1010,y2:512,r:12,cat:'truecrime'},
  {id:17, x1:765,y1:228,x2:834,y2:279, r:14,cat:'political'},
  {id:18, x1:440,y1:336,x2:508,y2:387, r:15,cat:'occult'},
  {id:19, x1:637,y1:236,x2:703,y2:287, r:6, cat:'fashion'},

  {id:36, x1:858,y1:87, x2:904,y2:125, r:20,cat:'political'},
  {id:37, x1:720,y1:45, x2:767,y2:81,  r:19,cat:'fashion'},
  {id:38, x1:635,y1:109,x2:683,y2:145, r:20,cat:'truecrime'},
  {id:39, x1:784,y1:87, x2:829,y2:125, r:21,cat:'kids'},
  {id:40, x1:556,y1:49, x2:599,y2:89,  r:19,cat:'death'},
  {id:41, x1:1052,y1:181,x2:1097,y2:217,r:21,cat:'occult'},

  {id:43, x1:476,y1:141,x2:520,y2:175, r:15,cat:'political'},
  {id:44, x1:411,y1:141,x2:453,y2:175, r:17,cat:'truecrime'},
  {id:45, x1:257,y1:315,x2:276,y2:384, r:10,cat:'kids'},
];
var SRC_W=1280, SRC_H=720;

// ════════════════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════════════════
var STARTED   = false;
var _bgImg    = null;   // background image
var _hwImg    = null;   // hardware overlay (transparent where screens are)
var _vids     = {};     // screenId -> <video> element
var _frame    = 0;
var _noiseOn  = true;
var _musicOn  = true;
var _rainOn   = true;
var _rdrops   = [];
var _rctx     = null;
var _noiseC   = document.createElement('canvas');
var _noiseX   = _noiseC.getContext('2d');

// ════════════════════════════════════════════════════════════
// ENTRY
// ════════════════════════════════════════════════════════════
function enterAlley() {
  if (STARTED) return;
  STARTED = true;
  var gate = document.getElementById('gate');
  gate.style.opacity = '0';
  gate.style.pointerEvents = 'none';

  setTimeout(function() {
    gate.style.display = 'none';

    // Show scene FIRST so elements have real dimensions
    var scene = document.getElementById('scene');
    scene.style.display = 'flex';

    // Now size canvases (scene is visible so offsetWidth is real)
    sizeCanvases();
    var dbt;
    window.addEventListener('resize', function() {
      clearTimeout(dbt);
      dbt = setTimeout(sizeCanvases, 150);
    });

    // Load images in parallel
    var loaded = 0;
    function chk() { if (++loaded >= 2) beginCompositor(); }
    _bgImg = new Image();
    _bgImg.crossOrigin = 'anonymous'; // raw.githubusercontent.com sends CORS headers
    _bgImg.onload = chk; _bgImg.onerror = chk;
    _bgImg.src = BG_SRC;

    _hwImg = new Image();
    _hwImg.crossOrigin = 'anonymous';
    _hwImg.onload = chk; _hwImg.onerror = chk;
    _hwImg.src = HW_SRC;

    // Safety: start even if images fail
    setTimeout(function() { if (loaded < 2) { loaded = 2; beginCompositor(); } }, 5000);

    // Start everything that doesn't depend on images immediately
    loadVideos();
    initRain();
    initMusic();
    initFeed();
    startClock();

  }, 2500);
}

function sizeCanvases() {
  var tz = document.getElementById('tv-zone');
  var w = tz.offsetWidth, h = tz.offsetHeight;
  if (!w || !h) return;
  var c = document.getElementById('compositor');
  c.width = w; c.height = h;
  var r = document.getElementById('rain-canvas');
  r.width = w; r.height = h;
  _noiseC.width = w; _noiseC.height = h;
  // Respawn rain drops for new dimensions
  spawnRain(w, h);
}

function beginCompositor() {
  requestAnimationFrame(compositorFrame);
}

// ════════════════════════════════════════════════════════════
// VIDEO LOADING
// Key fixes:
// 1. #vpool element exists outside #scene so it's always rendered
// 2. No crossOrigin on <video> — video draws fine to canvas without it.
//    (crossOrigin is only needed when you want to READ pixel data back,
//     which we don't. We only write to the canvas with drawImage.)
// 3. Videos are appended to #vpool which has real dimensions
// ════════════════════════════════════════════════════════════
function pickVideoSrc(cat) {
  // 60% chance: use one of your 3 uploaded videos (guaranteed to exist)
  // 40% chance: use archive.org category-specific video
  if (Math.random() < 0.6 || !ARCHIVE[cat] || !ARCHIVE[cat].length) {
    return MY_VIDS[Math.floor(Math.random() * MY_VIDS.length)];
  }
  var srcs = ARCHIVE[cat];
  return srcs[Math.floor(Math.random() * srcs.length)];
}

function makeVideo(src) {
  var v = document.createElement('video');
  // NO crossOrigin attribute — not needed for canvas drawImage (write-only)
  v.loop = true;
  v.muted = true;
  v.playsinline = true;
  v.setAttribute('playsinline', '');
  v.preload = 'auto';
  v.src = src;
  document.getElementById('vpool').appendChild(v);
  v.addEventListener('canplay', function() {
    // Seek to random offset so screens aren't all in sync
    if (v.duration > 1) {
      try { v.currentTime = Math.random() * Math.min(v.duration * 0.7, 120); } catch(e) {}
    }
    v.play().catch(function() {});
  }, { once: true });
  v.load();
  return v;
}

function loadVideos() {
  SCREENS.forEach(function(s) {
    _vids[s.id] = makeVideo(pickVideoSrc(s.cat));
  });
  // Reshuffle some screens every 30-50 seconds
  setInterval(reshuffleVideos, 30000 + Math.random() * 20000);
}

function reshuffleVideos() {
  // Pick 5-10 random screens and swap their video source
  var count = 5 + Math.floor(Math.random() * 6);
  var shuffled = SCREENS.slice().sort(function() { return Math.random() - 0.5; }).slice(0, count);
  shuffled.forEach(function(s) {
    var old = _vids[s.id];
    if (old) { old.pause(); old.remove(); }
    _vids[s.id] = makeVideo(pickVideoSrc(s.cat));
  });
}

// ════════════════════════════════════════════════════════════
// COMPOSITOR FRAME — the main render loop
// Layer order each frame:
//   1. Background image (dark filtered)
//   2. Each screen: video frame clipped to screen bounds + border-radius
//   3. Hardware overlay (TV chassis, transparent where screens are)
//   4. Scanlines
//   5. Film grain noise (every 3rd frame)
//   6. Vignette
// ════════════════════════════════════════════════════════════
function compositorFrame() {
  _frame++;
  var c   = document.getElementById('compositor');
  var ctx = c.getContext('2d');
  var W = c.width, H = c.height;
  if (!W || !H) { requestAnimationFrame(compositorFrame); return; }

  var sx = W / SRC_W, sy = H / SRC_H;

  // ── 1. Background ──
  // ctx.filter is unreliable on Android — use manual overlay approach instead
  if (_bgImg && _bgImg.complete && _bgImg.naturalWidth) {
    ctx.drawImage(_bgImg, 0, 0, W, H);
    // Dark overlay to replicate brightness(0.28)
    ctx.fillStyle = 'rgba(0,0,0,0.76)';
    ctx.fillRect(0, 0, W, H);
    // Slight blue/cool tint overlay to replicate hue-rotate + desaturate
    ctx.fillStyle = 'rgba(5,3,18,0.22)';
    ctx.fillRect(0, 0, W, H);
  } else {
    ctx.fillStyle = '#010006';
    ctx.fillRect(0, 0, W, H);
  }

  // ── 2. Video screens ──
  SCREENS.forEach(function(s) {
    var v = _vids[s.id];
    if (!v || v.readyState < 2) return; // not ready yet — skip, shows bg

    var dx = s.x1 * sx,  dy = s.y1 * sy;
    var dw = (s.x2 - s.x1) * sx, dh = (s.y2 - s.y1) * sy;
    var minD = Math.min(dw, dh);
    var rad  = (s.r / 100) * minD;

    ctx.save();
    rrect(ctx, dx, dy, dw, dh, rad);
    ctx.clip();

    // Slight brightness boost on the video so it glows against the dark bg
    // Can't use ctx.filter reliably — use globalAlpha + overlay approach
    ctx.drawImage(v, dx, dy, dw, dh);

    // Subtle screen glow: warm amber bloom
    var glow = ctx.createRadialGradient(dx+dw/2,dy+dh/2,0, dx+dw/2,dy+dh/2, Math.max(dw,dh)*0.6);
    glow.addColorStop(0, 'rgba(255,200,100,0.0)');
    glow.addColorStop(1, 'rgba(0,0,0,0.35)');
    ctx.fillStyle = glow;
    ctx.fillRect(dx, dy, dw, dh);

    ctx.restore();
  });

  // ── 3. Hardware overlay ──
  if (_hwImg && _hwImg.complete && _hwImg.naturalWidth) {
    ctx.drawImage(_hwImg, 0, 0, W, H);
    // Dark overlay on the hardware (not the screens, they're transparent in hw.png)
    ctx.fillStyle = 'rgba(0,0,0,0.72)';
    ctx.globalCompositeOperation = 'source-atop'; // only darkens opaque pixels
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';
    // Cool tint
    ctx.fillStyle = 'rgba(5,3,18,0.18)';
    ctx.globalCompositeOperation = 'source-atop';
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';
  }

  // ── 4. Scanlines ──
  ctx.fillStyle = 'rgba(0,0,0,0.14)';
  for (var y = 0; y < H; y += 3) ctx.fillRect(0, y+2, W, 1);

  // ── 5. Film grain noise (every 3rd frame) ──
  if (_noiseOn && _frame % 3 === 0) {
    var img = _noiseX.createImageData(W, H), d = img.data;
    for (var i = 0; i < d.length; i += 4) {
      var nv = Math.random() * 255 | 0;
      d[i] = d[i+1] = d[i+2] = nv;
      d[i+3] = 14;
    }
    _noiseX.putImageData(img, 0, 0);
    ctx.globalCompositeOperation = 'overlay';
    ctx.drawImage(_noiseC, 0, 0);
    ctx.globalCompositeOperation = 'source-over';
  }

  // ── 6. Vignette ──
  var vg = ctx.createRadialGradient(W/2,H/2,H*0.2, W/2,H/2,H*0.9);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.6)');
  ctx.fillStyle = vg;
  ctx.fillRect(0, 0, W, H);

  requestAnimationFrame(compositorFrame);
}

// Rounded rect clipping path
function rrect(ctx, x, y, w, h, r) {
  r = Math.max(0, Math.min(r, w/2, h/2));
  ctx.beginPath();
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y); ctx.arcTo(x+w, y, x+w, y+r, r);
  ctx.lineTo(x+w, y+h-r); ctx.arcTo(x+w, y+h, x+w-r, y+h, r);
  ctx.lineTo(x+r, y+h); ctx.arcTo(x, y+h, x, y+h-r, r);
  ctx.lineTo(x, y+r); ctx.arcTo(x, y, x+r, y, r);
  ctx.closePath();
}

// ════════════════════════════════════════════════════════════
// RAIN — procedural canvas, drawn after compositor
// ════════════════════════════════════════════════════════════
function initRain() {
  var c = document.getElementById('rain-canvas');
  _rctx = c.getContext('2d');
  var lt = 0;
  function loop(t) {
    var dt = lt ? Math.min(t - lt, 80) : 16; lt = t;
    var w = c.width, h = c.height;
    if (!_rainOn || !w || !h) { requestAnimationFrame(loop); return; }
    _rctx.clearRect(0, 0, w, h);
    var step = dt / 16;
    _rdrops.forEach(function(d) {
      _rctx.beginPath();
      _rctx.moveTo(d.x, d.y);
      _rctx.lineTo(d.x - d.len * 0.1, d.y + d.len);
      _rctx.strokeStyle = 'rgba(155,180,205,' + d.op + ')';
      _rctx.lineWidth = d.wd;
      _rctx.stroke();
      d.y += d.spd * step;
      d.x -= d.spd * step * 0.05;
      if (d.y > h + d.len) { d.y = -d.len; d.x = Math.random() * w; }
    });
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
}

function spawnRain(w, h) {
  _rdrops = [];
  for (var i = 0; i < 130; i++) {
    _rdrops.push({
      x:   Math.random() * w,
      y:   Math.random() * h,
      len: 9 + Math.random() * 20,
      spd: 4 + Math.random() * 11,
      op:  0.05 + Math.random() * 0.18,
      wd:  0.45 + Math.random() * 0.75,
    });
  }
}

function toggleRain() {
  _rainOn = !_rainOn;
  var btn = document.getElementById('rain-btn');
  btn.classList.toggle('on', _rainOn);
  if (!_rainOn) {
    var c = document.getElementById('rain-canvas');
    if (_rctx) _rctx.clearRect(0, 0, c.width, c.height);
  }
}
function toggleNoise() {
  _noiseOn = !_noiseOn;
  document.getElementById('noise-btn').classList.toggle('on', _noiseOn);
}

// ════════════════════════════════════════════════════════════
// MUSIC
// ════════════════════════════════════════════════════════════
function initMusic() {
  var a = document.getElementById('music');
  a.src = MUSIC_SRC; a.loop = true; a.volume = 0.62;
  // Play is triggered by gate click (user gesture) so autoplay should work
  a.play().catch(function() {
    _musicOn = false;
    document.getElementById('music-btn').classList.remove('on');
  });
}
function toggleMusic() {
  var a = document.getElementById('music'), btn = document.getElementById('music-btn');
  _musicOn = !_musicOn;
  if (_musicOn) { a.play().catch(function(){}); btn.classList.add('on'); }
  else { a.pause(); btn.classList.remove('on'); }
}
window.addEventListener('pagehide', function() { document.getElementById('music').pause(); });
document.addEventListener('visibilitychange', function() {
  var a = document.getElementById('music');
  if (document.hidden) a.pause();
  else if (_musicOn && STARTED) a.play().catch(function(){});
});
// Called by parent site's closeInstallation() to kill music instantly
window.stopAlley = function() {
  document.getElementById('music').pause();
  STARTED = false;
};

// ════════════════════════════════════════════════════════════
// TEXT FEED — Claude API
// Generates confessional Xanga/LiveJournal 2000s-register fragments,
// departure texts, wall inscriptions. Infinite, auto-refreshing.
// ════════════════════════════════════════════════════════════
var SEEDS = [
  'i dont know how to explain it but im just so tired. not sleepy tired. tired of being in my body.',
  'nobody knows what today was. i just smiled and went through it.',
  'sometimes i think about just disappearing. not dying. just not being here anymore.',
  'mom asked if i was okay and i said yes and she believed me.',
  'three days without talking to anyone real.',
  'the weird thing about being invisible is that you still have to show up.',
  'i wrote something real here once and then deleted it. i do that a lot.',
  'i have this recurring thought that i walked into the wrong life.',
  'the only person who ever really knew me moved away.',
  'everyone else seems to know what theyre doing. maybe they feel this too.',
  'i read back my entries from a year ago. i was the same person saying the same things.',
];

var PTYPES = [
  {
    lbl: 'transmission received \u2014 [yr]',
    p: function() {
      var s = SEEDS[Math.floor(Math.random() * SEEDS.length)];
      return 'Generate one confessional blog fragment in early 2000s Xanga/LiveJournal register. Lowercase, 2-5 sentences. Isolated writer in ongoing malaise, not acute crisis. Style ref (do not reproduce): "' + s + '". Fragment text only, no preamble, no quotation marks.';
    }
  },
  {
    lbl: 'fragment \u2014 origin unverified',
    p: function() {
      return 'Generate 2-4 sentences like the beginning of a goodbye never finished. Abstract, poetic, no names, no method. The texture of someone at the end of something. Lowercase. Text only, no preamble.';
    }
  },
  {
    lbl: 'inscription \u2014 surface unknown \u2014 undated',
    p: function() {
      return 'Generate 1-3 sentences as if found written on a wall in a dark place. Something left behind. Cryptic, specific in feeling, anonymous. Lowercase. Text only.';
    }
  },
  {
    lbl: 'archive recovered \u2014 platform defunct',
    p: function() {
      var s = SEEDS[Math.floor(Math.random() * SEEDS.length)];
      return 'Generate a blog fragment from someone profoundly unseen. Surrounded by people, invisible. Early 2000s register, lowercase, 3-5 sentences. Style ref (do not reproduce): "' + s + '". No names. Text only.';
    }
  },
];

function makeTimestamp() {
  var mm = ['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
  return mm[Math.floor(Math.random()*12)] + ' ' + (1 + Math.floor(Math.random()*28)) +
    ', ' + (2001 + Math.floor(Math.random()*8)) + ' \u00b7 ' +
    Math.floor(Math.random()*24) + ':' + String(Math.floor(Math.random()*60)).padStart(2,'0');
}

function obfuscate(t) {
  return t.replace(/\b[A-Z][a-z]{2,}\b/g, function(m) {
    var ok = /^(The|And|But|For|Not|When|What|This|That|From|With|Have|They|Were|Been|Into|Your|Some|Would|Could|Should|There|Their|About|Which|These|Those|After|Under|Never|Every|Other|Before|Between|Through|Without)$/;
    if (ok.test(m)) return m;
    return '<span class="redact">' + m[0] + m.slice(1).replace(/[a-z]/g, '\u2591') + '</span>';
  });
}

var _txTotal = 0, _txQ = [], _txGen = false;

async function genTx() {
  var pt = PTYPES[Math.floor(Math.random() * PTYPES.length)];
  try {
    var resp = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 200,
        system: 'You generate short literary text fragments for an art installation. Never generate anything actionable. Emotional texture only. Fragment text only, no preamble, no quotation marks.',
        messages: [{ role: 'user', content: pt.p() }]
      })
    });
    if (!resp.ok) throw new Error(resp.status);
    var data = await resp.json();
    var text = (data.content && data.content[0] && data.content[0].text || '').trim();
    // Fixed regex: strip leading/trailing quotes
    text = text.replace(/^["']/, '').replace(/["']$/, '');
    if (text.length < 20) return null;
    return { text: text, lbl: pt.lbl.replace('[yr]', String(2001 + Math.floor(Math.random()*8))), ts: makeTimestamp() };
  } catch(e) { return null; }
}

async function genLoop() {
  if (_txGen) return;
  _txGen = true;
  while (_txQ.length < 3) {
    var tx = await genTx();
    if (tx) _txQ.push(tx);
    else await sleep(3000);
  }
  _txGen = false;
}

function addTx(tx) {
  var inner = document.getElementById('feed-inner');
  var load  = document.getElementById('tx-loading');
  if (load) load.style.display = 'none';

  var b = document.createElement('div');
  b.className = 'tx-block';
  b.innerHTML = '<div class="tx-src">' + tx.lbl + '</div>' +
                '<div class="tx-text">' + obfuscate(tx.text) + '</div>' +
                '<div class="tx-meta">' + tx.ts + '</div>';
  inner.appendChild(b);
  requestAnimationFrame(function() {
    requestAnimationFrame(function() { b.classList.add('vis'); });
  });

  _txTotal++;
  var cnt = document.getElementById('tx-count');
  if (cnt) cnt.textContent = 'transmissions received: ' + _txTotal;

  // Keep at most 5 blocks visible; fade out the oldest
  var blocks = inner.querySelectorAll('.tx-block');
  if (blocks.length > 5) {
    var old = blocks[0];
    old.style.transition = 'opacity 0.8s';
    old.style.opacity = '0';
    setTimeout(function() { if (old.parentNode) old.parentNode.removeChild(old); }, 800);
  }
}

function dispTx() {
  if (_txQ.length > 0) { addTx(_txQ.shift()); genLoop(); }
  else { genTx().then(function(tx) { if (tx) addTx(tx); }); }
}

function initFeed() {
  genLoop();
  setTimeout(dispTx, 4000);
  setInterval(dispTx, 22000 + Math.random() * 10000);
}

// ════════════════════════════════════════════════════════════
// CLOCK + UTILS
// ════════════════════════════════════════════════════════════
function startClock() {
  function tick() {
    var el = document.getElementById('stime');
    if (el) el.textContent = new Date().toLocaleTimeString('en-US', {hour:'2-digit',minute:'2-digit',second:'2-digit'});
  }
  tick();
  setInterval(tick, 1000);
}
function sleep(ms) { return new Promise(function(r) { setTimeout(r, ms); }); }

startClock();
</script>
