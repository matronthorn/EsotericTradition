.sdot{width:4px;height:4px;border-radius:50%;background:rgba(165,72,10,0.5);animation:dp 2.5s ease-in-out infinite;flex-shrink:0;}
@keyframes dp{0%,100%{opacity:0.25;}50%{opacity:1;}}

#controls{display:flex;align-items:center;gap:0.6rem;flex-wrap:wrap;width:100%;max-width:640px;padding:clamp(0.22rem,0.55vh,0.35rem) 0;border-bottom:1px solid rgba(105,48,6,0.06);flex-shrink:0;}
.ctrl{font-family:"Courier Prime",monospace;font-size:clamp(0.55rem,1.3vw,0.65rem);letter-spacing:0.3em;text-transform:uppercase;color:rgba(95,48,8,0.38);background:transparent;border:1px solid rgba(105,48,6,0.12);padding:0.28rem 0.7rem;cursor:pointer;transition:all 0.35s;white-space:nowrap;-webkit-tap-highlight-color:transparent;}
.ctrl.on{color:rgba(215,125,28,0.78);border-color:rgba(165,78,10,0.3);background:rgba(75,28,5,0.25);}
#feed-track{flex:1;width:100%;max-width:640px;position:relative;overflow:hidden;min-height:0;}
#feed-inner{position:absolute;bottom:0;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:0;}
.tx-block{width:100%;padding:clamp(0.55rem,1.4vh,0.95rem) 0;border-top:1px solid rgba(105,48,6,0.07);display:flex;flex-direction:column;align-items:center;gap:0.32rem;opacity:0;transform:translateY(8px);transition:opacity 1.8s ease,transform 1.8s ease;}
.tx-block.vis{opacity:1;transform:translateY(0);}
.tx-src{font-size:clamp(0.5rem,1.1vw,0.62rem);letter-spacing:0.42em;text-transform:uppercase;color:rgba(100,50,8,0.32);}

var SRC_W=1280,SRC_H=720;
var _bgImg=null,_hwImg=null,_vids={},_noiseOn=true,_musicOn=true,_rainOn=true;
var _rdrops=[],_rctx=null,_frame=0,STARTED=false;
var _noiseC=document.createElement('canvas');
var _noiseX=_noiseC.getContext('2d');

function enterAlley(){
  if(STARTED)return;STARTED=true;
  var g=document.getElementById('gate');
  g.style.opacity='0';g.style.pointerEvents='none';
  setTimeout(function(){
    g.style.display='none';
    document.getElementById('scene').style.display='flex';
    var loaded=0;
    function chk(){if(++loaded>=2)onReady();}
    _bgImg=new Image();_bgImg.crossOrigin='anonymous';
    _bgImg.onload=chk;_bgImg.onerror=chk;_bgImg.src=BG_SRC;
    _hwImg=new Image();_hwImg.crossOrigin='anonymous';
    _hwImg.onload=chk;_hwImg.onerror=chk;_hwImg.src=HW_SRC;
    setTimeout(function(){if(loaded<2)onReady();},4000);
  },2500);
}

function onReady(){
  sizeC();
  var dbt;window.addEventListener('resize',function(){clearTimeout(dbt);dbt=setTimeout(sizeC,150);});
  loadVids();initRain();initMusic();initFeed();startClock();
  requestAnimationFrame(frame);
}

function sizeC(){
  var tz=document.getElementById('tv-zone');
  var w=tz.offsetWidth,h=tz.offsetHeight;
  var c=document.getElementById('compositor');c.width=w;c.height=h;
  var r=document.getElementById('rain-canvas');r.width=w;r.height=h;
  _noiseC.width=w;_noiseC.height=h;
  spawnRain();
}

function loadVids(){
  var pool=document.getElementById('video-pool');
  SCREENS.forEach(function(s){
    var srcs=VIDEOS[s.cat];if(!srcs||!srcs.length)return;
    var url=srcs[Math.floor(Math.random()*srcs.length)];
    var v=document.createElement('video');
    v.crossOrigin='anonymous';v.loop=true;v.muted=true;
    v.playsinline=true;v.setAttribute('playsinline','');v.preload='auto';
    v.dataset.off=Math.floor(Math.random()*90);v.dataset.seeked='0';
    var s1=document.createElement('source');s1.src=url;s1.type='video/mp4';
    v.appendChild(s1);pool.appendChild(v);
    v.addEventListener('canplay',function(){
      if(v.dataset.seeked==='0'&&v.duration>0){
        v.currentTime=Math.min(parseInt(v.dataset.off),v.duration*0.8);
        v.dataset.seeked='1';
      }
      v.play().catch(function(){});
    },{once:true});
    v.load();_vids[s.id]=v;
  });
  setInterval(reshuffle,35000+Math.random()*15000);
}

function reshuffle(){
  var n=4+Math.floor(Math.random()*4);
  SCREENS.slice().sort(function(){return Math.random()-0.5;}).slice(0,n).forEach(function(s){
    var srcs=VIDEOS[s.cat];if(!srcs||!srcs.length)return;
    var v=_vids[s.id];if(!v)return;
    var url=srcs[Math.floor(Math.random()*srcs.length)];
    v.pause();
    var s1=v.querySelector('source');if(s1)s1.src=url;
    v.dataset.off=Math.floor(Math.random()*90);v.dataset.seeked='0';
    v.load();
  });
}

function frame(){
  _frame++;
  var c=document.getElementById('compositor');
  var ctx=c.getContext('2d');
  var W=c.width,H=c.height;
  if(!W||!H){requestAnimationFrame(frame);return;}
  var sx=W/SRC_W,sy=H/SRC_H;
  ctx.save();
  if(_bgImg&&_bgImg.complete&&_bgImg.naturalWidth){
    ctx.filter='brightness(0.28) contrast(1.5) saturate(0.35) hue-rotate(198deg)';
    ctx.drawImage(_bgImg,0,0,W,H);
    ctx.filter='none';
  }else{ctx.fillStyle='#010006';ctx.fillRect(0,0,W,H);}
  ctx.restore();
  SCREENS.forEach(function(s){
    var v=_vids[s.id];
    if(!v||v.readyState<2)return;
    var dx=s.x1*sx,dy=s.y1*sy;
    var dw=(s.x2-s.x1)*sx,dh=(s.y2-s.y1)*sy;
    var mn=Math.min(dw,dh),rad=(s.r/100)*mn;
    ctx.save();
    rrect(ctx,dx,dy,dw,dh,rad);ctx.clip();
    ctx.drawImage(v,dx,dy,dw,dh);
    ctx.restore();
  });
  if(_hwImg&&_hwImg.complete&&_hwImg.naturalWidth){
    ctx.save();
    ctx.filter='brightness(0.32) contrast(1.4) saturate(0.45) hue-rotate(195deg)';
    ctx.drawImage(_hwImg,0,0,W,H);
    ctx.filter='none';
    ctx.restore();
  }
  ctx.save();ctx.globalAlpha=0.16;ctx.fillStyle='#000';
  for(var y=0;y<H;y+=3)ctx.fillRect(0,y+2,W,1);
  ctx.restore();
  if(_noiseOn&&_frame%3===0){
    var img=_noiseX.createImageData(W,H),d=img.data;
    for(var i=0;i<d.length;i+=4){var nv=Math.random()*255|0;d[i]=d[i+1]=d[i+2]=nv;d[i+3]=16;}
    _noiseX.putImageData(img,0,0);
    ctx.save();ctx.globalCompositeOperation='overlay';ctx.drawImage(_noiseC,0,0);ctx.globalCompositeOperation='source-over';ctx.restore();
  }
  var g=ctx.createRadialGradient(W/2,H/2,H*0.25,W/2,H/2,H*0.85);
  g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,0.55)');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  requestAnimationFrame(frame);
}

function rrect(ctx,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r);ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h);ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r);ctx.arcTo(x,y,x+r,y,r);ctx.closePath();
}

function initRain(){
  var c=document.getElementById('rain-canvas');_rctx=c.getContext('2d');
  window.addEventListener('resize',function(){spawnRain();});
  var lt=0;
  function loop(t){
    if(!_rainOn){requestAnimationFrame(loop);return;}
    var dt=lt?Math.min(t-lt,80):16;lt=t;
    var w=c.width,h=c.height;_rctx.clearRect(0,0,w,h);
    var step=dt/16;
    _rdrops.forEach(function(d){
      _rctx.beginPath();_rctx.moveTo(d.x,d.y);_rctx.lineTo(d.x-d.len*0.1,d.y+d.len);
      _rctx.strokeStyle='rgba(155,180,205,'+d.op+')';_rctx.lineWidth=d.wd;_rctx.stroke();
      d.y+=d.spd*step;d.x-=d.spd*step*0.05;
      if(d.y>h+d.len){d.y=-d.len;d.x=Math.random()*w;}
    });
    requestAnimationFrame(loop);
  }requestAnimationFrame(loop);
}
function spawnRain(){var c=document.getElementById('rain-canvas'),w=c.width||320,h=c.height||240;_rdrops=[];for(var i=0;i<130;i++)_rdrops.push({x:Math.random()*w,y:Math.random()*h,len:9+Math.random()*20,spd:4+Math.random()*11,op:0.055+Math.random()*0.2,wd:0.45+Math.random()*0.75});}
function toggleRain(){_rainOn=!_rainOn;var btn=document.getElementById('rain-btn'),c=document.getElementById('rain-canvas');btn.classList.toggle('on',_rainOn);if(!_rainOn&&_rctx)_rctx.clearRect(0,0,c.width,c.height);}
function toggleNoise(){_noiseOn=!_noiseOn;document.getElementById('noise-btn').classList.toggle('on',_noiseOn);}

function initMusic(){var a=document.getElementById('music');a.src=MUSIC_SRC;a.loop=true;a.volume=0.62;a.play().catch(function(){_musicOn=false;document.getElementById('music-btn').classList.remove('on');});}
function toggleMusic(){var a=document.getElementById('music'),btn=document.getElementById('music-btn');_musicOn=!_musicOn;if(_musicOn){a.play().catch(function(){});btn.classList.add('on');}else{a.pause();btn.classList.remove('on');}}
window.addEventListener('pagehide',function(){document.getElementById('music').pause();});
document.addEventListener('visibilitychange',function(){var a=document.getElementById('music');if(document.hidden)a.pause();else if(_musicOn&&STARTED)a.play().catch(function(){});});
window.stopAlley=function(){document.getElementById('music').pause();STARTED=false;};

var SEEDS=['i dont know how to explain it but im just so tired. not sleepy tired. tired of being in my body.','nobody knows what today was. i just smiled and went through it.','sometimes i think about just disappearing. not dying. just not being here anymore.','mom asked if i was okay and i said yes and she believed me.','three days without talking to anyone real.','the weird thing about being invisible is that you still have to show up.','i wrote something real here once and then deleted it.','i have this recurring thought that i walked into the wrong life.','the only person who ever really knew me moved away.','everyone else seems to know what theyre doing.','i read back my entries from a year ago. i was the same person.'];
var PTYPES=[{lbl:'transmission received — [yr]',p:function(){var s=SEEDS[Math.floor(Math.random()*SEEDS.length)];return 'Generate one confessional blog fragment in early 2000s Xanga/LiveJournal register. Lowercase, 2-5 sentences. Isolated writer, ongoing malaise. Style ref (do not reproduce): "'+s+'". Text only, no preamble.';}},{lbl:'fragment — origin unverified',p:function(){return 'Generate 2-4 sentences like the beginning of a goodbye never finished. Abstract, poetic, no names, no method. Lowercase. Text only.';}},{lbl:'inscription — surface unknown — undated',p:function(){return 'Generate 1-3 sentences as if found on a wall in a dark place. Cryptic, anonymous. Lowercase. Text only.';}},{lbl:'archive recovered — platform defunct',p:function(){var s=SEEDS[Math.floor(Math.random()*SEEDS.length)];return 'Generate a blog fragment from someone profoundly unseen. Early 2000s, lowercase, 3-5 sentences. Style ref (do not reproduce): "'+s+'". No names. Text only.';}}];
function mts(){var mm=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];return mm[Math.floor(Math.random()*12)]+' '+(1+Math.floor(Math.random()*28))+', '+(2001+Math.floor(Math.random()*8))+' · '+Math.floor(Math.random()*24)+':'+String(Math.floor(Math.random()*60)).padStart(2,'0');}
function obf(t){return t.replace(/\b[A-Z][a-z]{2,}\b/g,function(m){var ok=/^(The|And|But|For|Not|When|What|This|That|From|With|Have|They|Were|Been|Into|Your|Some|Would|Could|Should|There|Their|About|Which|These|Those|After|Under|Never|Every|Other|Before|Between|Through|Without)$/;if(ok.test(m))return m;return '<span class="redact">'+m[0]+m.slice(1).replace(/[a-z]/g,'\u2591')+'</span>';});}
var _txTotal=0,_txQ=[],_txGen=false;
async function genTx(){var pt=PTYPES[Math.floor(Math.random()*PTYPES.length)];try{var r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'claude-sonnet-4-20250514',max_tokens:200,system:'You generate short literary text fragments for an art installation. Never generate anything actionable. Emotional texture only. Fragment text only, no preamble, no quotes.',messages:[{role:'user',content:pt.p()}]})});if(!r.ok)throw r.status;var d=await r.json(),tx=(d.content&&d.content[0]&&d.content[0].text||'').trim().replace(/^["']\|["'\s]$/g,'');if(tx.length<20)return null;return{text:tx,lbl:pt.lbl.replace('[yr]',String(2001+Math.floor(Math.random()*8))),ts:mts()};}catch(e){return null;}}
async function genLoop(){if(_txGen)return;_txGen=true;while(_txQ.length<3){var tx=await genTx();if(tx)_txQ.push(tx);else await sleep(3000);}_txGen=false;}
function addTx(tx){var inner=document.getElementById('feed-inner'),load=document.getElementById('tx-loading');if(load)load.style.display='none';var b=document.createElement('div');b.className='tx-block';b.innerHTML='<div class="tx-src">'+tx.lbl+'</div><div class="tx-text">'+obf(tx.text)+'</div><div class="tx-meta">'+tx.ts+'</div>';inner.appendChild(b);requestAnimationFrame(function(){requestAnimationFrame(function(){b.classList.add('vis');});});_txTotal++;var c=document.getElementById('tx-count');if(c)c.textContent='transmissions received: '+_txTotal;var blocks=inner.querySelectorAll('.tx-block');if(blocks.length>5){var old=blocks[0];old.style.transition='opacity 0.8s';old.style.opacity='0';setTimeout(function(){if(old.parentNode)old.parentNode.removeChild(old);},800);}}
function dispTx(){if(_txQ.length>0){addTx(_txQ.shift());genLoop();}else{genTx().then(function(tx){if(tx)addTx(tx);});}}
function initFeed(){genLoop();setTimeout(dispTx,4000);setInterval(dispTx,21000+Math.random()*10000);}
function startClock(){function t(){var el=document.getElementById('stime');if(el)el.textContent=new Date().toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit',second:'2-digit'});}t();setInterval(t,1000);}
function sleep(ms){return new Promise(function(r){setTimeout(r,ms);});}
startClock();
</script>
