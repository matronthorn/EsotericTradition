<title>THE ALLEY</title>

<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;background:#010006;overflow:hidden;font-family:"Courier Prime",monospace;-webkit-text-size-adjust:100%;touch-action:manipulation;}
#gate{position:fixed;inset:0;z-index:500;background:#010006;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(0.9rem,2.2vh,1.6rem);cursor:pointer;transition:opacity 2.5s ease;}
.gate-rule{width:min(220px,55vw);height:1px;background:linear-gradient(to right,transparent,rgba(165,72,10,0.28),transparent);}
.gate-title{font-family:"IM Fell English",Georgia,serif;font-size:clamp(1.1rem,4vw,1.5rem);letter-spacing:0.5em;text-transform:uppercase;color:rgba(165,82,10,0.4);font-style:italic;}
.gate-sub{font-size:clamp(0.6rem,1.8vw,0.78rem);letter-spacing:0.35em;text-transform:uppercase;color:rgba(105,52,8,0.28);text-align:center;line-height:2.3;}
.gate-enter{font-size:clamp(0.55rem,1.5vw,0.7rem);letter-spacing:0.5em;text-transform:uppercase;color:rgba(92,46,8,0.3);border:1px solid rgba(125,58,8,0.12);padding:0.6rem 1.5rem;margin-top:0.5rem;animation:gb 3s ease-in-out infinite;}
@keyframes gb{0%,100%{opacity:0.35;}50%{opacity:1;}}
#scene{position:fixed;inset:0;z-index:1;display:none;flex-direction:column;}
#tv-zone{position:relative;flex:0 0 auto;height:60vh;overflow:hidden;background:#000;}
@media(orientation:landscape){#tv-zone{height:72vh;}}
@media(min-width:900px){#tv-zone{height:74vh;}}
#compositor{position:absolute;inset:0;width:100%;height:100%;display:block;z-index:10;}
#rain-canvas{position:absolute;inset:0;width:100%;height:100%;z-index:20;pointer-events:none;}
#vpool{position:fixed;top:-3000px;left:0;width:320px;height:240px;overflow:hidden;opacity:0.001;pointer-events:none;z-index:-1;}
#vpool video{position:absolute;top:0;left:0;width:320px;height:240px;}
#feed-zone{flex:1;position:relative;z-index:30;display:flex;flex-direction:column;align-items:center;overflow:hidden;padding:0 clamp(0.8rem,3vw,2rem);background:linear-gradient(to bottom,rgba(1,0,5,0.92) 0%,rgba(2,1,8,1) 12%,#010006 100%);border-top:1px solid rgba(105,48,6,0.1);min-height:0;}
#feed-status{display:flex;align-items:center;gap:0.7rem;width:100%;max-width:640px;padding:clamp(0.28rem,0.7vh,0.42rem) 0;border-bottom:1px solid rgba(105,48,6,0.08);flex-shrink:0;}
.sdot{width:4px;height:4px;border-radius:50%;background:rgba(165,72,10,0.5);animation:dp 2.5s ease-in-out infinite;flex-shrink:0;}
@keyframes dp{0%,100%{opacity:0.25;}50%{opacity:1;}}
.stext{font-size:clamp(0.55rem,1.4vw,0.68rem);letter-spacing:0.32em;text-transform:uppercase;color:rgba(105,52,8,0.4);}
.stime{margin-left:auto;font-size:clamp(0.5rem,1.1vw,0.62rem);letter-spacing:0.25em;color:rgba(82,40,6,0.28);}
#controls{display:flex;align-items:center;gap:0.6rem;flex-wrap:wrap;width:100%;max-width:640px;padding:clamp(0.22rem,0.55vh,0.35rem) 0;border-bottom:1px solid rgba(105,48,6,0.06);flex-shrink:0;}
.ctrl{font-family:"Courier Prime",monospace;font-size:clamp(0.55rem,1.3vw,0.65rem);letter-spacing:0.3em;text-transform:uppercase;color:rgba(95,48,8,0.38);background:transparent;border:1px solid rgba(105,48,6,0.12);padding:0.28rem 0.7rem;cursor:pointer;transition:all 0.35s;white-space:nowrap;-webkit-tap-highlight-color:transparent;}
.ctrl.on{color:rgba(215,125,28,0.78);border-color:rgba(165,78,10,0.3);background:rgba(75,28,5,0.25);}
#feed-track{flex:1;width:100%;max-width:640px;position:relative;overflow:hidden;min-height:0;}
#feed-inner{position:absolute;bottom:0;left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:0;}
.tx-block{width:100%;padding:clamp(0.55rem,1.4vh,0.95rem) 0;border-top:1px solid rgba(105,48,6,0.07);display:flex;flex-direction:column;align-items:center;gap:0.32rem;opacity:0;transform:translateY(8px);transition:opacity 1.8s ease,transform 1.8s ease;}
.tx-block.vis{opacity:1;transform:translateY(0);}
.tx-src{font-size:clamp(0.5rem,1.1vw,0.62rem);letter-spacing:0.42em;text-transform:uppercase;color:rgba(100,50,8,0.32);}
.tx-text{font-family:"IM Fell English",Georgia,serif;font-size:clamp(0.8rem,1.9vw,1.02rem);line-height:1.88;color:rgba(196,180,154,0.65);font-style:italic;text-align:center;letter-spacing:0.02em;max-width:520px;}
.tx-text .redact{color:rgba(90,48,10,0.35);}

@keyframes lp{0%,100%{opacity:0.2;}50%{opacity:0.72;}}

<script>
'use strict';

var BASE = 'https://raw.githubusercontent.com/matronthorn/EsotericTradition/main/alley/';
var BG_SRC    = BASE + 'bg.jpg';
var HW_SRC    = BASE + 'hw.png';
var MUSIC_SRC = BASE + 'VII.mp3';

// Your 3 uploaded videos — used as interstitials between other content

// ════════════════════════════════════════════════════════════
// VIDEO SOURCES
// Primary: your GitHub-hosted mp4s (fetched via GitHub API)
// Secondary: Internet Archive (fetched at runtime via search API)
// ════════════════════════════════════════════════════════════

// Resolved pools — filled at runtime
var MY_VIDS = [BASE+'vid1.mp4', BASE+'vid2.mp4', BASE+'vid3.mp4']; // fallback
var IA_POOLS = {
  fashion:[], crime:[], war:[], occult:[], pop:[], kids:[], funeral:[], night:[], medical:[]
};

// IA search queries — one per category
var IA_QUERIES = {
  fashion:  'subject:(fashion OR beauty OR cosmetics OR clothing OR lingerie OR makeup) AND mediatype:movies AND format:MPEG4',
  crime:    'subject:(crime OR murder OR "serial killer" OR detective OR criminal OR noir) AND mediatype:movies AND format:MPEG4',
  war:      'subject:(war OR propaganda OR "civil defense" OR military OR atomic OR bomb) AND mediatype:movies AND format:MPEG4',
  occult:   'subject:(witchcraft OR horror OR occult OR satanism OR supernatural OR zombie) AND mediatype:movies AND format:MPEG4',
  pop:      'subject:(music OR jazz OR dancing OR musical OR performance OR cabaret) AND mediatype:movies AND format:MPEG4',
  kids:     'subject:(children OR educational OR safety OR school OR juvenile) AND mediatype:movies AND format:MPEG4 AND collection:prelinger',
  funeral:  'subject:(death OR funeral OR mourning OR burial OR mortality OR corpse) AND mediatype:movies AND format:MPEG4',
  night:    'subject:(nightlife OR city OR neon OR nightclub OR urban OR burlesque) AND mediatype:movies AND format:MPEG4',
  medical:  'subject:(medical OR health OR surgery OR drug OR addiction OR anatomy) AND mediatype:movies AND format:MPEG4',
};

async function fetchMyVideos() {
  try {
    var resp = await fetch('https://api.github.com/repos/matronthorn/EsotericTradition/contents/alley?ref=main');
    if (!resp.ok) throw 0;
    var files = await resp.json();
    var mp4s = files.filter(function(f){ return f.name.toLowerCase().endsWith('.mp4'); })
                    .map(function(f){ return f.download_url; });
    if (mp4s.length) MY_VIDS = mp4s;
  } catch(e) {}
}

async function fetchIAVideos() {
  var cats = Object.keys(IA_QUERIES);
  await Promise.all(cats.map(fetchCat));
}

async function fetchCat(cat) {
  try {
    var q = encodeURIComponent(IA_QUERIES[cat]);
    var offset = Math.floor(Math.random() * 50);
    var url = 'https://archive.org/advancedsearch.php?q=' + q +
      '&fl[]=identifier&rows=10&start=' + offset + '&sort[]=random&output=json';
    var resp = await fetch(url);
    if (!resp.ok) return;
    var data = await resp.json();
    var docs = (data.response && data.response.docs) || [];
    await Promise.all(docs.slice(0, 6).map(function(doc) {
      return fetchFileURL(doc.identifier, cat);
    }));
  } catch(e) {}
}

async function fetchFileURL(identifier, cat) {
  try {
    var resp = await fetch('https://archive.org/metadata/' + identifier + '/files');
    if (!resp.ok) return;
    var data = await resp.json();
    var files = data.result || [];
    // Prefer small 512kb version for fast loading, fall back to .ia.mp4
    var mp4 = files.find(function(f){ return f.name && f.name.endsWith('_512kb.mp4'); }) ||
               files.find(function(f){ return f.name && f.name.endsWith('.ia.mp4'); }) ||
               files.find(function(f){ return f.name && /\.mp4$/i.test(f.name) && !f.name.includes('thumb') && !f.name.includes('sample'); });
    if (mp4) {
      IA_POOLS[cat].push('https://archive.org/download/' + identifier + '/' + encodeURIComponent(mp4.name));
    }
  } catch(e) {}
}

function pickSrc(cat, forceOwn) {
  if (forceOwn || IA_POOLS[cat].length === 0 || Math.random() < 0.2) {
    return MY_VIDS[Math.floor(Math.random() * MY_VIDS.length)];
  }
  var pool = IA_POOLS[cat];
  return pool[Math.floor(Math.random() * pool.length)];
}

// Screen layout: 45 screens with category assignments and border-radius
var SCREENS = [

  {id:6,  x1:287,y1:291,x2:396,y2:369, r:33,cat:'occult'},
  {id:7,  x1:98, y1:441,x2:191,y2:510, r:18,cat:'kids'},
  {id:8,  x1:290,y1:405,x2:396,y2:483, r:21,cat:'medical'},
  {id:9,  x1:774,y1:144,x2:866,y2:207, r:2, cat:'fashion'},
  {id:10, x1:425,y1:266,x2:516,y2:325, r:10,cat:'war'},
  {id:11, x1:1056,y1:413,x2:1126,y2:490,r:8,cat:'crime'},
  {id:12, x1:1029,y1:241,x2:1123,y2:306,r:29,cat:'occult'},
  {id:13, x1:540,y1:327,x2:612,y2:381, r:14,cat:'kids'},
  {id:14, x1:662,y1:327,x2:733,y2:382, r:17,cat:'fashion'},
  {id:15, x1:543,y1:114,x2:613,y2:169, r:26,cat:'funeral'},
  {id:16, x1:940,y1:462,x2:1010,y2:512,r:12,cat:'crime'},
  {id:17, x1:765,y1:228,x2:834,y2:279, r:14,cat:'war'},
  {id:18, x1:440,y1:336,x2:508,y2:387, r:15,cat:'occult'},
  {id:19, x1:637,y1:236,x2:703,y2:287, r:6, cat:'pop'},
  {id:20, x1:919,y1:414,x2:1008,y2:447,r:7, cat:'night'},
  {id:21, x1:144,y1:323,x2:237,y2:386, r:16,cat:'medical'},

  {id:24, x1:386,y1:186,x2:446,y2:233, r:21,cat:'crime'},
  {id:25, x1:915,y1:212,x2:973,y2:256, r:14,cat:'occult'},
  {id:26, x1:558,y1:238,x2:615,y2:281, r:17,cat:'kids'},
  {id:27, x1:711,y1:106,x2:770,y2:159, r:20,cat:'funeral'},
  {id:28, x1:616,y1:167,x2:673,y2:209, r:16,cat:'pop'},

  {id:34, x1:559,y1:188,x2:602,y2:230, r:2, cat:'war'},
  {id:35, x1:320,y1:214,x2:361,y2:256, r:8, cat:'occult'},
  {id:36, x1:858,y1:87, x2:904,y2:125, r:20,cat:'night'},
  {id:37, x1:720,y1:45, x2:767,y2:81,  r:19,cat:'pop'},
  {id:38, x1:635,y1:109,x2:683,y2:145, r:20,cat:'crime'},
  {id:39, x1:784,y1:87, x2:829,y2:125, r:21,cat:'medical'},
  {id:40, x1:556,y1:49, x2:599,y2:89,  r:19,cat:'funeral'},
  {id:41, x1:1052,y1:181,x2:1097,y2:217,r:21,cat:'occult'},
  {id:42, x1:905,y1:131,x2:952,y2:166, r:21,cat:'fashion'},
  {id:43, x1:476,y1:141,x2:520,y2:175, r:15,cat:'war'},
  {id:44, x1:411,y1:141,x2:453,y2:175, r:17,cat:'kids'},
  {id:45, x1:257,y1:315,x2:276,y2:384, r:10,cat:'night'},
];
var SRC_W=1280, SRC_H=720;

var STARTED=false, _bgImg=null, _hwImg=null, _vids={}, _frame=0;
var _noiseOn=true, _musicOn=true, _rainOn=true;
var _rdrops=[], _rctx=null;
var _noiseC=document.createElement('canvas'), _noiseX=_noiseC.getContext('2d');

// ════════════════════════════════════════════════════════════
// ENTRY
// ════════════════════════════════════════════════════════════
function enterAlley() {
  if (STARTED) return; STARTED=true;
  var gate=document.getElementById('gate');
  gate.style.opacity='0'; gate.style.pointerEvents='none';
  setTimeout(function() {
    gate.style.display='none';
    // Show scene FIRST — so offsetWidth/Height are real values
    document.getElementById('scene').style.display='flex';
    sizeCanvases();
    var dbt; window.addEventListener('resize',function(){clearTimeout(dbt);dbt=setTimeout(sizeCanvases,150);});
    // Load images
    var n=0; function chk(){if(++n>=2)requestAnimationFrame(compositorFrame);}
    _bgImg=new Image(); _bgImg.crossOrigin='anonymous';
    _bgImg.onload=chk; _bgImg.onerror=chk; _bgImg.src=BG_SRC;
    _hwImg=new Image(); _hwImg.crossOrigin='anonymous';
    _hwImg.onload=chk; _hwImg.onerror=chk; _hwImg.src=HW_SRC;
    setTimeout(function(){if(n<2){n=2;requestAnimationFrame(compositorFrame);}},5000);
    // Start own videos immediately — don't wait for IA
    fetchMyVideos().then(function(){ loadVideos(); });
    // Fetch IA in background — reshuffles screens progressively as pools fill
    fetchIAVideos().then(function(){ reshuffleVids(); });
    // Start everything else immediately (screens show static until videos load)
    initRain(); initMusic(); initFeed(); startClock();
  }, 2500);
}

function sizeCanvases() {
  var tz=document.getElementById('tv-zone');
  var w=tz.offsetWidth, h=tz.offsetHeight; if(!w||!h) return;
  ['compositor','rain-canvas'].forEach(function(id){var c=document.getElementById(id);c.width=w;c.height=h;});
  _noiseC.width=w; _noiseC.height=h;
  spawnRain(w,h);
}

// ════════════════════════════════════════════════════════════
// VIDEO LOADING
// No crossOrigin on video elements — not needed for canvas drawImage.
// Videos live in #vpool which is always rendered (outside #scene).
// Your 3 videos appear as interstitials: every 4th screen slot uses one.
// pickSrc() defined above in VIDEO SOURCES section — uses IA_POOLS
// ════════════════════════════════════════════════════════════
function makeVid(src) {
  var v=document.createElement('video');
  v.loop=true; v.muted=true; v.playsinline=true;
  v.setAttribute('playsinline',''); v.preload='auto'; v.src=src;
  document.getElementById('vpool').appendChild(v);
  v.addEventListener('canplay',function(){
    try{if(v.duration>1)v.currentTime=Math.random()*Math.min(v.duration*0.7,90);}catch(e){}
    v.play().catch(function(){});
  },{once:true});
  v.addEventListener('error',function(){
    // If archive.org URL fails, silently fall back to one of your own videos
    v.src=MY_VIDS[Math.floor(Math.random()*MY_VIDS.length)]; v.load();
  });
  v.load(); return v;
}

function loadVideos() {
  SCREENS.forEach(function(s,i){
    // Every 4th screen gets one of your own videos as an interstitial
    _vids[s.id]=makeVid(pickSrc(s.cat, i%4===0));
  });
  setInterval(reshuffleVids, 28000+Math.random()*22000);
}

function reshuffleVids() {
  var n=6+Math.floor(Math.random()*6);
  SCREENS.slice().sort(function(){return Math.random()-0.5;}).slice(0,n).forEach(function(s){
    var old=_vids[s.id]; if(old){old.pause();try{old.remove();}catch(e){}}
    _vids[s.id]=makeVid(pickSrc(s.cat));
  });
}

// ════════════════════════════════════════════════════════════
// COMPOSITOR
// ════════════════════════════════════════════════════════════
function compositorFrame() {
  _frame++;
  var c=document.getElementById('compositor'), ctx=c.getContext('2d');
  var W=c.width, H=c.height; if(!W||!H){requestAnimationFrame(compositorFrame);return;}
  var sx=W/SRC_W, sy=H/SRC_H;

  // 1. Background — moderately dark, not crushed
  if(_bgImg&&_bgImg.complete&&_bgImg.naturalWidth){
    ctx.drawImage(_bgImg,0,0,W,H);
    ctx.fillStyle='rgba(0,0,0,0.62)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='rgba(4,2,18,0.15)'; ctx.fillRect(0,0,W,H);
  } else {
    ctx.fillStyle='#010006'; ctx.fillRect(0,0,W,H);
  }

  // 2. Screen glow pass — drawn BEFORE hardware overlay so light bleeds
  //    onto the chassis. For each active screen, radiate soft light outward.
  SCREENS.forEach(function(s){
    var v=_vids[s.id]; if(!v||v.readyState<2) return;
    var dx=s.x1*sx, dy=s.y1*sy, dw=(s.x2-s.x1)*sx, dh=(s.y2-s.y1)*sy;
    var cx2=dx+dw/2, cy2=dy+dh/2;
    var glowR=Math.max(dw,dh)*1.4; // glow radius — larger than screen
    // Warm phosphor glow: slightly blue-white tinted
    var g=ctx.createRadialGradient(cx2,cy2,Math.min(dw,dh)*0.2, cx2,cy2,glowR);
    g.addColorStop(0,'rgba(200,215,255,0.18)');
    g.addColorStop(0.4,'rgba(160,185,240,0.08)');
    g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=g;
    ctx.fillRect(cx2-glowR, cy2-glowR, glowR*2, glowR*2);
  });

  // 3. Video into each screen — full brightness, minimal inner darkening
  SCREENS.forEach(function(s){
    var v=_vids[s.id]; if(!v||v.readyState<2) return;
    var dx=s.x1*sx, dy=s.y1*sy, dw=(s.x2-s.x1)*sx, dh=(s.y2-s.y1)*sy;
    var rad=(s.r/100)*Math.min(dw,dh);
    ctx.save(); rrect(ctx,dx,dy,dw,dh,rad); ctx.clip();
    // Draw video at full brightness
    ctx.drawImage(v,dx,dy,dw,dh);
    // Very light phosphor bloom — brightens center slightly
    var bloom=ctx.createRadialGradient(dx+dw/2,dy+dh/2,0, dx+dw/2,dy+dh/2,Math.max(dw,dh)*0.7);
    bloom.addColorStop(0,'rgba(255,255,240,0.12)');
    bloom.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=bloom; ctx.fillRect(dx,dy,dw,dh);
    // Subtle edge darkening only (not center)
    var edge=ctx.createRadialGradient(dx+dw/2,dy+dh/2,Math.min(dw,dh)*0.3, dx+dw/2,dy+dh/2,Math.max(dw,dh)*0.75);
    edge.addColorStop(0,'rgba(0,0,0,0)');
    edge.addColorStop(1,'rgba(0,0,0,0.28)');
    ctx.fillStyle=edge; ctx.fillRect(dx,dy,dw,dh);
    ctx.restore();
  });

  // 4. Hardware overlay — less aggressively darkened so glow shows through
  if(_hwImg&&_hwImg.complete&&_hwImg.naturalWidth){
    ctx.drawImage(_hwImg,0,0,W,H);
    // Darken hardware chassis but leave some ambient light from screens
    ctx.globalCompositeOperation='source-atop';
    ctx.fillStyle='rgba(0,0,0,0.52)'; ctx.fillRect(0,0,W,H);
    ctx.fillStyle='rgba(4,2,18,0.12)'; ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation='source-over';
  }

  // 5. Scanlines — lighter so screens remain readable
  ctx.fillStyle='rgba(0,0,0,0.10)';
  for(var y=0;y<H;y+=3) ctx.fillRect(0,y+2,W,1);

  // 6. Noise grain (every 3rd frame)
  if(_noiseOn&&_frame%3===0){
    var img=_noiseX.createImageData(W,H), d=img.data;
    for(var i=0;i<d.length;i+=4){var v2=Math.random()*255|0;d[i]=d[i+1]=d[i+2]=v2;d[i+3]=10;}
    _noiseX.putImageData(img,0,0);
    ctx.globalCompositeOperation='overlay'; ctx.drawImage(_noiseC,0,0);
    ctx.globalCompositeOperation='source-over';
  }

  // 7. Vignette — softer, so edges don't crush the outer TVs
  var vg=ctx.createRadialGradient(W/2,H/2,H*0.28,W/2,H/2,H*0.95);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,0.52)');
  ctx.fillStyle=vg; ctx.fillRect(0,0,W,H);

  requestAnimationFrame(compositorFrame);
}

function rrect(ctx,x,y,w,h,r){
  r=Math.max(0,Math.min(r,w/2,h/2));
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.arcTo(x+w,y,x+w,y+r,r);
  ctx.lineTo(x+w,y+h-r); ctx.arcTo(x+w,y+h,x+w-r,y+h,r);
  ctx.lineTo(x+r,y+h); ctx.arcTo(x,y+h,x,y+h-r,r);
  ctx.lineTo(x,y+r); ctx.arcTo(x,y,x+r,y,r); ctx.closePath();
}

function initRain(){
  var c=document.getElementById('rain-canvas'); _rctx=c.getContext('2d');
  var lt=0;
  (function loop(t){
    var dt=lt?Math.min(t-lt,80):16; lt=t;
    var w=c.width,h=c.height;
    if(_rainOn&&w&&h){
      _rctx.clearRect(0,0,w,h);
      var step=dt/16;
      _rdrops.forEach(function(d){
        _rctx.beginPath(); _rctx.moveTo(d.x,d.y); _rctx.lineTo(d.x-d.len*0.1,d.y+d.len);
        _rctx.strokeStyle='rgba(155,180,205,'+d.op+')'; _rctx.lineWidth=d.wd; _rctx.stroke();
        d.y+=d.spd*step; d.x-=d.spd*step*0.05;
        if(d.y>h+d.len){d.y=-d.len;d.x=Math.random()*w;}
      });
    }
    requestAnimationFrame(loop);
  })(0);
}
function spawnRain(w,h){
  _rdrops=[];
  for(var i=0;i<130;i++) _rdrops.push({x:Math.random()*w,y:Math.random()*h,len:9+Math.random()*20,spd:4+Math.random()*11,op:0.05+Math.random()*0.18,wd:0.45+Math.random()*0.75});
}

function makeTs(){
  var mm=['jan','feb','mar','apr','may','jun','jul','aug','sep','oct','nov','dec'];
  var y=2001+Math.floor(Math.random()*8);
  var h=Math.floor(Math.random()*5)+22; if(h>23)h-=24;
  return mm[Math.floor(Math.random()*12)]+' '+(1+Math.floor(Math.random()*28))+', '+y+
    ' · '+String(h).padStart(2,'0')+':'+String(Math.floor(Math.random()*60)).padStart(2,'0');
}
function obf(t){
  return t.replace(/\b[A-Z][a-z]{2,}\b/g,function(m){
    var ok=/^(The|And|But|For|Not|When|What|This|That|From|With|Have|They|Were|Been|Into|Your|Some|Would|Could|Should|There|Their|About|Which|These|Those|After|Under|Never|Every|Other|Before|Between|Through|Without|Monday|Tuesday|Wednesday|Thursday|Friday|Saturday|Sunday|January|February|March|April|June|July|August|September|October|November|December)$/;
    if(ok.test(m))return m;
    return '<span class="redact">'+m[0]+m.slice(1).replace(/[a-z]/g,'\u2591')+'</span>';
  });
}

var _txTotal=0, _txQ=[], _txGen=false, _apiWorking=true;

async function genTxAPI(){
  var pt=API_PTYPES[Math.floor(Math.random()*API_PTYPES.length)];
  try{
    var resp=await fetch('https://api.anthropic.com/v1/messages',{
      method:'POST',
      headers:{'Content-Type':'application/json','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({
        model:'claude-sonnet-4-20250514',max_tokens:220,
        system:'You generate raw, dark, confessional text fragments for a conceptual art installation exploring human despair and crisis. The content is intentionally disturbing, representing real human suffering. Generate the requested fragment with full emotional authenticity. Never include actionable self-harm instructions, methods, or encouragement to act. Emotional expression only. Fragment text only — no preamble, no title, no quotation marks.',
        messages:[{role:'user',content:pt.p()}]
      })
    });
    if(!resp.ok)throw resp.status;
    var data=await resp.json();
    var text=(data.content&&data.content[0]&&data.content[0].text||'').trim();
    text=text.replace(/^["']/,'').replace(/["']$/,'');
    if(text.length<20)return null;
    return {text:text,lbl:pt.lbl.replace('[yr]',String(2001+Math.floor(Math.random()*8))),ts:makeTs()};
  }catch(e){_apiWorking=false;return null;}
}

function genTxLocal(){
  var text=nextFrag();
  var lbl=LABELS[Math.floor(Math.random()*LABELS.length)]+' '+(2001+Math.floor(Math.random()*8));
  return {text:text,lbl:lbl,ts:makeTs()};
}

async function genTx(){
  if(_apiWorking){
    var tx=await genTxAPI();
    if(tx) return tx;
  }
  return genTxLocal();
}

async function genLoop(){
  if(_txGen)return; _txGen=true;

  _txGen=false;
}

  b.innerHTML='<div class="tx-src">'+tx.lbl+'</div><div class="tx-text">'+obf(tx.text)+'</div><div class="tx-meta">'+tx.ts+'</div>';
